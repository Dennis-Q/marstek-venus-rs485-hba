    icon: mdi:chart-line
  hba_strategy_dynamic_default:
    name: "Dynamic fallback strategy"
    options:
      - "Charge PV"
      - "Self-consumption"
      - "Zero import"
      - "Standby / peak shave"
      - "Solar-aware"
      - "Full stop"
    icon: mdi:battery-sync
  hba_strategy_dynamic_cheapest:
    name: "Cheap period strategy"
    options:
      - "Charge"
      - "Charge PV"
      - "Standby / peak shave"
    icon: mdi:battery-charging-low
  hba_strategy_dynamic_expensive:
    name: "Expensive period strategy"
    options:
      - "Self-consumption"
      - "Sell"
      - "Zero import"
      - "Standby / peak shave"
    icon: mdi:battery-high
  hba_strategy_charge_goal:
    name: "Charge goal"
    options:
      - "batteries are full"
      - "state of charge"
      - "energy reserve"
      - "solar forecast"
    icon: mdi:battery-charging-100
  hba_strategy_sell_goal:
    name: "Sell goal"
    options:
      - "batteries are empty"
      - "state of charge"
      - "energy reserve"
    icon: mdi:battery-charging-outline
  hba_strategy_charge_goal_reached:
    name: "When done charging, switch to"
    options:
      - "Full stop"
      - "Self-consumption"
      - "Charge PV"
      - "Charge PV — use battery if the sun refills it"
      - "Sell"
      - "Zero import"
      - "Standby / peak shave"
      - "Solar-aware"
    icon: mdi:battery-check-outline
  hba_strategy_sell_goal_reached:
    name: "When done selling, switch to"
    options:
      - "Full stop"
      - "Self-consumption"
      - "Charge PV"
      - "Zero import"
      - "Charge"
      - "Standby / peak shave"
      - "Solar-aware"
    icon: mdi:battery-arrow-down-outline
  hba_control_priority_change_interval:
    name: "Priority battery change interval"
    options:
      # HBA-only: order by SoC every 30 min (sensor.hba_battery_order). First, so a
      # fresh install starts with it (HBA default; HBC's is the plain rotation below).
      - "Auto balance (SoC)"
      - "Auto balance"
      - "Weekly"
      - "Daily"
      - "Never"
    icon: mdi:rotate-right
  # Phase each battery is connected to (single-phase inverters). Used by "Charge
  # alongside EV" to keep each phase under the limit; "Not set" counts a battery
  # against every phase (safe, but it gets the least room).
  hba_marstek_m1_phase:
    name: "M1 phase"
    options: ["Not set", "L1", "L2", "L3"]
    icon: mdi:sine-wave
  hba_marstek_m2_phase:
    name: "M2 phase"
    options: ["Not set", "L1", "L2", "L3"]
    icon: mdi:sine-wave
  hba_marstek_m3_phase:
    name: "M3 phase"
    options: ["Not set", "L1", "L2", "L3"]
    icon: mdi:sine-wave
  hba_marstek_m4_phase:
    name: "M4 phase"
    options: ["Not set", "L1", "L2", "L3"]
    icon: mdi:sine-wave
  hba_marstek_m5_phase:
    name: "M5 phase"
    options: ["Not set", "L1", "L2", "L3"]
    icon: mdi:sine-wave
  hba_marstek_m6_phase:
    name: "M6 phase"
    options: ["Not set", "L1", "L2", "L3"]
    icon: mdi:sine-wave
  # Power group per battery. "Own" (first option = what a new install gets) leaves the
  # battery's limit registers alone — exactly the behaviour before power groups.
  hba_marstek_m1_power_group:
    name: "M1 power group"
    options: ["Own", "A", "B", "C"]
    icon: mdi:fuse
  hba_marstek_m2_power_group:
    name: "M2 power group"
    options: ["Own", "A", "B", "C"]
    icon: mdi:fuse
  hba_marstek_m3_power_group:
    name: "M3 power group"
    options: ["Own", "A", "B", "C"]
    icon: mdi:fuse
  hba_marstek_m4_power_group:
    name: "M4 power group"
    options: ["Own", "A", "B", "C"]
    icon: mdi:fuse
  hba_marstek_m5_power_group:
    name: "M5 power group"
    options: ["Own", "A", "B", "C"]
    icon: mdi:fuse
  hba_marstek_m6_power_group:
    name: "M6 power group"
    options: ["Own", "A", "B", "C"]
    icon: mdi:fuse
  # How a group shares its max power over its batteries:
  #   Follow battery order — (default) the group's battery that HBA uses first right now
  #                  (Auto balance (SoC) order, else the priority rotation) gets as much
  #                  as it can, the others the rest. HBA fills batteries one by one, so
  #                  this lets one battery run up to its max before a second one starts:
  #                  each running battery costs a fixed ~20-25 W (prod 2026-10-24:
  #                  discharge efficiency ~58-74 % below 200 W, 87-90 % at 200-500 W,
  #                  93-94 % from 500 W up to 2500 W). It hands over to the next first
  #                  battery only when that one is 5 SoC points further along (or the
  #                  leader is full / empty) — fewer EEPROM rewrites of the limits
  #   Equal        — the same share each (never above a battery's own max power); a
  #                  full (charging) or empty (discharging) battery hands its share on
  #   One at a time — one battery gets as much as it can, the others the rest; it keeps
  #                  that until it is full / empty
  hba_power_group_a_policy:
    name: "Power group A spread policy"
    options: ["Follow battery order", "Equal", "One at a time"]
    icon: mdi:call-split
  hba_power_group_b_policy:
    name: "Power group B spread policy"
    options: ["Follow battery order", "Equal", "One at a time"]
    icon: mdi:call-split
  hba_power_group_c_policy:
    name: "Power group C spread policy"
    options: ["Follow battery order", "Equal", "One at a time"]
    icon: mdi:call-split

template:
  - sensor:
      - name: "HBA Version"
        unique_id: hba_version
        icon: mdi:tag
        state: "v4.10.1-r21"

      - name: "HBA Active strategy"
        unique_id: hba_active_strategy
        icon: mdi:list-status
        state: >
          {% set flow = states('input_text.hba_strategy_active_flow') %}
          {% if flow in ['', 'unknown', 'unavailable'] %}
            {{ flow }}
          {% else %}
            {{ flow.split(' → ')[-1] }}
          {% endif %}

      - name: "HBA Total Battery Power"
        unique_id: hba_total_battery_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(total=0) %}
          {% for i in range(1, count + 1) %}
            {% set ns.total = ns.total + states('sensor.marstek_m' ~ i ~ '_ac_power') | float(0) %}
          {% endfor %}
          {{ ns.total | round(0) | int }}

      - name: "HBA Total Commanded Power"
        unique_id: hba_total_commanded_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:flash
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(total=0) %}
          {% for i in range(1, count + 1) %}
            {% set mode = states('select.marstek_m' ~ i ~ '_forcible_charge_discharge') %}
            {% set cp = states('number.marstek_m' ~ i ~ '_forcible_charge_power') | float(0) %}
            {% set dp = states('number.marstek_m' ~ i ~ '_forcible_discharge_power') | float(0) %}
            {% if mode == 'charge' %}
              {% set ns.total = ns.total + cp %}
            {% elif mode == 'discharge' %}
              {% set ns.total = ns.total - dp %}
            {% endif %}
          {% endfor %}
          {{ ns.total | round(0) | int }}

      - name: "HBA Time Remaining"
        unique_id: hba_time_remaining
        icon: mdi:timer
        state: >
          {% set power = [states('sensor.hba_total_battery_power') | float(0), 0] | max %}
          {% set capacity_kwh = states('sensor.hba_charge_available_energy') | float(0) %}
          {% if power > 0 and capacity_kwh > 0 %}
            {% set time_hrs = (capacity_kwh * 1000) / power %}
            {% set hrs = time_hrs | int %}
            {% set minutes = ((time_hrs - hrs) * 60) | int %}
            {{ '{:02}:{:02}'.format(hrs, minutes) }} hours ({{ capacity_kwh | round(2) }} kWh)
          {% else %}
            Charging ({{ capacity_kwh | round(2) }} kWh)
          {% endif %}

      - name: "HBA Charge Remaining Energy"
        unique_id: hba_charge_remaining_energy
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(total=0) %}
          {% for i in range(1, count + 1) %}
            {% set soc = states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') | float(0) %}
            {% set cap = states('sensor.marstek_m' ~ i ~ '_battery_total_energy') | float(0) %}
            {% set soc_max = states('input_number.hba_marstek_m' ~ i ~ '_charging_cutoff_capacity') | float(100) %}
            {% set ns.total = ns.total + ([((soc_max - soc) / 100) * cap, 0] | max) %}
          {% endfor %}
          {{ ns.total | round(2) }}

      - name: "HBA Charge Available Energy"
        unique_id: hba_charge_available_energy
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(total=0) %}
          {% for i in range(1, count + 1) %}
            {% set soc = states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') | float(0) %}
            {% set cap = states('sensor.marstek_m' ~ i ~ '_battery_total_energy') | float(0) %}
            {% set soc_min = states('input_number.hba_marstek_m' ~ i ~ '_discharging_cutoff_capacity') | float(13) %}
            {% set ns.total = ns.total + ([((soc - soc_min) / 100) * cap, 0] | max) %}
          {% endfor %}
          {{ ns.total | round(2) }}

      - name: "HBA Battery Assist Reserved Energy"
        unique_id: hba_battery_assist_reserved_energy
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery-lock
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set min_soc = states('input_number.hba_battery_assist_min_soc') | float(20) %}
          {% set ns = namespace(total=0) %}
          {% for i in range(1, count + 1) %}
            {% set cutoff = states('input_number.hba_marstek_m' ~ i ~ '_discharging_cutoff_capacity') | float(12) %}
            {% set extra = [0, min_soc - cutoff] | max %}
            {% set cap = states('sensor.marstek_m' ~ i ~ '_battery_total_energy') | float(0) %}
            {% set ns.total = ns.total + (extra / 100) * cap %}
          {% endfor %}
          {{ ns.total | round(2) }}

      - name: "HBA Total Max Charge Power"
        unique_id: hba_total_max_charge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:flash-triangle
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(total=0) %}
          {#- A read-back of 0 after a battery restart: use its last known limit -#}
          {% set lk = state_attr('sensor.hba_power_limits', 'last_known_charge') %}
          {% set lk = lk if lk is mapping else {} %}
          {% for i in range(1, count + 1) %}
            {% set pw = states('number.marstek_m' ~ i ~ '_max_charge_power') | float(0) %}
            {% set pw = pw if pw > 50 else (lk[i | string] if (i | string) in lk else 2500) %}
            {#- capped at what the BMS allows now (see hba_set_batteries) -#}
            {% set bms_a = states('sensor.marstek_m' ~ i ~ '_battery_charge_current_limit') | float(-1) %}
            {% set volt = states('sensor.marstek_m' ~ i ~ '_battery_voltage') | float(0) %}
            {% set ns.total = ns.total + ([pw, (bms_a * volt) | int] | min if bms_a >= 0 and volt > 40 else pw) %}
          {% endfor %}
          {{ ns.total | int }}

      - name: "HBA Total Max Discharge Power"
        unique_id: hba_total_max_discharge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:flash-triangle
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(total=0) %}
          {#- A read-back of 0 after a battery restart: use its last known limit -#}
          {% set lk = state_attr('sensor.hba_power_limits', 'last_known_discharge') %}
          {% set lk = lk if lk is mapping else {} %}
          {% for i in range(1, count + 1) %}
            {% set pw = states('number.marstek_m' ~ i ~ '_max_discharge_power') | float(0) %}
            {% set ns.total = ns.total + (pw if pw > 50 else (lk[i | string] if (i | string) in lk else 2500)) %}
          {% endfor %}
          {{ ns.total | int }}

      - name: "HBA Average Battery SoC"
        unique_id: hba_average_battery_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery-half
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(total=0) %}
          {% for i in range(1, count + 1) %}
            {% set ns.total = ns.total + states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') | float(0) %}
          {% endfor %}
          {{ (ns.total / count) | round(1) }}

      # ── Solar forecast distribution sensors (used by Charge → solar forecast goal cards)
      - name: "HBA Solar Forecast Today"
        unique_id: hba_solar_forecast_today
        unit_of_measurement: kWh
        device_class: energy
        state_class: total
        icon: mdi:weather-sunny
        state: >
          {% set e = states('input_text.hba_strategy_solar_forecast_entity_id') | trim %}
          {{ states(e) | float(0) if e not in ['', 'unknown', 'unavailable'] else 0 }}

      - name: "HBA Solar Forecast Tomorrow"
        unique_id: hba_solar_forecast_tomorrow
        unit_of_measurement: kWh
        device_class: energy
        state_class: total
        icon: mdi:weather-sunny
        state: >
          {% set e = states('input_text.hba_strategy_solar_forecast_tomorrow_entity_id') | trim %}
          {{ states(e) | float(0) if e not in ['', 'unknown', 'unavailable'] else 0 }}

      # Single source for today's solar surplus (charge target, distribution card,
      # "covers battery" and the Charge script all read it).
      #
      # The house reserve is a WHOLE-DAY amount but the charge goal uses the REMAINING
      # forecast, so it is scaled by the share of today's sun still to come:
      #   reserve_now = reserve x remaining / whole_day
      # Subtracting the full reserve from a shrinking remaining forecast made the target
      # run away during the day (prod 2026-10-01: 12.0 -> 18.0 kWh while the sun filled
      # the battery 9.4 -> 13.1 kWh) until any cheap afternoon slot charged from grid.
      # Scaled, target and available move together (shortfall 2.6 / 2.3 / 3.3 kWh at
      # 07 / 12 / 15 h that day). Before sunrise remaining == whole day, so nothing
      # changes then. Whole-day figure: the Solar-aware forecast entity (needs
      # ..._forecast_today); unset or identical to the remaining entity -> ratio 1, i.e.
      # the previous behaviour.
      - name: "HBA Solar Forecast Surplus Today"
        unique_id: hba_solar_forecast_surplus_today
        unit_of_measurement: kWh
        device_class: energy
        state_class: total
        icon: mdi:solar-power-variant
        state: >
          {% set e = states('input_text.hba_strategy_solar_forecast_entity_id') | trim %}
          {% set remaining = states(e) | float(0) if e not in ['', 'unknown', 'unavailable'] else 0 %}
          {% set w = states('input_text.hba_strategy_solar_aware_forecast_entity_id') | trim %}
          {% set whole = states(w) | float(0) if w not in ['', 'unknown', 'unavailable', e] else 0 %}
          {% set ratio = ([remaining / whole, 1] | min) if whole > 0 else 1 %}
          {% set reserved = states('input_number.hba_solar_reserved_for_house') | float(5) * ratio %}
          {{ [remaining - reserved, 0] | max | round(2) }}
        attributes:
          house_reserve_remaining: >
            {% set e = states('input_text.hba_strategy_solar_forecast_entity_id') | trim %}
            {% set remaining = states(e) | float(0) if e not in ['', 'unknown', 'unavailable'] else 0 %}
            {% set w = states('input_text.hba_strategy_solar_aware_forecast_entity_id') | trim %}
            {% set whole = states(w) | float(0) if w not in ['', 'unknown', 'unavailable', e] else 0 %}
            {% set ratio = ([remaining / whole, 1] | min) if whole > 0 else 1 %}
            {{ (states('input_number.hba_solar_reserved_for_house') | float(5) * ratio) | round(2) }}
          remaining_share: >
            {% set e = states('input_text.hba_strategy_solar_forecast_entity_id') | trim %}
            {% set remaining = states(e) | float(0) if e not in ['', 'unknown', 'unavailable'] else 0 %}
            {% set w = states('input_text.hba_strategy_solar_aware_forecast_entity_id') | trim %}
            {% set whole = states(w) | float(0) if w not in ['', 'unknown', 'unavailable', e] else 0 %}
            {{ (([remaining / whole, 1] | min) if whole > 0 else 1) | round(3) }}

      - name: "HBA Solar Forecast Surplus Tomorrow"
        unique_id: hba_solar_forecast_surplus_tomorrow
        unit_of_measurement: kWh
        device_class: energy
        state_class: total
        icon: mdi:solar-power-variant
        state: >
          {% set e = states('input_text.hba_strategy_solar_forecast_tomorrow_entity_id') | trim %}
          {% set forecast = states(e) | float(0) if e not in ['', 'unknown', 'unavailable'] else 0 %}
          {% set reserved = states('input_number.hba_solar_reserved_for_house') | float(5) %}
          {{ [forecast - reserved, 0] | max | round(2) }}

      # Usable capacity between the per-battery cutoffs -- single source for the charge
      # target, the distribution card and "surplus covers battery".
      - name: "HBA Usable Battery Energy"
        unique_id: hba_usable_battery_energy
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery-high
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(energy_max=0) %}
          {% for i in range(1, count + 1) %}
            {% set cap = states('sensor.marstek_m' ~ i ~ '_battery_total_energy') | float(0) %}
            {% set soc_max = states('input_number.hba_marstek_m' ~ i ~ '_charging_cutoff_capacity') | float(100) %}
            {% set soc_min = states('input_number.hba_marstek_m' ~ i ~ '_discharging_cutoff_capacity') | float(13) %}
            {% set ns.energy_max = ns.energy_max + (soc_max - soc_min) / 100 * cap %}
          {% endfor %}
          {{ ns.energy_max | round(2) }}

      # Solar-forecast charge goal: the energy the batteries should hold now (the grid
      # tops up the difference). Read by the Charge script, binary_sensor.hba_charge_goal_reached
      # and the Charge/Sell view.
      # Once today's sun is done (remaining forecast ~0) the next sun is TOMORROW's, so the
      # target switches to tomorrow's surplus. Today's alone made it "fill completely"
      # from sunset to midnight (prod 2026-10-01/02: 18 kWh with 29-32 kWh of sun
      # forecast for the next day) and then drop to 0 when Solcast rolled over -- a cheap
      # evening slot would have bought ~10 kWh the sun replaces anyway. After midnight
      # "today" is that same day again, so the evening now matches the night.
      # Only switches when both forecast entities are set; otherwise today, as before.
      # Afternoon only: a dark day's ~0 forecast must not switch in the morning.
      - name: "HBA Charge Target Energy"
        unique_id: hba_charge_target_energy
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery-arrow-up
        state: >
          {% set e = states('input_text.hba_strategy_solar_forecast_entity_id') | trim %}
          {% set t = states('input_text.hba_strategy_solar_forecast_tomorrow_entity_id') | trim %}
          {% set sun_done = e not in ['', 'unknown', 'unavailable'] and t not in ['', 'unknown', 'unavailable']
                            and states(e) | float(-1) >= 0 and states(e) | float(-1) < 0.1 and now().hour >= 12 %}
          {% set usable = states('sensor.hba_usable_battery_energy') | float(0) %}
          {% set surplus = states('sensor.hba_solar_forecast_surplus_' ~ ('tomorrow' if sun_done else 'today')) | float(0) %}
          {{ [usable - surplus, 0] | max | round(2) }}
        attributes:
          # 'today' or 'tomorrow': whose sun the target counts on.
          forecast_day: >
            {% set e = states('input_text.hba_strategy_solar_forecast_entity_id') | trim %}
            {% set t = states('input_text.hba_strategy_solar_forecast_tomorrow_entity_id') | trim %}
            {% set sun_done = e not in ['', 'unknown', 'unavailable'] and t not in ['', 'unknown', 'unavailable']
                              and states(e) | float(-1) >= 0 and states(e) | float(-1) < 0.1 and now().hour >= 12 %}
            {{ 'tomorrow' if sun_done else 'today' }}
          # The solar surplus behind the target (kWh).
          solar_surplus: >
            {% set e = states('input_text.hba_strategy_solar_forecast_entity_id') | trim %}
            {% set t = states('input_text.hba_strategy_solar_forecast_tomorrow_entity_id') | trim %}
            {% set sun_done = e not in ['', 'unknown', 'unavailable'] and t not in ['', 'unknown', 'unavailable']
                              and states(e) | float(-1) >= 0 and states(e) | float(-1) < 0.1 and now().hour >= 12 %}
            {{ states('sensor.hba_solar_forecast_surplus_' ~ ('tomorrow' if sun_done else 'today')) | float(0) }}

      - name: "HBA Charge Grid Energy Portion"
        unique_id: hba_charge_grid_energy_portion
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:transmission-tower
        state: >
          {% set target = states('sensor.hba_charge_target_energy') | float(0) %}
          {% set available = states('sensor.hba_charge_available_energy') | float(0) %}
          {{ [target - available, 0] | max | round(2) }}

      - name: "HBA Charge Solar Energy Portion"
        unique_id: hba_charge_solar_energy_portion
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:solar-power
        state: >
          {% set usable = states('sensor.hba_usable_battery_energy') | float(0) %}
          {% set target = states('sensor.hba_charge_target_energy') | float(0) %}
          {% set available = states('sensor.hba_charge_available_energy') | float(0) %}
          {% set filled = [target, available] | max %}
          {{ [usable - filled, 0] | max | round(2) if usable > 0 else 0 }}

  - binary_sensor:
      - name: "HBA EV Is Active"
        unique_id: hba_ev_is_active
        icon: mdi:ev-station
        state: >
          {% set e = states('input_text.hba_strategy_ev_sensor_entity_id') | trim %}
          {{ states(e) == 'on' if e not in ['', 'unknown', 'unavailable'] else false }}
      - name: "HBA Is Charging"
        unique_id: hba_is_charging
        device_class: battery_charging
        icon: mdi:battery-charging
        state: "{{ states('sensor.hba_total_commanded_power') | float(0) > 0 }}"
      - name: "HBA Solar Surplus Covers Battery Capacity"
        unique_id: hba_solar_surplus_covers_battery_capacity
        icon: mdi:solar-power
        state: >
          {{ states('sensor.hba_solar_forecast_surplus_today') | float(0)
             >= states('sensor.hba_usable_battery_energy') | float(0) }}
      - name: "HBA Solar Surplus Covers Battery Capacity Tomorrow"
        unique_id: hba_solar_surplus_covers_battery_capacity_tomorrow
        icon: mdi:solar-power
        state: >
          {{ states('sensor.hba_solar_forecast_surplus_tomorrow') | float(0)
             >= states('sensor.hba_usable_battery_energy') | float(0) }}
      - name: "HBA Charge Goal Reached"
        unique_id: hba_charge_goal_reached
        icon: mdi:battery-check
        state: >
          {% if states('input_select.hba_strategy') != 'Charge' %}
            false
          {% else %}
            {% set count = states('input_number.hba_battery_count') | int(1) %}
            {% set goal = states('input_select.hba_strategy_charge_goal') %}
            {% if goal == 'batteries are full' %}
              {% set ns = namespace(full=true) %}
              {% for i in range(1, count + 1) %}
                {% set soc = states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') | float(0) %}
                {% set cutoff = states('input_number.hba_marstek_m' ~ i ~ '_charging_cutoff_capacity') | float(100) %}
                {% if soc < cutoff - 1 %}{% set ns.full = false %}{% endif %}
              {% endfor %}
              {{ ns.full }}
            {% elif goal == 'state of charge' %}
              {% set ns = namespace(total=0) %}
              {% for i in range(1, count + 1) %}
                {% set ns.total = ns.total + states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') | float(0) %}
              {% endfor %}
              {{ (ns.total / count) >= states('input_number.hba_strategy_charge_target_soc') | float(90) }}
            {% elif goal == 'energy reserve' %}
              {{ states('sensor.hba_charge_available_energy') | float(0) >= states('input_number.hba_strategy_charge_target_energy') | float(5) }}
            {% elif goal == 'solar forecast' %}
              {{ states('sensor.hba_charge_available_energy') | float(0)
                 >= states('sensor.hba_charge_target_energy') | float(0) }}
            {% else %}
              false
            {% endif %}
          {% endif %}
      # Charge or Sell chosen by hand is done — for the reminder notifications
      # (hba_notify_manual_strategy_*). Charge with the solar-forecast goal is only done when
      # every battery is full: its goal moves every 5 min and reaching it hands over to the
      # "When done charging" plan (e.g. Charge PV), which is still part of the job. Other goals
      # are fixed; 10 min delay so a goal touched for a moment does not notify.
      - name: "HBA Manual Strategy Done"
        unique_id: hba_manual_strategy_done
        icon: mdi:flag-checkered
        delay_on: "00:10:00"
        state: >-
          {%- set st = states('input_select.hba_strategy') -%}
          {%- set n = states('input_number.hba_battery_count') | int(1) -%}
          {%- set full = state_attr('sensor.hba_power_limits', 'full') or [] -%}
          {%- set empty = state_attr('sensor.hba_power_limits', 'empty') or [] -%}
          {%- set all_full = range(1, n + 1) | select('in', full | map('int') | list) | list | length == n -%}
          {%- set all_empty = range(1, n + 1) | select('in', empty | map('int') | list) | list | length == n -%}
          {%- if st == 'Charge' -%}
            {%- if is_state('input_select.hba_strategy_charge_goal', 'solar forecast') -%}
              {{ all_full }}
            {%- else -%}
              {{ all_full or is_state('binary_sensor.hba_charge_goal_reached', 'on') }}
            {%- endif -%}
          {%- elif st == 'Sell' -%}
            {%- set goal = states('input_select.hba_strategy_sell_goal') -%}
            {%- set reached = (goal == 'state of charge' and states('sensor.hba_average_battery_soc') | float(100)
                                 <= states('input_number.hba_strategy_sell_target_soc') | float(20))
                              or (goal == 'energy reserve' and states('sensor.hba_charge_available_energy') | float(100)
                                 <= states('input_number.hba_strategy_sell_target_energy') | float(2)) -%}
            {{ all_empty or reached }}
          {%- else -%}
            false
          {%- endif -%}

      # Charge or Sell has been selected for an hour or more (Overview reminder banner).
      - name: "HBA Manual Strategy Long"
        unique_id: hba_manual_strategy_long
        icon: mdi:timer-alert-outline
        delay_on: "01:00:00"
        state: "{{ states('input_select.hba_strategy') in ['Charge', 'Sell'] }}"

      # A battery is offline when Modbus lost it (inverter_state unavailable) OR its link
      # hangs: battery_power (polled every 10 s) has not reported for 30+ s. A hung link
      # (prod 2026-10-02, M3 cable) stays "available" for ~10 min while HA waits on it;
      # HBA already skips such a battery (hba_write_battery). now() re-renders this each
      # minute; the notification adds its own 3 minutes.
      - name: "HBA Any Battery Offline"
        unique_id: hba_any_battery_offline
        icon: mdi:battery-alert
        state: >
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(offline=false) %}
          {% for i in range(1, count + 1) %}
            {% set inv = states('sensor.marstek_m' ~ i ~ '_inverter_state') %}
            {% set hb = states.sensor['marstek_m' ~ i ~ '_battery_power'] %}
            {% set silent = hb is none or hb.state in ['unavailable', 'unknown']
                            or (now() - hb.last_reported).total_seconds() > 30 %}
            {% if inv in ['unavailable', 'unknown', ''] or silent %}
              {% set ns.offline = true %}
            {% endif %}
          {% endfor %}
          {{ ns.offline }}
        attributes:
          # e.g. "M3" -- read by the banners and the notification.
          batteries: >
            {% set count = states('input_number.hba_battery_count') | int(1) %}
            {% set ns = namespace(off=[]) %}
            {% for i in range(1, count + 1) %}
              {% set inv = states('sensor.marstek_m' ~ i ~ '_inverter_state') %}
              {% set hb = states.sensor['marstek_m' ~ i ~ '_battery_power'] %}
              {% set silent = hb is none or hb.state in ['unavailable', 'unknown']
                              or (now() - hb.last_reported).total_seconds() > 30 %}
              {% if inv in ['unavailable', 'unknown', ''] or silent %}
                {% set ns.off = ns.off + ['M' ~ i] %}
              {% endif %}
            {% endfor %}
            {{ ns.off | join(', ') }}

      # A battery's limit registers still read 0 after a restart although HBA should have
      # written them back: in a power group (HBA never writes below 100 W there) or in
      # "Own" with both registers 0 and an earlier value known. Overview banner +
      # notification (5 min, the restore needs one poll cycle). Not in "Disabled" mode,
      # where HBA deliberately writes nothing. Same logic twice (state + attribute), as
      # in HBA Any Battery Offline: a state reading its own attribute lags one update.
      - name: "HBA Power Limits Not Restored"
        unique_id: hba_power_limits_not_restored
        device_class: problem
        icon: mdi:fuse-alert
        state: >-
          {%- set ns = namespace(out=[]) -%}
          {%- if not is_state('input_select.hba_marstek_master_battery_mode', 'Disabled') -%}
            {%- set count = states('input_number.hba_battery_count') | int(1) -%}
            {%- set want = state_attr('sensor.hba_power_limits', 'charge') -%}
            {%- set want = want if want is mapping and is_state('sensor.hba_power_limits', 'Active') else {} -%}
            {%- set lc = state_attr('sensor.hba_power_limits', 'last_known_charge') -%}
            {%- set lc = lc if lc is mapping else {} -%}
            {%- set ld = state_attr('sensor.hba_power_limits', 'last_known_discharge') -%}
            {%- set ld = ld if ld is mapping else {} -%}
            {%- for i in range(1, count + 1) -%}
              {%- set k = i | string -%}
              {%- set rc = states('sensor.marstek_m' ~ i ~ '_max_charge_power_number') | float(-1) -%}
              {%- set rd = states('sensor.marstek_m' ~ i ~ '_max_discharge_power_number') | float(-1) -%}
              {%- if (k in want and ((0 <= rc <= 50) or (0 <= rd <= 50)))
                    or (k not in want and rc == 0 and rd == 0 and (k in lc or k in ld)) -%}
                {%- set ns.out = ns.out + ['M' ~ i] -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {{ ns.out | length > 0 }}
        attributes:
          # e.g. "M3" -- read by the banner and the notification.
          batteries: >-
            {%- set ns = namespace(out=[]) -%}
            {%- if not is_state('input_select.hba_marstek_master_battery_mode', 'Disabled') -%}
              {%- set count = states('input_number.hba_battery_count') | int(1) -%}
              {%- set want = state_attr('sensor.hba_power_limits', 'charge') -%}
              {%- set want = want if want is mapping and is_state('sensor.hba_power_limits', 'Active') else {} -%}
              {%- set lc = state_attr('sensor.hba_power_limits', 'last_known_charge') -%}
              {%- set lc = lc if lc is mapping else {} -%}
              {%- set ld = state_attr('sensor.hba_power_limits', 'last_known_discharge') -%}
              {%- set ld = ld if ld is mapping else {} -%}
              {%- for i in range(1, count + 1) -%}
                {%- set k = i | string -%}
                {%- set rc = states('sensor.marstek_m' ~ i ~ '_max_charge_power_number') | float(-1) -%}
                {%- set rd = states('sensor.marstek_m' ~ i ~ '_max_discharge_power_number') | float(-1) -%}
                {%- if (k in want and ((0 <= rc <= 50) or (0 <= rd <= 50)))
                      or (k not in want and rc == 0 and rd == 0 and (k in lc or k in ld)) -%}
                  {%- set ns.out = ns.out + ['M' ~ i] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {{ ns.out | join(', ') }}

      # "Charge alongside EV" is in effect: the car charges (EV stop trigger entity on),
      # the policy is Charge alongside EV, no manual Full stop and no Timed EV charge
      # (that one discharges into the car on purpose). While on, hba_set_batteries never
      # discharges and self-consumption runs with discharge disabled. Attributes:
      #   mode       "Batteries first" below input_number.hba_ev_battery_priority_energy
      #              of usable energy, else "EV first"
      # The room per phase lives in sensor.hba_phase_room (recorder-excluded: it changes on
      # every P1 update; this sensor's history stays useful).
      - name: "HBA EV Charge Alongside"
        unique_id: hba_ev_charge_alongside
        icon: mdi:car-battery
        state: >-
          {%- set e = states('input_text.hba_strategy_ev_sensor_entity_id') | trim -%}
          {%- set ev = e not in ['', 'unknown', 'unavailable'] and states(e) == 'on' -%}
          {%- set assist = is_state('binary_sensor.hba_battery_assist_active', 'on')
                           and not is_state('binary_sensor.hba_battery_assist_waiting', 'on') -%}
          {{ ev and not assist
             and is_state('input_select.hba_control_strategy_during_ev_charge', 'Charge alongside EV')
             and not is_state('input_select.hba_strategy', 'Full stop') }}
        attributes:
          # Batteries first below the reserve, EV first again only 0.2 kWh above it: with the
          # car taking the surplus the energy hovers at the reserve and flipped the priority.
          # While a battery's SoC is not read yet (HA start, battery offline) the usable energy
          # reads too low: keep the previous priority instead of jumping to Batteries first.
          mode: >-
            {%- set e = states('sensor.hba_charge_available_energy') | float(0) -%}
            {%- set r = states('input_number.hba_ev_battery_priority_energy') | float(0) -%}
            {%- set was = is_state_attr('binary_sensor.hba_ev_charge_alongside', 'mode', 'Batteries first') -%}
            {%- set n = states('input_number.hba_battery_count') | int(1) -%}
            {%- set q = namespace(ok=true) -%}
            {%- for i in range(1, n + 1) if not is_number(states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge')) -%}{%- set q.ok = false -%}{%- endfor -%}
            {%- set ok = q.ok -%}
            {%- if not ok and state_attr('binary_sensor.hba_ev_charge_alongside', 'mode') in ['Batteries first', 'EV first'] -%}
            {{ state_attr('binary_sensor.hba_ev_charge_alongside', 'mode') }}
            {%- else -%}
            {{ 'Batteries first' if e < r or (was and r > 0 and e < r + 0.2) else 'EV first' }}
            {%- endif -%}

      # For an EV charging controller (ha-smart-ev-charging: ev_home_battery_priority_entity):
      # on while Charge alongside EV would put the batteries first — usable energy below the
      # kWh reserve. Unlike hba_ev_charge_alongside it does not wait for the car to charge, so
      # a solar-surplus EV controller can leave the surplus to the batteries before it starts
      # the car (otherwise: car starts → flag on → car stops → flag off → car starts …).
      - name: "HBA Batteries Before EV"
        unique_id: hba_batteries_before_ev
        icon: mdi:home-battery
        # On below the reserve, off again only 0.2 kWh above it (see mode above): each flip
        # would switch an EV controller's surplus on / off.
        # (and keeps its state while a battery's SoC is not read yet — HA start, offline).
        state: >-
          {%- set e = states('sensor.hba_charge_available_energy') | float(0) -%}
          {%- set r = states('input_number.hba_ev_battery_priority_energy') | float(0) -%}
          {%- set was = is_state('binary_sensor.hba_batteries_before_ev', 'on') -%}
          {%- set n = states('input_number.hba_battery_count') | int(1) -%}
          {%- set q = namespace(ok=true) -%}
          {%- for i in range(1, n + 1) if not is_number(states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge')) -%}{%- set q.ok = false -%}{%- endfor -%}
          {%- set ok = q.ok -%}
          {%- if not ok and states('binary_sensor.hba_batteries_before_ev') in ['on', 'off'] -%}
          {{ was }}
          {%- else -%}
          {{ is_state('input_select.hba_control_strategy_during_ev_charge', 'Charge alongside EV')
             and not is_state('input_select.hba_strategy', 'Full stop')
             and (e < r or (was and r > 0 and e < r + 0.2)) }}
          {%- endif -%}

      # Setup hint (banner only): a per-phase limit is in use — Charge alongside EV, or the
      # main fuse limit per phase — but per-phase grid power sensors it needs are missing
      # (sensor.p1_meter_power_lX, hba_config.yaml). Names them via sensor.hba_phase_room.
      - name: "HBA Phase Sensors Missing"
        unique_id: hba_phase_sensors_missing
        device_class: problem
        icon: mdi:sine-wave
        state: >-
          {{ (is_state('input_select.hba_control_strategy_during_ev_charge', 'Charge alongside EV')
              or states('input_number.hba_phase_current_limit') | float(0) > 0)
             and state_attr('sensor.hba_phase_room', 'missing_sensors') not in [none, ''] }}

      - name: "HBA Battery Assist Active"
        unique_id: hba_battery_assist_active
        icon: mdi:battery-arrow-up
        state: >
          {% set enabled   = is_state('input_boolean.hba_battery_assist_enabled', 'on') %}
          {% set soc       = states('sensor.hba_average_battery_soc') | float(0) %}
          {% set min_soc   = states('input_number.hba_battery_assist_min_soc') | float(20) %}
          {% set start_s   = states('input_datetime.hba_battery_assist_start_time') %}
          {% set end_s     = states('input_datetime.hba_battery_assist_end_time') %}
          {% set start_dt  = today_at(start_s) %}
          {% set end_dt    = today_at(end_s) %}
          {% set overnight = end_s[:5] < start_s[:5] %}
          {% set in_window = (now() >= start_dt or now() < end_dt) if overnight else (start_dt <= now() < end_dt) %}
          {% set car_e     = states('input_text.hba_battery_assist_car_connected_entity') | trim %}
          {% set car_ok    = car_e in ['', 'unknown', 'unavailable'] or is_state(car_e, 'on') %}
          {# At least one battery must be individually dischargeable — same
             eligibility as the hba_set_batteries discharge branch (per-battery
             cutoff, inverter not faulted). The average-SoC check
             alone can stay true while every battery is at its own cutoff
             (unbalanced pack, or min_soc <= cutoffs): assist then keeps the EV
             in battery_assist mode charging from grid with 0 W coming from the
             batteries (observed in production 2026-07-17, ~48 min of 4 kW
             grid import). #}
          {% set count = states('input_number.hba_battery_count') | int(1) %}
          {% set ns = namespace(dischargeable=false) %}
          {% for i in range(1, count + 1) %}
            {% set b_soc = states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') | float(0) %}
            {% set b_cut = states('input_number.hba_marstek_m' ~ i ~ '_discharging_cutoff_capacity') | float(13) %}
            {% set inv   = states('sensor.marstek_m' ~ i ~ '_inverter_state') %}
            {% if b_soc > b_cut and inv not in ['Fault', 'unknown', 'unavailable'] %}
              {% set ns.dischargeable = true %}
            {% endif %}
          {% endfor %}
          {# The stalled watchdog (below) releases assist when the pack is
             commanded to discharge but delivers nothing — behaviour the SoC
             model above cannot see (e.g. V3 firmware refuses below ~13%
             regardless of the configured cutoff). 'not on' so an unknown
             sensor at startup does not block assist. #}
          {# A manual Full stop overrides the assist push (hba_run_strategy checks
             it first), so assist must not stay armed either — the EV would sit in
             battery_assist mode charging from grid with no battery behind it. #}
          {{ enabled and soc > min_soc and ns.dischargeable and in_window and car_ok
             and not is_state('binary_sensor.hba_battery_assist_stalled', 'on')
             and not is_state('input_select.hba_strategy', 'Full stop') }}

      # Stall watchdog for the Timed EV charge push: ON when assist is actively
      # commanding discharge ("Discharge to EV" is written by exactly one
      # dispatch branch) but the pack has delivered < 150 W for 3+ continuous
      # minutes — the BMS is refusing (firmware SoC floor, thermal, fault) or
      # the Modbus writes are being silently ignored. While ON, assist_active
      # drops, the EV side leaves battery_assist mode and stops the charger —
      # without this the EV keeps charging at full grid power indefinitely
      # (production 2026-07-17: ~48 min of ~4 kW grid import).
      # Deliberately stateless — no latch to get stuck: delay_off IS the
      # hold-off. Once assist drops, the raw condition goes false (the active
      # strategy changes), the 30-min delay_off starts, and assist gets one
      # clean retry per hold-off period; a persistent stall re-trips after
      # 3 min (bounded: ~3 min grid draw per 30 min, with a push each trip).
      # The active-strategy condition inherently excludes the two legitimate
      # low-power states: assist-waiting (dispatch runs the fallback strategy)
      # and the grid-overflow branch (label ends in "Self-consumption").
      - name: "HBA Battery Assist Stalled"
        unique_id: hba_battery_assist_stalled
        icon: mdi:battery-off-outline
        delay_on: "00:03:00"
        delay_off: "00:30:00"
        state: >
          {{ is_state('binary_sensor.hba_battery_assist_active', 'on')
             and states('sensor.hba_active_strategy') == 'Discharge to EV'
             and states('sensor.hba_total_battery_power') | float(0) < 150 }}

      # ON when Timed EV charge is armed but the EV has not drawn power for
      # 3+ minutes since assist activated — charger may need a tag scan, or the
      # car paused itself (charge limit, schedule, app). While this is on,
      # hba_run_strategy abstains from the assist push and falls through to the
      # configured strategy, instead of cycling battery power to the grid via
      # the overflow guard. Clears (and assist resumes on the next control
      # cycle) as soon as the EV-charging entity turns on.
      # Requires input_text.hba_strategy_ev_sensor_entity_id to be configured;
      # without it this sensor stays off and assist behaves as before.
      # The 3-minute grace covers session start: the assist push is what
      # creates the export the EV controller ramps up on.
      - name: "HBA Battery Assist Waiting"
        unique_id: hba_battery_assist_waiting
        icon: mdi:timer-sand
        state: >
          {% set ev_e = states('input_text.hba_strategy_ev_sensor_entity_id') | trim %}
          {% set assist = states.binary_sensor.hba_battery_assist_active %}
          {{ assist is not none and assist.state == 'on'
             and ev_e not in ['', 'unknown', 'unavailable']
             and not is_state(ev_e, 'on')
             and (now() - assist.last_changed).total_seconds() > 180 }}

      - name: "HBA Grid Exporting Sustained"
        unique_id: hba_grid_exporting_sustained
        icon: mdi:transmission-tower-export
        state: >
          {{ states('sensor.p1_meter_power') | float(0) < -1000
             and states('sensor.hba_total_battery_power') | float(0) > 500 }}
        delay_on: "00:01:00"
        delay_off: "00:00:30"

      - name: "HBA Notify Target Invalid"
        unique_id: hba_notify_target_invalid
        device_class: problem
        icon: mdi:bell-alert-outline
        state: >-
          {%- set v = states('input_text.hba_notify_entity_id') | trim -%}
          {%- if v in ['', 'unknown', 'unavailable'] -%}
            false
          {%- elif not v.startswith('notify.') -%}
            true
          {%- elif v.startswith('notify.mobile_app_') -%}
            false
          {%- else -%}
            true
          {%- endif -%}
        attributes:
          notify_target: "{{ states('input_text.hba_notify_entity_id') }}"
          available_notify_services: >-
            {%- set ns = namespace(result=[]) -%}
            {%- for e in states.notify -%}
              {%- set ns.result = ns.result + ['notify.mobile_app_' + e.entity_id[7:]] -%}
            {%- endfor -%}
            {{ ns.result }}

      # ── Per-battery RS485 non-response detection ──────────────────────────────
      # Turns on (delay_on 60 s) when a battery has RS485 enabled, is being commanded
      # ≥ 300 W charge or discharge, but its actual AC output differs from the commanded
      # value by more than 15%. Typical causes: BMS blocking near SoC cutoff, or the
      # battery silently rejecting a Modbus write (e.g. after a BMS fault).
      # Notification: see hba_notify_battery_not_responding in hba_strategies_core.yaml.
      - name: "HBA Marstek M1 Not Responding"
        unique_id: hba_marstek_m1_not_responding
        device_class: problem
        icon: mdi:battery-alert
        # 60 s, not 30 s. The commanded registers are rewritten every ~1 s while
        # sensor.marstek_m1_ac_power only polls every ~10 s, AND the Marstek slews at
        # only ~460 W/s -- so during any ramp the measurement legitimately trails the
        # command by well over 15 %, for as long as the ramp lasts. At 30 s that fired on
        # ordinary regulation: three alerts over 2026-08-01..03, two of which resolved
        # within 1 and 6 seconds.
        #
        # 60 s is measured, not guessed: replaying the condition second-by-second over
        # 59.7 h of production gave 4,722 true-runs across the three batteries with a
        # LONGEST run of 37 s and p90 of 10 s. 30 s produced 3 alerts (matching reality);
        # 45 s and above produced none. 60 s leaves ~62 % headroom over the worst observed
        # ramp while keeping detection of a real fault reasonably prompt.
        #
        # Raising the ac_power poll rate instead was considered and rejected: it cannot
        # remove the slew-driven error, and the extra Modbus reads compete with the
        # control writes on the same hub.
        delay_on: "00:01:00"
        state: >
          {% if states('select.marstek_m1_rs485_control_mode') != 'enable' %}
            false
          {% else %}
            {% set d = states('select.marstek_m1_forcible_charge_discharge') %}
            {% set soc = states('sensor.marstek_m1_battery_state_of_charge') | float(-1) %}
            {% set soc_min = states('input_number.hba_marstek_m1_discharging_cutoff_capacity') | float(13) %}
            {% set soc_max = states('input_number.hba_marstek_m1_charging_cutoff_capacity') | float(100) %}
            {% if d == 'discharge' %}
              {% set cmd = states('number.marstek_m1_forcible_discharge_power') | float(0) %}
              {# near-empty: the BMS declining to discharge is physics, not a fault #}
              {% set at_limit = soc >= 0 and soc <= soc_min + 3 %}
            {% elif d == 'charge' %}
              {% set cmd = -(states('number.marstek_m1_forcible_charge_power') | float(0)) %}
              {% set at_limit = soc >= 0 and soc >= soc_max - 3 %}
            {% else %}
              {% set cmd = 0 %}
              {% set at_limit = false %}
            {% endif %}
            {% if at_limit or cmd | abs < 300 %}
              false
            {% else %}
              {{ (states('sensor.marstek_m1_ac_power') | float(0) - cmd) | abs > cmd | abs * 0.15 }}
            {% endif %}
          {% endif %}

