    icon: mdi:clock-end
  hba_strategy_dynamic_data_source:
    name: "Dynamic pricing source"
    # Only Frank Energie until other providers are added to
    # sensor.hba_energy_prices_data (they were only supported by the removed v1
    # strategy, through the Cheapest Energy Hours HACS macro). On HBA's to-do.
