input_select:
  hba_marstek_master_battery_mode:
    name: "Master battery mode"
    options:
      - "Manual control"
      - "Marstek control"
      - "Full control"
      - "Disabled"
    icon: mdi:battery-sync
  hba_strategy:
    name: "Active strategy"
    options:
      - "Full stop"
      - "Self-consumption"
      - "Timed"
      - "Dynamic"
      - "Charge"
      - "Charge PV"
      - "Sell"
      - "Zero import"
      - "Standby / peak shave"
    icon: mdi:strategy
  # What the batteries do while the EV stop trigger is active (EV is charging).
  #   Full stop            — batteries idle (original behaviour)
  #   Standby / peak shave — batteries idle but still respond to import/export
  #                          power limits (former behaviour of the removed
  #                          input_boolean.hba_control_has_power_limit_during_ev_charge;
  #                          if you had that boolean ON, select this option once)
  #   Charge PV            — batteries charge the solar residual the EV cannot
  #                          take (e.g. surplus pinned between 1-phase max and the
  #                          3-phase switch threshold). Discharge stays disabled,
  #                          so the batteries can never compete with the charger:
  #                          they only absorb what the EV leaves on the grid.
  #                          Note: this assumes the EV controller adds battery
  #                          charging power back into its surplus signal (the
  #                          ha-smart-ev-charging project does). A solar-tracking
  #                          charger without battery awareness would see its
  #                          surplus shrink and back off — pick Full stop or
  #                          Standby with such a setup.
  #   Charge alongside EV  — the normal strategy keeps running (it decides WHETHER the
  #                          batteries charge, e.g. a cheap hour), but never discharges
  #                          into the car. Who gets priority on the connection depends on
  #                          the energy in the batteries: below
  #                          input_number.hba_ev_battery_priority_energy the batteries
  #                          charge at full power and an EV charger with its own load
  #                          balancing (CT clamps at the grid connection) slows the car
  #                          down; above it the batteries only take what is left under
  #                          input_number.hba_ev_phase_current_limit per phase, so the
  #                          car keeps its speed. Needs the phase of each battery.
  hba_control_strategy_during_ev_charge:
    name: "Strategy during EV charge"
    options:
      - "Full stop"
      - "Standby / peak shave"
      - "Charge PV"
      - "Charge alongside EV"
    icon: mdi:car-electric-outline
  # PID presets. The four everyday presets use Kp 0.35 / Kd 0.1 / damping 20-10 and
  # differ ONLY in Ki: Very safe 0.15 / Safe 0.22 / Regular 0.30 / Responsive 0.40.
  # "Low peak (grid limit)" is the exception -- see below.
  #
  # Kp 0.35 is the MEASURED optimum, bracketed on both sides against a real 2250 W
  # load on production (Ki held at 0.22): cost per disturbance 0.74 / 0.61 / 0.71 ct
  # at Kp 0.20 / 0.35 / 0.55. Lower Kp gives a higher peak but a faster tail, higher Kp
  # the reverse, and both cost more overall.
  #
  # NB the idealised algebra says energy should be Kp-independent (the (1+Kp) cancels
  # between the initial excursion and the decay rate). That is WRONG for this plant --
  # it assumes an instantaneous actuator and no dead time, whereas the loop has ~1.6 s
  # of sensing delay and a Marstek slewing at ~460 W/s. Measurement over three nights
  # falsified it. The formulas still predict the PEAK accurately (Kp 0.20 measured
  # +12.7 % against a predicted +12.4 %); just do not use them for energy.
  #
  # If transient PEAKS matter more than energy, do NOT reach for Kp. Output dampening is
  # the better lever and it is what "Low peak (grid limit)" changes: dropping it 10 % -> 0
  # cut the peak 1630 -> 1320 W (-19 %) on the 2250 W production load with no cost penalty
  # (0.79 -> 0.65 ct, n.s.), where Kp 0.55 buys 8 % of peak for 16 % more cost. Measured
  # 2026-08-06, arms interleaved per pulse with everything else held equal.
  #
  # "Peak" here means the INSTANTANEOUS excursion, over a few seconds. It does nothing for
  # the Dutch capaciteitstarief, which bills the monthly maximum of 15-minute averages --
  # 300 W for 3 s moves a 15-min average by under 1 W. Use power_limit_import for that.
  # This preset is for a fuse or a contracted connection cap, where 1600 W of transient is
  # ~7 A on a phase.
  #
  # Ki values are calibrated for a ~1.1 s control loop, i.e. with Modbus write
  # de-duplication enabled (input_number.hba_control_write_refresh_secs > 0, v4.10.1-r15+).
  # With de-duplication off the loop runs at ~2.2 s and the integrator accumulates half
  # as fast per second, so every preset behaves roughly one step slower than its name.
  hba_control_pid_presets:
    name: "PID presets"
    options:
      - "Custom"
      - "Very safe"
      - "Safe"
      - "Regular"
      - "Responsive"
      - "Low peak (grid limit)"
    icon: mdi:tune
  hba_strategy_timed_strat_0:
    name: "Timed baseline strategy"
    options:
