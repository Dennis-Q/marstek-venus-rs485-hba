      - "Self-consumption"
      - "Charge"
      - "Charge PV"
      - "Sell"
      - "Zero import"
      - "Standby / peak shave"
    icon: mdi:clock-outline
  hba_strategy_timed_strat_a:
    name: "Timed strategy period A"
    options:
      - "Full stop"
      - "Self-consumption"
      - "Charge"
      - "Charge PV"
      - "Sell"
      - "Zero import"
      - "Standby / peak shave"
    icon: mdi:clock-start
  hba_strategy_timed_strat_b:
