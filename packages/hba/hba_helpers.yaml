      # ── RS485 mode mismatch ───────────────────────────────────────────────────
      # Turns on (delay_on 30 s) when HBA master mode is Full control but any
      # configured battery has RS485 control != enable (hba_master_mode_periodic_reapply
      # fixes it within ~10 s of the change, so usually it never turns on). The battery silently ignores
      # all Modbus writes in this state — HBA appears to operate but has no effect.
      # Notification: see hba_notify_rs485_mode_mismatch in hba_strategies_core.yaml.
      - name: "HBA RS485 Mode Mismatch"
        unique_id: hba_rs485_mode_mismatch
        device_class: problem
        icon: mdi:connection-off
        delay_on: "00:00:30"
        state: >
          {% if not is_state('input_select.hba_marstek_master_battery_mode', 'Full control') %}
            false
          {% else %}
            {% set count = states('input_number.hba_battery_count') | int(1) %}
            {% set ns = namespace(mismatch=false) %}
            {% for i in range(1, count + 1) %}
              {% if states('select.marstek_m' ~ i ~ '_rs485_control_mode') != 'enable' %}
                {% set ns.mismatch = true %}
              {% endif %}
            {% endfor %}
            {{ ns.mismatch }}
          {% endif %}
        attributes:
          mismatched_batteries: >
            {% set count = states('input_number.hba_battery_count') | int(1) %}
            {% set ns = namespace(result=[]) %}
            {% for i in range(1, count + 1) %}
              {% if states('select.marstek_m' ~ i ~ '_rs485_control_mode') != 'enable' %}
                {% set mode = states('select.marstek_m' ~ i ~ '_rs485_control_mode') %}
                {% set ns.result = ns.result + ['M' ~ i ~ ' (' ~ mode ~ ')'] %}
              {% endif %}
            {% endfor %}
            {{ ns.result | join(', ') if ns.result else 'none' }}

      # ── Entity health check ───────────────────────────────────────────────────
      # Detects when HBA-managed entities are registered under the wrong entity_id.
      # This typically happens on existing installs after an entity was renamed in a
      # newer version: the entity registry keeps the old entity_id (derived from the
      # previous name) and code references the new expected entity_id, causing silent
      # failures. Fix by going to Settings → Entities and renaming the listed entities.
      # ── Dynamic migration check (r22) ───────────────────────────────────────────
      # r22 removed Dynamic v1 and renamed Dynamic v2's entities to plain "dynamic".
      # On an existing install that leaves orphans in the entity registry (shown as
      # unavailable), and a manual install can keep the old hba_strategy_dynamic_v2.yaml
      # loading next to the new file. `expand()` returns any entity HA still knows,
      # orphan or not -- has_value() would hide orphans, since they are unavailable.
      # The Overview shows a migration banner while this is on.
      - name: "HBA Dynamic Migration Needed"
        unique_id: hba_dynamic_migration_needed
        device_class: problem
        icon: mdi:swap-horizontal-bold
        state: >
          {% set old = [
            'script.hba_strategy_dynamic_v2',
            'input_number.hba_strategy_dynamic_v2_max_cheap_hours_per_day',
            'input_number.hba_strategy_dynamic_v2_max_expensive_hours_per_day',
            'automation.hba_dynamic_period_calculation',
            'input_datetime.hba_strategy_dynamic_cheapest_start',
            'input_datetime.hba_strategy_dynamic_cheapest_end',
            'input_datetime.hba_strategy_dynamic_expensive_start',
            'input_datetime.hba_strategy_dynamic_expensive_end',
            'input_number.hba_strategy_dynamic_cheapest_hrs',
            'input_number.hba_strategy_dynamic_expensive_hrs',
            'input_number.hba_strategy_dynamic_threshold_cheapest_period',
            'input_number.hba_strategy_dynamic_cheapest_avg_tariff',
            'input_number.hba_strategy_dynamic_expensive_avg_tariff',
            'input_number.hba_strategy_dynamic_expensive_avg_delta',
            'sensor.hba_estimated_profit_per_kwh',
            'binary_sensor.hba_dynamic_cheap_threshold_met',
            'binary_sensor.hba_dynamic_expensive_threshold_met',
          ] %}
          {% set new = [
            'script.hba_strategy_dynamic',
            'input_number.hba_strategy_dynamic_max_cheap_hours_per_day',
            'input_number.hba_strategy_dynamic_max_expensive_hours_per_day',
          ] %}
          {{ (expand(old) | count) > 0 or (new | reject('has_value') | list | count) > 0 }}
        attributes:
          leftover_entity_ids: >
            {% set old = [
              'script.hba_strategy_dynamic_v2',
              'input_number.hba_strategy_dynamic_v2_max_cheap_hours_per_day',
              'input_number.hba_strategy_dynamic_v2_max_expensive_hours_per_day',
              'automation.hba_dynamic_period_calculation',
              'input_datetime.hba_strategy_dynamic_cheapest_start',
              'input_datetime.hba_strategy_dynamic_cheapest_end',
              'input_datetime.hba_strategy_dynamic_expensive_start',
              'input_datetime.hba_strategy_dynamic_expensive_end',
              'input_number.hba_strategy_dynamic_cheapest_hrs',
              'input_number.hba_strategy_dynamic_expensive_hrs',
              'input_number.hba_strategy_dynamic_threshold_cheapest_period',
              'input_number.hba_strategy_dynamic_cheapest_avg_tariff',
              'input_number.hba_strategy_dynamic_expensive_avg_tariff',
              'input_number.hba_strategy_dynamic_expensive_avg_delta',
              'sensor.hba_estimated_profit_per_kwh',
              'binary_sensor.hba_dynamic_cheap_threshold_met',
              'binary_sensor.hba_dynamic_expensive_threshold_met',
            ] %}
            {{ expand(old) | map(attribute='entity_id') | sort | join(', ') }}
          old_file_still_loaded: >
            {{ has_value('script.hba_strategy_dynamic_v2')
               or has_value('input_number.hba_strategy_dynamic_v2_max_cheap_hours_per_day') }}
          missing_entity_ids: >
            {% set new = [
              'script.hba_strategy_dynamic',
              'input_number.hba_strategy_dynamic_max_cheap_hours_per_day',
              'input_number.hba_strategy_dynamic_max_expensive_hours_per_day',
            ] %}
            {{ new | reject('has_value') | join(', ') }}

      - name: "HBA Entity Health"
        unique_id: hba_entity_health
        device_class: problem
        icon: mdi:stethoscope
        state: >
          {% set expected = [
            'sensor.hba_active_strategy',
            'binary_sensor.hba_is_charging',
            'binary_sensor.hba_charge_goal_reached',
            'binary_sensor.hba_marstek_m1_not_responding',
            'binary_sensor.hba_marstek_m2_not_responding',
            'binary_sensor.hba_marstek_m3_not_responding',
            'binary_sensor.hba_marstek_m4_not_responding',
            'binary_sensor.hba_marstek_m5_not_responding',
            'binary_sensor.hba_marstek_m6_not_responding',
            'sensor.hba_power_limits',
          ] %}
          {{ expected | reject('has_value') | list | length > 0 }}
        attributes:
          missing_entity_ids: >
            {% set expected = [
              'sensor.hba_active_strategy',
              'binary_sensor.hba_is_charging',
              'binary_sensor.hba_charge_goal_reached',
              'binary_sensor.hba_marstek_m1_not_responding',
              'binary_sensor.hba_marstek_m2_not_responding',
              'binary_sensor.hba_marstek_m3_not_responding',
              'binary_sensor.hba_marstek_m4_not_responding',
              'binary_sensor.hba_marstek_m5_not_responding',
              'binary_sensor.hba_marstek_m6_not_responding',
              'sensor.hba_power_limits',
            ] %}
            {% set ns = namespace(missing=[]) %}
            {% for e in expected %}
              {% if not has_value(e) %}{% set ns.missing = ns.missing + [e] %}{% endif %}
            {% endfor %}
            {{ ns.missing | join(', ') if ns.missing else '' }}

  # ── Battery order for "Auto balance (SoC)" ────────────────────────────────────
  # HBA-only priority mode. "Auto balance" (as in HBC) rotates the priority every 30 min
  # regardless of SoC, so batteries that differ in power drift apart: on prod (2026-10-02)
  # the 800 W M4 gave far less per turn in the evening peak and stayed ~50 % above the
  # others all night. This decides the order from SoC instead, frozen for 30 min so a
  # running charge or discharge is never reshuffled:
  #   discharge_order: most energy above the discharge cutoff first
  #   charge_order:    most room below the charge cutoff first
  # The distribution (hba_set_batteries) fills batteries in that order, each up to its
  # max, so a load above one battery's max goes to the next-fullest battery and solar
  # above it to the next-emptiest. A battery only overtakes the one ahead of it by more
  # than 3 SoC points, so near-equal batteries keep their place instead of swapping
  # every tick. Battery with unknown SoC goes last.
  - triggers:
      - trigger: time_pattern
        minutes: "/30"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id:
          - input_select.hba_control_priority_change_interval
          - input_number.hba_battery_count
    actions:
      - variables:
          orders: >-
            {%- set count = states('input_number.hba_battery_count') | int(1) -%}
            {%- set ns = namespace(dis={}, chg={}) -%}
            {%- for i in range(1, count + 1) -%}
              {%- set soc = states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') | float(-1) -%}
              {%- set lo = states('input_number.hba_marstek_m' ~ i ~ '_discharging_cutoff_capacity') | float(13) -%}
              {%- set hi = states('input_number.hba_marstek_m' ~ i ~ '_charging_cutoff_capacity') | float(100) -%}
              {%- set ns.dis = ns.dis | combine({i | string: (soc - lo) if soc >= 0 else -999}) -%}
              {%- set ns.chg = ns.chg | combine({i | string: (hi - soc) if soc >= 0 else -999}) -%}
            {%- endfor -%}
            {%- set ns2 = namespace(out={}) -%}
            {%- for key, val in [('discharge_order', ns.dis), ('charge_order', ns.chg)] -%}
              {#- Previous order from the state machine. `this` is not usable in a trigger
                  template's actions: it came back empty, so the order was re-seeded 1..n
                  every tick and, within 3 points, the LOWEST battery number went first
                  even when it had the least SoC (prod 2026-10-04 02:00-07:00: M1 first at
                  27 % with M3 at 31 %). -#}
              {%- set prev = state_attr('sensor.hba_battery_order', key) or [] -%}
              {%- set prev = (prev if prev is sequence and prev is not string else []) | map('int') | list -%}
              {%- set o = namespace(l=[]) -%}
              {%- for b in prev if 1 <= b <= count and b not in o.l -%}{%- set o.l = o.l + [b] -%}{%- endfor -%}
              {%- for b in range(1, count + 1) if b not in o.l -%}{%- set o.l = o.l + [b] -%}{%- endfor -%}
              {#- Bubble sort that only swaps neighbours more than 3 points apart. -#}
              {%- for _ in range(count) -%}
                {%- for k in range(count - 1) -%}
                  {%- if val[o.l[k + 1] | string] > val[o.l[k] | string] + 3 -%}
                    {%- set o.l = o.l[:k] + [o.l[k + 1], o.l[k]] + o.l[k + 2:] -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- set ns2.out = ns2.out | combine({key: o.l}) -%}
            {%- endfor -%}
            {{ ns2.out | tojson }}
    sensor:
      - name: "HBA Battery Order"
        unique_id: hba_battery_order
        icon: mdi:sort-descending
        # The battery that discharges first (also synced to the priority battery).
        state: "{{ (orders | from_json if orders is string else orders).discharge_order[0] }}"
        attributes:
          discharge_order: "{{ (orders | from_json if orders is string else orders).discharge_order }}"
          charge_order: "{{ (orders | from_json if orders is string else orders).charge_order }}"
          decided_at: "{{ now().isoformat() }}"

  # ── Power groups: intended limit registers ────────────────────────────────────
  # Batteries that share one breaker go into the same power group (A/B/C). HBA then
  # manages their max charge (44002) and max discharge (44003) registers so that, per
  # direction, the registers of a group never add up to more than the group's max power.
  # The limits live IN the battery, so the breaker stays protected even when HA is down
  # or a battery runs on its own (Marstek app, anti-feed) — HBA's distribution alone
  # could not promise that. Batteries in "Own" are left alone.
  #
  # This sensor only decides; automation hba_power_limits_apply writes (lowering first,
  # raising only into room the read-back registers leave). Per group and direction:
  #   - a battery that cannot be reached keeps what it has (it may still be running on
  #     its last limit, so its share is never handed out)
  #   - every reachable battery keeps at least 100 W (never 0: both registers reading 0
  #     is how a battery restart is recognised, see hba_notify_battery_restarted)
  #   - Equal: the rest is split evenly over the batteries that can use it, never above
  #     a battery's own max power; what they cannot take goes to the full/empty ones
  #   - One at a time: the leader gets as much as it can until it is full (charging) or
  #     empty (discharging); then the fullest (charging) / emptiest (discharging) next
  #   - Follow battery order: the leader is the group's first eligible battery in the
  #     order hba_set_batteries uses (sensor.hba_battery_order with Auto balance (SoC),
  #     else cyclic from the priority battery) — it moves with that order (frozen 30 min),
  #     but only once the new first battery is 5 SoC points further along than the
  #     current leader (or the leader is full / empty): fewer EEPROM rewrites
  # Full/empty latch with hysteresis so a battery at its cutoff does not flip the split:
  # full at charge cutoff − 1 %, not full again below cutoff − 4 %; empty at discharge
  # cutoff + 1 %, not empty again above cutoff + 4 %: a Venus E 3.0 stops itself just
  # below 13.0 % (whole-percent reserve check, see hba_apply_defaults), so with its 13 %
  # cutoff empty is ≤ 14 %, with an old 12 % cutoff ≤ 13 %, both reached before it stalls. Charge and
  # discharge are split separately: a full battery still gets its share for discharging.
  #
  # Firmware facts this rests on (Venus E v3 = D code, static RE by sphings79):
  # 44002/44003 go to the inverter, an external I²C EEPROM (0x202/0x204, change guard:
  # an unchanged value costs no cycle) and a RAM shadow that Modbus reads back. After a
  # battery restart that shadow reads 0 until written, while the battery still limits at
  # its EEPROM value — hence last_known_*: the last non-zero read-back per battery.
  # State and attributes are read back via state_attr (`this` is empty in a trigger
  # template's actions, see HBA Battery Order).
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id:
          - input_number.hba_battery_count
          - input_select.hba_marstek_m1_power_group
          - input_select.hba_marstek_m2_power_group
          - input_select.hba_marstek_m3_power_group
          - input_select.hba_marstek_m4_power_group
          - input_select.hba_marstek_m5_power_group
          - input_select.hba_marstek_m6_power_group
          - input_number.hba_marstek_m1_max_charge_power
          - input_number.hba_marstek_m1_max_discharge_power
          - input_number.hba_marstek_m2_max_charge_power
          - input_number.hba_marstek_m2_max_discharge_power
          - input_number.hba_marstek_m3_max_charge_power
          - input_number.hba_marstek_m3_max_discharge_power
          - input_number.hba_marstek_m4_max_charge_power
          - input_number.hba_marstek_m4_max_discharge_power
          - input_number.hba_marstek_m5_max_charge_power
          - input_number.hba_marstek_m5_max_discharge_power
          - input_number.hba_marstek_m6_max_charge_power
          - input_number.hba_marstek_m6_max_discharge_power
          - input_number.hba_power_group_a_max_power
          - input_number.hba_power_group_b_max_power
          - input_number.hba_power_group_c_max_power
          - input_select.hba_power_group_a_policy
          - input_select.hba_power_group_b_policy
          - input_select.hba_power_group_c_policy
          # "Follow battery order" moves with the order
          - sensor.hba_battery_order
          - input_number.hba_control_prioritize_battery
          - input_select.hba_control_priority_change_interval
    actions:
      - variables:
          plan: >-
            {%- set S = 'sensor.hba_power_limits' -%}
            {%- set count = states('input_number.hba_battery_count') | int(1) -%}
            {%- set p = namespace(full=[], empty=[], lkc={}, lkd={}, c={}, d={}, lead={}) -%}
            {%- set v = state_attr(S, 'full') -%}{%- set p.full = v if v is sequence and v is not string else [] -%}
            {%- set v = state_attr(S, 'empty') -%}{%- set p.empty = v if v is sequence and v is not string else [] -%}
            {%- set v = state_attr(S, 'last_known_charge') -%}{%- set p.lkc = v if v is mapping else {} -%}
            {%- set v = state_attr(S, 'last_known_discharge') -%}{%- set p.lkd = v if v is mapping else {} -%}
            {%- set v = state_attr(S, 'charge') -%}{%- set p.c = v if v is mapping else {} -%}
            {%- set v = state_attr(S, 'discharge') -%}{%- set p.d = v if v is mapping else {} -%}
            {%- set v = state_attr(S, 'leaders') -%}{%- set p.lead = v if v is mapping else {} -%}
            {#- 1. Per battery: reachability, read-back, last known limits, full/empty latch -#}
            {%- set ns = namespace(bats=[], lkc={}, lkd={}) -%}
            {%- for i in range(1, count + 1) -%}
              {%- set k = i | string -%}
              {%- set soc = states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') | float(-1) -%}
              {%- set hi = states('input_number.hba_marstek_m' ~ i ~ '_charging_cutoff_capacity') | float(100) -%}
              {%- set lo = states('input_number.hba_marstek_m' ~ i ~ '_discharging_cutoff_capacity') | float(13) -%}
              {%- set inv = states('sensor.marstek_m' ~ i ~ '_inverter_state') -%}
              {%- set hb = states.sensor['marstek_m' ~ i ~ '_battery_power'] -%}
              {%- set live = hb is not none and hb.state not in ['unavailable', 'unknown']
                             and (now() - hb.last_reported).total_seconds() <= 30
                             and inv not in ['unavailable', 'unknown', ''] -%}
              {%- set rbc = states('sensor.marstek_m' ~ i ~ '_max_charge_power_number') | float(-1) -%}
              {%- set rbd = states('sensor.marstek_m' ~ i ~ '_max_discharge_power_number') | float(-1) -%}
              {%- set lkc = rbc if rbc > 50 else (p.lkc[k] if k in p.lkc else 0) -%}
              {%- set lkd = rbd if rbd > 50 else (p.lkd[k] if k in p.lkd else 0) -%}
              {%- if lkc > 0 -%}{%- set ns.lkc = ns.lkc | combine({k: lkc | int}) -%}{%- endif -%}
              {%- if lkd > 0 -%}{%- set ns.lkd = ns.lkd | combine({k: lkd | int}) -%}{%- endif -%}
              {#- The BMS reporting 0 A charge limit is an exact "full" (Venus E 3.0 at 100 %) -#}
              {%- set bms_a = states('sensor.marstek_m' ~ i ~ '_battery_charge_current_limit') | float(-1) -%}
              {%- if soc < 0 -%}{%- set full = i in p.full -%}
              {%- elif soc >= hi - 1 or (bms_a == 0 and soc >= 90) -%}{%- set full = true -%}
              {%- elif soc < hi - 4 -%}{%- set full = false -%}
              {%- else -%}{%- set full = i in p.full -%}{%- endif -%}
              {%- if soc < 0 -%}{%- set empty = i in p.empty -%}
              {%- elif soc <= lo + 1 -%}{%- set empty = true -%}
              {%- elif soc > lo + 4 -%}{%- set empty = false -%}
              {%- else -%}{%- set empty = i in p.empty -%}{%- endif -%}
              {%- set ns.bats = ns.bats + [{
                    'i': i, 'g': states('input_select.hba_marstek_m' ~ i ~ '_power_group'),
                    'capc': states('input_number.hba_marstek_m' ~ i ~ '_max_charge_power') | float(0) | int,
                    'capd': states('input_number.hba_marstek_m' ~ i ~ '_max_discharge_power') | float(0) | int,
                    'soc': soc, 'hi': hi, 'lo': lo, 'live': live, 'full': full, 'empty': empty,
                    'lkc': lkc | int, 'lkd': lkd | int}] -%}
            {%- endfor -%}
            {#- The order hba_set_batteries fills batteries in, per direction (for
                "Follow battery order"): Auto balance (SoC) order first, then cyclic from
                the priority battery. -#}
            {%- set pr = states('input_number.hba_control_prioritize_battery') | int(1) -%}
            {%- set pr = pr if 1 <= pr <= count else 1 -%}
            {%- set ordr = namespace(d={}) -%}
            {%- for dd in ['charge', 'discharge'] -%}
              {%- set o = namespace(l=[]) -%}
              {%- if is_state('input_select.hba_control_priority_change_interval', 'Auto balance (SoC)') -%}
                {%- set so = state_attr('sensor.hba_battery_order', dd ~ '_order') -%}
                {%- for b in (so if so is sequence and so is not string else []) | map('int') if 1 <= b <= count and b not in o.l -%}
                  {%- set o.l = o.l + [b] -%}
                {%- endfor -%}
              {%- endif -%}
              {%- for k in range(count) -%}
                {%- set b = ((pr - 1 + k) % count) + 1 -%}
                {%- if b not in o.l -%}{%- set o.l = o.l + [b] -%}{%- endif -%}
              {%- endfor -%}
              {%- set ordr.d = ordr.d | combine({dd: o.l}) -%}
            {%- endfor -%}
            {#- 2. Per group and direction: the intended limits -#}
            {%- set gs = namespace(c={}, d={}, lead={}, groups={}, problems=[]) -%}
            {%- for G in ['A', 'B', 'C'] -%}
              {%- set members = ns.bats | selectattr('g', 'eq', G) | list -%}
              {%- if members | length > 0 -%}
                {%- set budget = states('input_number.hba_power_group_' ~ (G | lower) ~ '_max_power') | float(0) | int -%}
                {%- set policy = states('input_select.hba_power_group_' ~ (G | lower) ~ '_policy') -%}
                {%- set bad = namespace(p=[]) -%}
                {%- for m in members if m.capc <= 0 or m.capd <= 0 -%}
                  {%- set bad.p = bad.p + ['M' ~ m.i ~ ' (group ' ~ G ~ '): set its max '
                        ~ ('charge and discharge' if m.capc <= 0 and m.capd <= 0 else ('charge' if m.capc <= 0 else 'discharge'))
                        ~ ' power'] -%}
                {%- endfor -%}
                {%- if budget <= 0 -%}
                  {%- set bad.p = bad.p + ['Group ' ~ G ~ ': set its max power'] -%}
                {%- elif budget < 100 * (members | length) -%}
                  {%- set bad.p = bad.p + ['Group ' ~ G ~ ': max power below 100 W per battery'] -%}
                {%- endif -%}
                {%- if bad.p -%}
                  {%- set gs.problems = gs.problems + bad.p -%}
                {%- else -%}
                  {%- set gs.groups = gs.groups | combine({G: {'max_power': budget, 'policy': policy,
                        'members': members | map(attribute='i') | list}}) -%}
                  {%- for d in ['charge', 'discharge'] -%}
                    {%- set latch = 'full' if d == 'charge' else 'empty' -%}
                    {%- set lk = 'lkc' if d == 'charge' else 'lkd' -%}
                    {%- set prev = p.c if d == 'charge' else p.d -%}
                    {%- set cap = 'capc' if d == 'charge' else 'capd' -%}
                    {%- set w = namespace(R=budget, out={}, add={}, elig=[]) -%}
                    {#- Unreachable: keep what it has, its share is not ours to hand out -#}
                    {%- for m in members | rejectattr('live') -%}
                      {%- set keep = m[lk] if m[lk] > 0 else (prev[m.i | string] if (m.i | string) in prev else m[cap]) -%}
                      {%- set w.out = w.out | combine({m.i | string: keep | int}) -%}
                      {%- set w.R = w.R - keep -%}
                    {%- endfor -%}
                    {%- set active = members | selectattr('live') | list -%}
                    {%- set w.R = [w.R - 100 * (active | length), 0] | max -%}
                    {%- set w.elig = active | rejectattr(latch) | list -%}
                    {%- set rest = active | selectattr(latch) | list -%}
                    {#- Follow battery order also when no battery can go this way (all full /
                        all empty): the first in the order keeps the high ceiling, so nothing
                        flips back and forth when they become eligible again. -#}
                    {%- set follow_pool = w.elig if w.elig else rest -%}
                    {%- if (policy == 'One at a time' and w.elig) or (policy == 'Follow battery order' and follow_pool) -%}
                      {%- set key = G ~ '_' ~ d -%}
                      {%- if policy == 'Follow battery order' -%}
                        {%- set ids = follow_pool | map(attribute='i') | list -%}
                        {%- set first = ordr.d[d] | select('in', ids) | list -%}
                        {%- set cand = follow_pool | selectattr('i', 'eq', first[0] if first else 0) | list or follow_pool -%}
                        {#- Hand over only when the new first battery is 5 SoC points further
                            along than the current leader (charging: more room below its charge
                            cutoff; discharging: more above its discharge cutoff). Each handover
                            rewrites 44002/44003 (EEPROM) on the group's batteries; without this a
                            sunny day swaps at almost every 30-min order update. A leader that
                            is full / empty is not in the pool and hands over at once. -#}
                        {%- set cur = follow_pool | selectattr('i', 'eq', p.lead[key] if key in p.lead else 0) | list -%}
                        {%- if cur and cur[0].i != cand[0].i and cur[0].soc >= 0 and cand[0].soc >= 0 -%}
                          {%- set sc_new = (cand[0].hi - cand[0].soc) if d == 'charge' else (cand[0].soc - cand[0].lo) -%}
                          {%- set sc_cur = (cur[0].hi - cur[0].soc) if d == 'charge' else (cur[0].soc - cur[0].lo) -%}
                          {%- if sc_new < sc_cur + 5 -%}
                            {%- set cand = cur -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- else -%}
                        {%- set cand = w.elig | selectattr('i', 'eq', p.lead[key] if key in p.lead else 0) | list -%}
                        {%- if not cand -%}
                          {#- charging: fullest first (fills soonest); discharging: emptiest first -#}
                          {%- set cand = w.elig | sort(attribute='soc', reverse=(d == 'charge')) | list -%}
                        {%- endif -%}
                      {%- endif -%}
                      {%- set L = cand[0] -%}
                      {%- set gs.lead = gs.lead | combine({key: L.i}) -%}
                      {%- set give = [[L[cap] - 100, 0] | max, w.R] | min -%}
                      {%- set w.add = w.add | combine({L.i | string: give}) -%}
                      {%- set w.R = w.R - give -%}
                      {%- set w.elig = w.elig | rejectattr('i', 'eq', L.i) | list -%}
                      {%- set rest = rest | rejectattr('i', 'eq', L.i) | list -%}
                    {%- endif -%}
                    {#- Water-fill: equal shares, capped per battery, smallest cap first -#}
                    {%- for pool in [w.elig, rest] -%}
                      {%- set srt = pool | sort(attribute=cap) | list -%}
                      {%- for m in srt -%}
                        {%- set give = [[m[cap] - 100, 0] | max, (w.R / ((srt | length) - loop.index0)) | int] | min -%}
                        {%- set w.add = w.add | combine({m.i | string: give}) -%}
                        {%- set w.R = w.R - give -%}
                      {%- endfor -%}
                    {%- endfor -%}
                    {%- for m in active -%}
                      {%- set k = m.i | string -%}
                      {%- set w.out = w.out | combine({k: 100 + (w.add[k] if k in w.add else 0)}) -%}
                    {%- endfor -%}
                    {%- if d == 'charge' -%}{%- set gs.c = gs.c | combine(w.out) -%}
                    {%- else -%}{%- set gs.d = gs.d | combine(w.out) -%}{%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ {'charge': gs.c, 'discharge': gs.d, 'leaders': gs.lead, 'groups': gs.groups,
                'problems': gs.problems,
                'full': ns.bats | selectattr('full') | map(attribute='i') | list,
                'empty': ns.bats | selectattr('empty') | map(attribute='i') | list,
                'last_known_charge': ns.lkc, 'last_known_discharge': ns.lkd} | tojson }}
    sensor:
      - name: "HBA Power Limits"
        unique_id: hba_power_limits
        icon: mdi:fuse
        # Not used / Check settings (a group lacks a max power) / Active
        state: >-
          {%- set x = plan | from_json if plan is string else plan -%}
          {{ 'Check settings' if x.problems else ('Active' if x.groups else 'Not used') }}
        attributes:
          # Intended register values per battery number ("1": 1650), managed batteries only
          charge: "{{ (plan | from_json if plan is string else plan).charge }}"
          discharge: "{{ (plan | from_json if plan is string else plan).discharge }}"
          groups: "{{ (plan | from_json if plan is string else plan).groups }}"
          problems: "{{ (plan | from_json if plan is string else plan).problems }}"
          leaders: "{{ (plan | from_json if plan is string else plan).leaders }}"
          full: "{{ (plan | from_json if plan is string else plan).full }}"
          empty: "{{ (plan | from_json if plan is string else plan).empty }}"
          last_known_charge: "{{ (plan | from_json if plan is string else plan).last_known_charge }}"
          last_known_discharge: "{{ (plan | from_json if plan is string else plan).last_known_discharge }}"

  # ── Room per phase: main fuse limit and Charge alongside EV ───────────────────
  # What the batteries on each phase may still charge / discharge in total (W), used by
  # hba_set_batteries:
  #   fuse_charge_w / fuse_discharge_w — input_number.hba_phase_current_limit (main fuse,
  #     every strategy, 0 = off): the limit minus everything else on the phase, for import
  #     (charging) and export (discharging, e.g. Sell plus solar on the same phase)
  #   ev_room_w — Charge alongside EV, car first: input_number.hba_ev_phase_current_limit
  #     minus everything else, minus the room the car still needs to reach
  #     input_number.hba_ev_max_current (ev_reserve_w; the car's power from the user-defined
  #     sensor.ev_charger_power_lX or sensor.ev_charger_power, ev_source). Without that
  #     reservation the batteries filled the room the car wanted after the charger's load
  #     balancing throttled it (prod 2026-10-24: 5.3 instead of 10.5 kW for minutes).
  #   missing_sensors — sensor.p1_meter_power_lX needed for the batteries' phases but absent
  # Phase power from the user-defined sensor.p1_meter_power_lX (W, + = import) and
  # optional sensor.p1_meter_voltage_lX (else 230 V); no reading = no room on that phase.
  # Every limit only ever lowers what the batteries may do. Trigger-based so it is computed
  # once per update (it was three copies of the same template). Recorder-excluded.
  - triggers:
      - trigger: state
        entity_id:
          - sensor.p1_meter_power_l1
          - sensor.p1_meter_power_l2
          - sensor.p1_meter_power_l3
          - sensor.p1_meter_voltage_l1
          - sensor.p1_meter_voltage_l2
          - sensor.p1_meter_voltage_l3
          - sensor.ev_charger_power
          - sensor.ev_charger_power_l1
          - sensor.ev_charger_power_l2
          - sensor.ev_charger_power_l3
          - sensor.marstek_m1_ac_power
          - sensor.marstek_m2_ac_power
          - sensor.marstek_m3_ac_power
          - sensor.marstek_m4_ac_power
          - sensor.marstek_m5_ac_power
          - sensor.marstek_m6_ac_power
          - input_select.hba_marstek_m1_phase
          - input_select.hba_marstek_m2_phase
          - input_select.hba_marstek_m3_phase
          - input_select.hba_marstek_m4_phase
          - input_select.hba_marstek_m5_phase
          - input_select.hba_marstek_m6_phase
          - binary_sensor.hba_ev_charge_alongside
          - input_number.hba_ev_phase_current_limit
          - input_number.hba_ev_max_current
          - input_number.hba_phase_current_limit
          - input_number.hba_battery_count
          - input_select.hba_control_strategy_during_ev_charge
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        seconds: "/30"
    actions:
      - variables:
          room: >-
            {%- set count = states('input_number.hba_battery_count') | int(1) -%}
            {%- set evlim = states('input_number.hba_ev_phase_current_limit') | float(22) -%}
            {%- set fuse = states('input_number.hba_phase_current_limit') | float(0) -%}
            {%- set bat = namespace(c={'L1': 0, 'L2': 0, 'L3': 0}, d={'L1': 0, 'L2': 0, 'L3': 0}, need=[]) -%}
            {%- for i in range(1, count + 1) -%}
              {%- set ph = states('input_select.hba_marstek_m' ~ i ~ '_phase') -%}
              {%- set ac = states('sensor.marstek_m' ~ i ~ '_ac_power') | float(0) -%}
              {%- set bat.need = bat.need + ([ph] if ph in ['L1', 'L2', 'L3'] else ['L1', 'L2', 'L3']) -%}
              {%- if ph in ['L1', 'L2', 'L3'] -%}
                {#- ac_power: negative = charging, positive = discharging -#}
                {%- set bat.c = bat.c | combine({ph: bat.c[ph] + ([-ac, 0] | max)}) -%}
                {%- set bat.d = bat.d | combine({ph: bat.d[ph] + ([ac, 0] | max)}) -%}
              {%- endif -%}
            {%- endfor -%}
            {#- The car's power per GRID phase (per-phase sensors win over the total) -#}
            {%- set evmax = states('input_number.hba_ev_max_current') | float(0) -%}
            {%- set charging = is_state('binary_sensor.hba_ev_charge_alongside', 'on') -%}
            {%- set per = ['l1', 'l2', 'l3'] | map('regex_replace', '^', 'sensor.ev_charger_power_') | select('has_value') | list -%}
            {%- set src = 'per phase' if per else ('total' if has_value('sensor.ev_charger_power') else 'none') -%}
            {%- set evw = namespace(d={'L1': 0, 'L2': 0, 'L3': 0}) -%}
            {%- for ph in ['L1', 'L2', 'L3'] -%}
              {%- if src == 'per phase' -%}
                {%- set evw.d = evw.d | combine({ph: [states('sensor.ev_charger_power_' ~ (ph | lower)) | float(0), 0] | max}) -%}
              {%- elif src == 'total' -%}
                {%- set evw.d = evw.d | combine({ph: ([states('sensor.ev_charger_power') | float(0), 0] | max) / 3}) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set used = evw.d.items() | selectattr(1, 'gt', 230) | map(attribute=0) | list -%}
            {%- set used = used if (src == 'per phase' and used) else ['L1', 'L2', 'L3'] -%}
            {%- set out = namespace(ev={}, res={}, fc={}, fd={}) -%}
            {%- for ph in ['L1', 'L2', 'L3'] -%}
              {%- set n = ph | lower -%}
              {%- set v = states('sensor.p1_meter_voltage_' ~ n) | float(0) -%}
              {%- set v = v if v > 100 else 230 -%}
              {%- set r = ([evmax * v - evw.d[ph], 0] | max) if (charging and evmax > 0 and src != 'none' and ph in used) else 0 -%}
              {%- set out.res = out.res | combine({ph: r | round(0) | int}) -%}
              {%- if has_value('sensor.p1_meter_power_' ~ n) -%}
                {%- set net = states('sensor.p1_meter_power_' ~ n) | float(0) -%}
                {#- everything else on the phase = measured minus the batteries' own share -#}
                {%- set other_imp = net - bat.c[ph] + bat.d[ph] -%}
                {%- set out.ev = out.ev | combine({ph: [evlim * v - other_imp - r, 0] | max | round(0) | int}) -%}
                {%- set out.fc = out.fc | combine({ph: [fuse * v - other_imp, 0] | max | round(0) | int}) -%}
                {%- set out.fd = out.fd | combine({ph: [fuse * v + other_imp, 0] | max | round(0) | int}) -%}
              {%- else -%}
                {%- set out.ev = out.ev | combine({ph: 0}) -%}
                {%- set out.fc = out.fc | combine({ph: 0}) -%}
                {%- set out.fd = out.fd | combine({ph: 0}) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set miss = bat.need | unique | sort | map('lower') | map('regex_replace', '^', 'sensor.p1_meter_power_') | reject('has_value') | list -%}
            {{ {'ev': out.ev, 'res': out.res, 'src': src, 'fc': out.fc if fuse > 0 else {},
                 'fd': out.fd if fuse > 0 else {}, 'miss': miss | join(', ')} | tojson }}
    sensor:
      - name: "HBA Phase Room"
        unique_id: hba_phase_room
        icon: mdi:sine-wave
        unit_of_measurement: W
        # The tightest charging room that applies now (fuse, and car first while the car
        # charges); 0 when no per-phase limit is in use.
        state: >-
          {%- set x = room | from_json if room is string else room -%}
          {%- set vals = (x.fc.values() | list) + ((x.ev.values() | list) if is_state('binary_sensor.hba_ev_charge_alongside', 'on') else []) -%}
          {{ (vals | min) if vals else 0 }}
        attributes:
          ev_room_w: "{{ (room | from_json if room is string else room).ev }}"
          ev_reserve_w: "{{ (room | from_json if room is string else room).res }}"
          ev_source: "{{ (room | from_json if room is string else room).src }}"
          fuse_charge_w: "{{ (room | from_json if room is string else room).fc }}"
          fuse_discharge_w: "{{ (room | from_json if room is string else room).fd }}"
          missing_sensors: "{{ (room | from_json if room is string else room).miss }}"

  # ── What limits charging / discharging right now (like the Peblar's limit source) ──
  # The hba_set_batteries waterfall replayed at full request: per battery the most it could
  # take now and the tightest limit — register limit (power group / own limit / set in the
  # battery), BMS charge current, slow charge, the per-phase room (main fuse, car first) shared
  # in battery order, or not available at all (full / empty / offline / fault / never
  # discharging while charging alongside the EV). The Limit Source sensors name the limit
  # costing the most watts below 2500 W per battery ("Not limited" when none). Only reports;
  # what the strategy asks for is not a limit here. Every 5 s: the phase room moves with every
  # P1 update. sensor.hba_limits_now (per battery) is recorder-excluded; the two Limit Source
  # sensors are recorded and only write a row when the reason changes.
  - triggers:
      - trigger: time_pattern
        seconds: "/5"
      - trigger: state
        entity_id:
          - sensor.hba_power_limits
          - binary_sensor.hba_ev_charge_alongside
          - input_number.hba_battery_count
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - variables:
          lim: >-
            {%- set count = states('input_number.hba_battery_count') | int(1) -%}
            {%- set nominal = 2500 -%}
            {%- set along = is_state('binary_sensor.hba_ev_charge_alongside', 'on') -%}
            {%- set evfirst = along and is_state_attr('binary_sensor.hba_ev_charge_alongside', 'mode', 'EV first') -%}
            {%- set fc = state_attr('sensor.hba_phase_room', 'fuse_charge_w') -%}
            {%- set fc = fc if fc is mapping else {} -%}
            {%- set fd = state_attr('sensor.hba_phase_room', 'fuse_discharge_w') -%}
            {%- set fd = fd if fd is mapping else {} -%}
            {%- set er = state_attr('sensor.hba_phase_room', 'ev_room_w') if evfirst else {} -%}
            {%- set er = er if er is mapping else {} -%}
            {#- Room per phase as [W, reason]: the tighter of main fuse and car first -#}
            {%- set rc = namespace(d={}) -%}
            {%- set rd = namespace(d={}) -%}
            {%- for ph in ['L1', 'L2', 'L3'] -%}
              {%- if ph in fc and ph in er -%}
                {%- set rc.d = rc.d | combine({ph: ([fc[ph], 'Main fuse ' ~ ph] if fc[ph] <= er[ph] else [er[ph], 'Car first ' ~ ph])}) -%}
              {%- elif ph in fc -%}
                {%- set rc.d = rc.d | combine({ph: [fc[ph], 'Main fuse ' ~ ph]}) -%}
              {%- elif ph in er -%}
                {%- set rc.d = rc.d | combine({ph: [er[ph], 'Car first ' ~ ph]}) -%}
              {%- endif -%}
              {%- if ph in fd -%}
                {%- set rd.d = rd.d | combine({ph: [fd[ph], 'Main fuse ' ~ ph]}) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set sc_thr1 = states('input_number.hba_control_slow_charge_soc_threshold_1') | float(95) -%}
            {%- set sc_lim1 = states('input_number.hba_control_slow_charge_power_limit_1') | float(1500) | int -%}
            {%- set sc_thr2 = states('input_number.hba_control_slow_charge_soc_threshold_2') | float(99) -%}
            {%- set sc_lim2 = states('input_number.hba_control_slow_charge_power_limit_2') | float(1000) | int -%}
            {%- set p = states('input_number.hba_control_prioritize_battery') | int(1) -%}
            {%- set p = p if (1 <= p and p <= count) else 1 -%}
            {%- set auto = states('input_select.hba_control_priority_change_interval') == 'Auto balance (SoC)' -%}
            {%- set out = namespace(c={}, d={}, cl={}, dl={}, ct=0, dt=0, co=[], do=[]) -%}
            {%- for dir in ['charge', 'discharge'] -%}
              {#- Same order as hba_set_batteries -#}
              {%- set o = namespace(l=[]) -%}
              {%- set so = state_attr('sensor.hba_battery_order', dir ~ '_order') -%}
              {%- if auto and so is sequence and so is not string -%}
                {%- for b in so | map('int') if 1 <= b <= count and b not in o.l -%}
                  {%- set o.l = o.l + [b] -%}
                {%- endfor -%}
              {%- endif -%}
              {%- for k in range(count) -%}
                {%- set b = ((p - 1 + k) % count) + 1 -%}
                {%- if b not in o.l -%}{%- set o.l = o.l + [b] -%}{%- endif -%}
              {%- endfor -%}
              {#- Power group leader first, as in hba_set_batteries -#}
              {%- set plg = state_attr('sensor.hba_power_limits', 'groups') -%}
              {%- set pll = state_attr('sensor.hba_power_limits', 'leaders') -%}
              {%- if plg is mapping and pll is mapping -%}
                {%- for G, x in plg.items() if (G ~ '_' ~ dir) in pll -%}
                  {%- set L = pll[G ~ '_' ~ dir] | int -%}
                  {%- set fm = o.l | select('in', x.members | map('int') | list) | list -%}
                  {%- if fm and fm[0] != L and L in o.l -%}
                    {%- set sw = namespace(l=[]) -%}
                    {%- for b in o.l -%}{%- set sw.l = sw.l + [L if b == fm[0] else (fm[0] if b == L else b)] -%}{%- endfor -%}
                    {%- set o.l = sw.l -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {%- if dir == 'charge' -%}{%- set out.co = o.l -%}{%- else -%}{%- set out.do = o.l -%}{%- endif -%}
              {%- set room = namespace(d=(rc.d if dir == 'charge' else rd.d)) -%}
              {%- set lk = state_attr('sensor.hba_power_limits', 'last_known_' ~ dir) -%}
              {%- set lk = lk if lk is mapping else {} -%}
              {%- for bat in o.l -%}
                {%- set k = bat | string -%}
                {%- set soc = states('sensor.marstek_m' ~ bat ~ '_battery_state_of_charge') | float(0) -%}
                {%- set inv = states('sensor.marstek_m' ~ bat ~ '_inverter_state') -%}
                {%- set hb = states.sensor['marstek_m' ~ bat ~ '_battery_power'] -%}
                {%- set live = hb is not none and hb.state not in ['unavailable', 'unknown']
                               and (now() - hb.last_reported).total_seconds() <= 30 -%}
                {%- set rbc = states('number.marstek_m' ~ bat ~ '_max_charge_power') | float(2500) -%}
                {%- set rbd = states('number.marstek_m' ~ bat ~ '_max_discharge_power') | float(2500) -%}
                {%- set rb = rbc if dir == 'charge' else rbd -%}
                {%- set reg = ((lk[k] if k in lk else 2500) if rbc == 0 and rbd == 0 else rb) | int -%}
                {%- set own = states('input_number.hba_marstek_m' ~ bat ~ '_max_' ~ dir ~ '_power') | float(0) -%}
                {%- set grp = states('input_select.hba_marstek_m' ~ bat ~ '_power_group') -%}
                {%- set reg_r = ('Power group ' ~ grp) if grp in ['A', 'B', 'C'] and (own <= 0 or reg < own - 1)
                                else ('Own limit' if own > 0 else 'Battery setting') -%}
                {%- set best = namespace(w=nominal, r='None') -%}
                {%- if not live -%}
                  {%- set best.w = 0 -%}{%- set best.r = 'Offline' -%}
                {%- elif inv in ['unknown', 'unavailable'] -%}
                  {%- set best.w = 0 -%}{%- set best.r = 'Offline' -%}
                {%- elif inv == 'Fault' -%}
                  {%- set best.w = 0 -%}{%- set best.r = 'Fault' -%}
                {%- elif dir == 'charge' and soc >= states('input_number.hba_marstek_m' ~ bat ~ '_charging_cutoff_capacity') | float(100) -%}
                  {%- set best.w = 0 -%}{%- set best.r = 'Full' -%}
                {%- elif dir == 'discharge' and along -%}
                  {%- set best.w = 0 -%}{%- set best.r = 'Charge alongside EV' -%}
                {%- elif dir == 'discharge' and soc <= states('input_number.hba_marstek_m' ~ bat ~ '_discharging_cutoff_capacity') | float(13) -%}
                  {%- set best.w = 0 -%}{%- set best.r = 'Empty' -%}
                {%- else -%}
                  {%- set cands = [[reg, reg_r]] -%}
                  {%- if dir == 'charge' -%}
                    {%- set bms_a = states('sensor.marstek_m' ~ bat ~ '_battery_charge_current_limit') | float(-1) -%}
                    {%- set volt = states('sensor.marstek_m' ~ bat ~ '_battery_voltage') | float(0) -%}
                    {%- if bms_a >= 0 and volt > 40 -%}
                      {%- set cands = cands + [[(bms_a * volt) | int, 'BMS']] -%}
                    {%- endif -%}
                    {%- if sc_lim2 > 0 and soc >= sc_thr2 -%}
                      {%- set cands = cands + [[sc_lim2, 'Slow charge']] -%}
                    {%- elif sc_lim1 > 0 and soc >= sc_thr1 -%}
                      {%- set cands = cands + [[sc_lim1, 'Slow charge']] -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- set ph = states('input_select.hba_marstek_m' ~ bat ~ '_phase') -%}
                  {%- if room.d -%}
                    {%- if ph in room.d -%}
                      {%- set cands = cands + [room.d[ph]] -%}
                    {%- else -%}
                      {#- No phase set: counts against every phase, so the tightest one -#}
                      {%- set t = namespace(x=none) -%}
                      {%- for x in room.d.values() if t.x is none or x[0] < t.x[0] -%}{%- set t.x = x -%}{%- endfor -%}
                      {%- set cands = cands + [t.x] -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- for w, r in cands if w < best.w -%}
                    {%- set best.w = [w, 0] | max | int -%}{%- set best.r = r -%}
                  {%- endfor -%}
                  {%- if room.d and ph in room.d -%}
                    {%- set room.d = room.d | combine({ph: [room.d[ph][0] - best.w, room.d[ph][1]]}) -%}
                  {%- elif room.d -%}
                    {%- set nd = namespace(d={}) -%}
                    {%- for q, x in room.d.items() -%}{%- set nd.d = nd.d | combine({q: [x[0] - best.w, x[1]]}) -%}{%- endfor -%}
                    {%- set room.d = nd.d -%}
                  {%- endif -%}
                {%- endif -%}
                {%- set item = {k: {'w': best.w, 'reason': best.r}} -%}
                {%- if dir == 'charge' -%}
                  {%- set out.c = out.c | combine(item) -%}
                  {%- set out.ct = out.ct + best.w -%}
                  {%- if best.r != 'None' -%}
                    {%- set out.cl = out.cl | combine({best.r: out.cl.get(best.r, 0) + nominal - best.w}) -%}
                  {%- endif -%}
                {%- else -%}
                  {%- set out.d = out.d | combine(item) -%}
                  {%- set out.dt = out.dt + best.w -%}
                  {%- if best.r != 'None' -%}
                    {%- set out.dl = out.dl | combine({best.r: out.dl.get(best.r, 0) + nominal - best.w}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {#- The limit costing the most wins, but the current reason only gives way when it is
                gone, when the new one costs 1000 W more, or when the new one has been on top for
                60 s (remembered in sensor.hba_limits_now *_pending). A 300 W margin was not enough:
                with the car first, L1 and L3 swing by more than that and the state flipped ~50
                times an hour (prod 2026-10-25), a recorder row each time. -#}
            {#- The Limit Source states name the KIND of limit (Car first, Main fuse, ...), not the
                phase: with the car first the phase that costs most changed constantly (36 changes
                an hour even with the 60 s rule, prod 2026-10-25). Per battery (and so the phases)
                stays in sensor.hba_limits_now and the Overview line. -#}
            {%- set kinds = namespace(c={}, d={}) -%}
            {%- for r, w in out.cl.items() -%}
              {%- set k = r[:-3] if (r.startswith('Car first ') or r.startswith('Main fuse ')) else r -%}
              {%- set kinds.c = kinds.c | combine({k: kinds.c.get(k, 0) + w}) -%}
            {%- endfor -%}
            {%- for r, w in out.dl.items() -%}
              {%- set k = r[:-3] if (r.startswith('Car first ') or r.startswith('Main fuse ')) else r -%}
              {%- set kinds.d = kinds.d | combine({k: kinds.d.get(k, 0) + w}) -%}
            {%- endfor -%}
            {%- set nowts = as_timestamp(now()) | int -%}
            {%- set sel = namespace(cs='Not limited', ds='Not limited', cp={}, dp={}) -%}
            {%- for dir, lost, cur, pend in [('c', kinds.c, states('sensor.hba_charge_limit_source'), state_attr('sensor.hba_limits_now', 'charge_pending')),
                                            ('d', kinds.d, states('sensor.hba_discharge_limit_source'), state_attr('sensor.hba_limits_now', 'discharge_pending'))] -%}
              {%- set pend = pend if pend is mapping else {} -%}
              {%- set top = (lost.items() | sort(attribute='1', reverse=true) | first) if lost else none -%}
              {%- set res = namespace(r='Not limited', p={}) -%}
              {%- if top is none -%}
              {%- elif cur == top[0] or cur not in lost or top[1] >= lost[cur] + 1000 -%}
                {%- set res.r = top[0] -%}
              {%- elif pend.get('r') == top[0] and nowts - (pend.get('s') | int(nowts)) >= 60 -%}
                {%- set res.r = top[0] -%}
              {%- else -%}
                {%- set res.r = cur -%}
                {%- set res.p = pend if pend.get('r') == top[0] else {'r': top[0], 's': nowts} -%}
              {%- endif -%}
              {%- if dir == 'c' -%}{%- set sel.cs = res.r -%}{%- set sel.cp = res.p -%}
              {%- else -%}{%- set sel.ds = res.r -%}{%- set sel.dp = res.p -%}{%- endif -%}
            {%- endfor -%}
            {{ {'c': out.c, 'd': out.d, 'cl': out.cl, 'dl': out.dl, 'ct': out.ct, 'dt': out.dt,
                'cs': sel.cs, 'ds': sel.ds, 'co': out.co, 'do': out.do, 'cp': sel.cp, 'dp': sel.dp} | tojson }}
    sensor:
      - name: "HBA Charge Limit Source"
        unique_id: hba_charge_limit_source
        icon: mdi:battery-arrow-up-outline
        state: "{{ (lim | from_json if lim is string else lim).cs }}"
      - name: "HBA Discharge Limit Source"
        unique_id: hba_discharge_limit_source
        icon: mdi:battery-arrow-down-outline
        state: "{{ (lim | from_json if lim is string else lim).ds }}"
      # Per battery {w, reason}; *_lost_w = watts below 2500 W per battery,
      # by reason. State = what all batteries could charge together right now.
      - name: "HBA Limits Now"
        unique_id: hba_limits_now
        icon: mdi:speedometer-medium
        unit_of_measurement: W
        state: "{{ (lim | from_json if lim is string else lim).ct }}"
        attributes:
          charge: "{{ (lim | from_json if lim is string else lim).c }}"
          discharge: "{{ (lim | from_json if lim is string else lim).d }}"
          charge_lost_w: "{{ (lim | from_json if lim is string else lim).cl }}"
          discharge_lost_w: "{{ (lim | from_json if lim is string else lim).dl }}"
          discharge_max_w: "{{ (lim | from_json if lim is string else lim).dt }}"
          # The order the batteries are used in (power group leaders first in their group)
          charge_order: "{{ (lim | from_json if lim is string else lim).co }}"
          discharge_order: "{{ (lim | from_json if lim is string else lim).do }}"
          # A new limit source waiting to take over (reason + since), see the selection above
          charge_pending: "{{ (lim | from_json if lim is string else lim).cp }}"
          discharge_pending: "{{ (lim | from_json if lim is string else lim).dp }}"
    binary_sensor:
      # Overview hint: the batteries run at what a limit worth knowing about allows — main
      # fuse, car first or the BMS (charging), main fuse (discharging). Power groups, full /
      # empty and offline are left out (always there with groups, normal, or own banners).
      # On within 150 W of the max, off again below 400 W under it, 30 s / 60 s delay.
      - name: "HBA Battery Power Limited"
        unique_id: hba_battery_power_limited
        icon: mdi:speedometer-slow
        # The room per phase moves with every P1 update: without a delay the Overview line
        # switched ~50 times an hour while the car charged (prod 2026-10-25).
        delay_on: "00:00:30"
        delay_off: "00:01:00"
        state: >-
          {%- set x = lim | from_json if lim is string else lim -%}
          {%- set p = states('sensor.hba_total_battery_power') | float(0) -%}
          {%- set m = 400 if is_state('binary_sensor.hba_battery_power_limited', 'on') else 150 -%}
          {%- set c = (x.cs.startswith('Main fuse') or x.cs.startswith('Car first') or x.cs == 'BMS')
                      and p < -50 and -p >= x.ct - m -%}
          {%- set d = x.ds.startswith('Main fuse') and p > 50 and p >= x.dt - m -%}
          {{ c or d }}
        attributes:
          direction: >-
            {{ 'charge' if states('sensor.hba_total_battery_power') | float(0) < 0 else 'discharge' }}
          reason: >-
            {%- set x = lim | from_json if lim is string else lim -%}
            {{ x.cs if states('sensor.hba_total_battery_power') | float(0) < 0 else x.ds }}
          max_w: >-
            {%- set x = lim | from_json if lim is string else lim -%}
            {{ x.ct if states('sensor.hba_total_battery_power') | float(0) < 0 else x.dt }}

######################################################################################################
# RECORDER
######################################################################################################
# Exclude high-frequency technical entities from the recorder to reduce database size.
recorder:
  exclude:
    entity_globs:
      # All HBA scripts — run at ~1 Hz, generate on/off per execution, history is not useful
      - script.hba_*
      # Forcible power setpoints — continuous numeric value, changes every ~1 s
      - number.marstek_m*_forcible_charge_power
      - number.marstek_m*_forcible_discharge_power
      # Raw Modbus sensor backing the forcible power setpoints — also updated every poll
      - sensor.marstek_m*_forcible_charge_power_number
      - sensor.marstek_m*_forcible_discharge_power_number
      # PID control terms and deviations (updated every ~1 s during operation)
      - input_number.hba_control_*_term
      - input_number.hba_control_*_deviation
      # Per-battery idle timestamps — updated on every battery write (~1 s)
      - input_datetime.hba_last_active_m*
      # Last-commanded register cache — rewritten whenever a battery command
      # changes; internal bookkeeping, no history value
      - input_text.hba_last_cmd_m*
      # Dynamic strategy calculated averages (updated hourly)
      - input_number.hba_strategy_dynamic_*_avg_*
      # Individual cell voltages — 16 cells × 3 batteries ≈ 82 K writes/day; live values
      # readable in Developer Tools; battery_cell_voltage_delta is the useful chart target
      - sensor.marstek_m*_battery_cell_*_voltage
      # Raw Modbus register backing sensor.marstek_m*_inverter_state — updates every poll
      - sensor.marstek_m*_inverter_state_number
      # Per-phase grid power / voltage for Charge alongside EV (user-defined in
      # hba_config.yaml) — ~1 update/s each, derived from meter sensors that are recorded
      - sensor.p1_meter_power_l*
      - sensor.p1_meter_voltage_l*
      - sensor.ev_charger_power_l*
    entities:
      # Room per phase (main fuse limit, Charge alongside EV) — recalculated on every P1 update
      - sensor.hba_phase_room
      # Per-battery limits now — recalculated every 5 s (the Limit Source sensors stay recorded)
      - sensor.hba_limits_now
      # EV charger total power for Charge alongside EV (user-defined in hba_config.yaml) —
      # a copy of the charger's own power sensor, which its integration already records
      - sensor.ev_charger_power
      # Control loop automation — triggers every ~1 s, history is not useful
      - automation.hba_control_loop_p1_meter_triggered
      # Flow trace helpers — updated every control cycle
      - input_text.hba_strategy_active_flow
      - input_text.hba_control_cycle_state
      # Debug value (updated frequently when debug mode is active)
      - input_number.hba_control_debug
      # Commanded power — updates on every battery write (~1 s during active control)
      - sensor.hba_total_commanded_power
      # Status field (updated every P1 cycle, ~1 s)
      - sensor.hba_time_remaining
      - input_number.hba_control_error_signal    # updated every ~1 s during operation
      # input_number.hba_control_pid_output is intentionally kept in the recorder (PID chart history)
      # but excluded from the logbook below — logbook at 1 Hz is noise, history graph is useful.

######################################################################################################
# LOGBOOK
######################################################################################################
# Suppress HBA/Marstek control-loop entities from the HA logbook.
# These are written every ~1 s during operation; logbook entries are not useful.
#
# NOTE: the modbus domain exclusion is intentionally absent here — other packages
# (e.g. an EV charger) may also use Modbus and should not be silently suppressed.
# Add it to configuration.yaml instead (install.sh checks for this):
#
#   logbook:
#     exclude:
#       domains:
#         - modbus   # suppresses ~280 000 write_register entries/day from HBA
logbook:
  exclude:
    entity_globs:
      # Battery control outputs — written every ~1 s by hba_set_batteries
      - number.marstek_m*_forcible_charge_power
      - number.marstek_m*_forcible_discharge_power
      - select.marstek_m*_forcible_charge_discharge
      # HBA scripts — dispatched every ~1 s
      - script.hba_*
      # PID internal state (terms + deviations) — updated every ~1 s
      - input_number.hba_control_*_term
      - input_number.hba_control_*_deviation
      # Per-battery idle timestamps
      - input_datetime.hba_last_active_m*
      # Last-commanded register cache
      - input_text.hba_last_cmd_m*
    entities:
      # PID signal and output — updated every ~1 s during operation
      - input_number.hba_control_error_signal
      - input_number.hba_control_pid_output
      - input_number.hba_control_debug
      # Control loop automation — triggers every ~1 s
      - automation.hba_control_loop_p1_meter_triggered
      # Flow trace helpers — updated every control cycle
      - input_text.hba_strategy_active_flow
      - input_text.hba_control_cycle_state
