input_number:
  # --- User-settable configuration values (mode: box = text input, not slider) ---
  hba_battery_count:
    name: "Number of batteries"
    min: 1
    max: 6
    step: 1
    mode: slider
    icon: mdi:counter
  hba_control_prioritize_battery:
    name: "Priority battery"
    min: 1
    max: 6
    step: 1
    mode: box
    icon: mdi:star-circle

  # --- PID setpoint and tuning ---
  hba_target_grid_consumption:
    name: "Target grid consumption"
    min: -15000
    max: 15000
    step: 1
    mode: box
    unit_of_measurement: W
    icon: mdi:transmission-tower
  hba_control_hysteresis:
    name: "Hysteresis"
    min: 0
    max: 200
    step: 1
    mode: box
    unit_of_measurement: W
    icon: mdi:arrow-expand-horizontal
  # An EXTRA battery (one that is not running yet, while another already takes power)
  # only starts when its share is at least this much; the first battery always may.
  # Below ~200 W a Marstek mostly covers its own fixed ~20-25 W (prod 2026-10-24,
  # discharge efficiency ~74 % at 100-200 W, ~87 % at 200-300 W), and a few-watt share
  # only toggled its inverter Standby <-> Charge. A battery already running may ramp
  # down to 0 smoothly. 0 = off.
  hba_control_min_start_power:
    name: "Minimum power to start an extra battery"
    min: 0
    max: 1000
    step: 10
    mode: box
    unit_of_measurement: W
    icon: mdi:power-plug-battery-outline
  hba_control_idle_time:
    name: "Idle timeout"
    min: 0
    max: 60
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:timer-pause
  # Modbus write de-duplication. hba_write_battery skips a battery's three
  # register writes when the command is unchanged, but re-sends them at least
  # this often so a battery that silently drops its setpoint recovers on its
  # own. Each Modbus write costs ~150 ms and blocks the control loop, and ~78 %
  # of the writes in the naive every-cycle scheme are redundant — skipping them
  # roughly halves the loop period under load.
  # Set to 0 to disable de-duplication entirely (write every cycle, pre-r15
  # behaviour) if your firmware turns out to need the constant refresh.
  hba_control_write_refresh_secs:
    name: "Modbus command refresh interval"
    min: 0
    max: 300
    step: 5
    mode: box
    unit_of_measurement: s
    icon: mdi:refresh-circle
  hba_control_kp:
    name: "PID Kp (proportional)"
    min: 0
    max: 2
    step: 0.01
    mode: box
    icon: mdi:tune
  hba_control_ki:
    name: "PID Ki (integral)"
    min: 0
    max: 5
    step: 0.01
    mode: box
    icon: mdi:tune-variant
  hba_control_kd:
    name: "PID Kd (derivative)"
    min: 0
    max: 5
    step: 0.01
    mode: box
    icon: mdi:tune-vertical
  hba_control_pid_output_dampening:
    name: "PID output dampening"
    min: 0
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:waves
  hba_control_error_signal_dampening:
    name: "Error signal dampening"
    min: 0
    max: 90
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:waves-arrow-right

  # --- PID internal state (written by controller script) ---
  # Range ±100 kW. HBC's ±15 kW (error/output) and ±10 kW (terms) are display-only in
  # Node-RED, but here these helpers ARE the controller state: a value outside the range
  # makes input_number.set_value fail and aborts the whole control cycle. A 3 x 25 A
  # connection already allows ~17 kW, and the I-term reaches 15 kW with six batteries.
  # The controller also clamps every write to this range (hba_strategy_self_consumption).
  hba_control_error_signal:
    name: "PID error signal"
    min: -100000
    max: 100000
    step: 1
    unit_of_measurement: W
    icon: mdi:sine-wave
  hba_control_pid_output:
    name: "PID output"
    min: -100000
    max: 100000
    step: 1
    unit_of_measurement: W
    icon: mdi:gauge
  hba_control_p_term:
    name: "PID P term"
    min: -100000
    max: 100000
    step: 1
    unit_of_measurement: W
    icon: mdi:alpha-p-circle
  hba_control_i_term:
    name: "PID I term"
    min: -100000
    max: 100000
    step: 1
    unit_of_measurement: W
    icon: mdi:alpha-i-circle
  hba_control_d_term:
    name: "PID D term"
    min: -100000
    max: 100000
    step: 1
    unit_of_measurement: W
    icon: mdi:alpha-d-circle
  hba_control_error_deviation:
    name: "Error deviation"
    min: -10000
    max: 10000
    step: 1
    unit_of_measurement: W
    icon: mdi:chart-bell-curve
  hba_control_pid_output_deviation:
    name: "PID output deviation"
    min: -10000
    max: 10000
    step: 1
    unit_of_measurement: W
    icon: mdi:chart-bell-curve-cumulative
  hba_control_debug:
    name: "Debug value"
    min: -10000
    max: 10000
    step: 1
    icon: mdi:bug

  # --- Peak shaving limits ---
  hba_control_power_limit_import:
    name: "Import power limit"
    min: 500
    max: 25000
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:transmission-tower-import
  hba_control_power_limit_export:
    name: "Export power limit"
    min: 500
    max: 25000
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:transmission-tower-export

  # --- Slow charge limits (battery health) ---
  # Two configurable levels: cap charge power when SoC exceeds each threshold.
  # Set power limit to 0 to disable that level (BMS handles the taper instead).
  hba_control_slow_charge_soc_threshold_1:
    name: "Slow charge SoC threshold 1"
    min: 80
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant-outline
  hba_control_slow_charge_power_limit_1:
    name: "Slow charge power limit 1"
    min: 0
    max: 10000
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:speedometer-slow
  hba_control_slow_charge_soc_threshold_2:
    name: "Slow charge SoC threshold 2"
    min: 80
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant-outline
  hba_control_slow_charge_power_limit_2:
    name: "Slow charge power limit 2"
    min: 0
    max: 10000
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:speedometer-slow

  # --- Charge/Sell strategy targets ---
  hba_strategy_charge_target_energy:
    name: "Charge target energy"
    min: 0
    max: 30
    step: 0.1
    mode: box
    unit_of_measurement: kWh
    icon: mdi:battery-arrow-up
  hba_strategy_charge_target_soc:
    name: "Charge target SoC"
    min: 15
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-80
  hba_solar_reserved_for_house:
    name: "Solar reserved for house"
    min: 0
    max: 500
    step: 0.1
    mode: box
    unit_of_measurement: kWh
    icon: mdi:home-lightning-bolt
  hba_strategy_sell_target_energy:
    name: "Sell target energy"
    min: 0
    max: 30
    step: 0.1
    mode: box
    unit_of_measurement: kWh
    icon: mdi:battery-arrow-down
  hba_strategy_sell_target_soc:
    name: "Sell target SoC"
    min: 11
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-20

  # --- Dynamic pricing (Extreme-Pair Matching) ---
  # Were hba_strategy_dynamic_v2_* until r22; renamed when v1 was removed. Values do
  # not carry over -- binary_sensor.hba_dynamic_migration_needed tells the user.
  hba_strategy_dynamic_max_cheap_hours_per_day:
    name: "Dynamic max cheap hours/day"
    min: 0
    max: 24
    step: 0.25
    unit_of_measurement: h
    mode: box
    icon: mdi:clock-minus-outline
  hba_strategy_dynamic_max_expensive_hours_per_day:
    name: "Dynamic max expensive hours/day"
    min: 0
    max: 24
    step: 0.25
    unit_of_measurement: h
    mode: box
    icon: mdi:clock-plus-outline
  hba_strategy_solar_aware_forecast_threshold_kwh:
    name: "Solar-aware forecast threshold"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: kWh
    mode: box
    icon: mdi:weather-sunny
  hba_strategy_solar_aware_house_load:
    name: "Solar-aware house load"
    min: 0
    max: 5000
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:home-lightning-bolt-outline
  hba_strategy_dynamic_threshold_delta:
    name: "Dynamic min price difference"
    min: 0
    max: 20
    step: 0.5
    mode: box
    unit_of_measurement: ct/kWh
    icon: mdi:delta

  # --- Per-battery SoC cutoffs (hba_ prefix to avoid conflict with HBC) ---
  hba_marstek_m1_charging_cutoff_capacity:
    name: "M1 charge cutoff SoC"
    min: 80
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant
  hba_marstek_m1_discharging_cutoff_capacity:
    name: "M1 discharge cutoff SoC"
    min: 11
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert
  hba_marstek_m2_charging_cutoff_capacity:
    name: "M2 charge cutoff SoC"
    min: 80
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant
  hba_marstek_m2_discharging_cutoff_capacity:
    name: "M2 discharge cutoff SoC"
    min: 11
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert
  hba_marstek_m3_charging_cutoff_capacity:
    name: "M3 charge cutoff SoC"
    min: 80
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant
  hba_marstek_m3_discharging_cutoff_capacity:
    name: "M3 discharge cutoff SoC"
    min: 11
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert
  hba_marstek_m4_charging_cutoff_capacity:
    name: "M4 charge cutoff SoC"
    min: 80
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant
  hba_marstek_m4_discharging_cutoff_capacity:
    name: "M4 discharge cutoff SoC"
    min: 11
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert
  hba_marstek_m5_charging_cutoff_capacity:
    name: "M5 charge cutoff SoC"
    min: 80
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant
  hba_marstek_m5_discharging_cutoff_capacity:
    name: "M5 discharge cutoff SoC"
    min: 11
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert
  hba_marstek_m6_charging_cutoff_capacity:
    name: "M6 charge cutoff SoC"
    min: 80
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant
  hba_marstek_m6_discharging_cutoff_capacity:
    name: "M6 discharge cutoff SoC"
    min: 11
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-alert
  hba_battery_assist_min_soc:
    name: "Battery assist minimum SoC"
    min: 5
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-low
  hba_battery_assist_max_discharge_power:
    name: "Timed EV Charge max discharge power"
    min: 0
    max: 25000
    step: 100
    mode: box
    unit_of_measurement: "W"
    icon: mdi:lightning-bolt-circle

  # --- Charge alongside EV (input_select.hba_control_strategy_during_ev_charge) ---
  # Below this much usable energy in the batteries (sensor.hba_charge_available_energy)
  # they get priority over the car; above it the car does. 0 = the car always first.
  hba_ev_battery_priority_energy:
    name: "Battery priority below (EV charging)"
    min: 0
    max: 100
    step: 0.5
    mode: box
    unit_of_measurement: kWh
    icon: mdi:battery-arrow-up
  # Car first: the batteries keep each phase below this current, so the charger's own
  # load balancing never has to slow the car down. Set it just below the charger's
  # threshold (Peblar on prod: starts throttling at ~22.5 A per phase).
  # Main fuse protection per phase, in every strategy: the batteries on a phase charge
  # (import) or discharge (export) only as far as that phase stays below this current.
  # E.g. 24 A for a 25 A main fuse. 0 = off. Needs sensor.p1_meter_power_lX for the
  # phases the batteries are on (hba_config.yaml). Software limit — not protection by
  # itself; the installation must be safe without it.
  hba_phase_current_limit:
    name: "Main fuse limit per phase"
    min: 0
    max: 80
    step: 0.5
    mode: box
    unit_of_measurement: A
    icon: mdi:fuse-alert
  # Car first: the car's max current per phase (e.g. 16 A for 11 kW). HBA keeps that
  # room free for the car on the phases it charges on, so a car that the charger's load
  # balancing throttled can go straight back up. 0 = do not reserve (needs the charger's
  # power: sensor.ev_charger_power_l1..l3 or sensor.ev_charger_power, hba_config.yaml).
  hba_ev_max_current:
    name: "EV max current per phase"
    min: 0
    max: 32
    step: 1
    mode: box
    unit_of_measurement: A
    icon: mdi:ev-station
  hba_ev_phase_current_limit:
    name: "Phase current limit (EV charging)"
    min: 6
    max: 63
    step: 0.5
    mode: box
    unit_of_measurement: A
    icon: mdi:current-ac
  # --- Power groups (batteries sharing one breaker) ---
  # Per battery its own max charge / max discharge power while it is in a power group.
  # In "Own" these limits ARE the battery's registers (44002/44003, set on the dashboard);
  # in a group HBA writes those registers to keep the group within its max power, so the
  # user's own limits move here and the group is an extra limit on top. 0 = not set: a
  # group with a member at 0 stays inactive (banner) — HBA never guesses a battery's limit
  # (an 800 W plug-in battery must not be raised to 2500 W). Prefilled from the registers
  # when a battery joins a group.
  hba_marstek_m1_max_charge_power:
    name: "M1 max charge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m1_max_discharge_power:
    name: "M1 max discharge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m2_max_charge_power:
    name: "M2 max charge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m2_max_discharge_power:
    name: "M2 max discharge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m3_max_charge_power:
    name: "M3 max charge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m3_max_discharge_power:
    name: "M3 max discharge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m4_max_charge_power:
    name: "M4 max charge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m4_max_discharge_power:
    name: "M4 max discharge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m5_max_charge_power:
    name: "M5 max charge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m5_max_discharge_power:
    name: "M5 max discharge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m6_max_charge_power:
    name: "M6 max charge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  hba_marstek_m6_max_discharge_power:
    name: "M6 max discharge power"
    min: 0
    max: 2500
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash-triangle-outline
  # Per group the most its batteries may charge or discharge together — the breaker
  # they share (16 A ≈ 3680 W; leave some margin). One value for both directions: the
  # breaker limits current, not direction. 0 = not set (group inactive, banner).
  hba_power_group_a_max_power:
    name: "Power group A max power"
    min: 0
    max: 11000
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:fuse
  hba_power_group_b_max_power:
    name: "Power group B max power"
    min: 0
    max: 11000
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:fuse
  hba_power_group_c_max_power:
    name: "Power group C max power"
    min: 0
    max: 11000
    step: 50
    mode: box
    unit_of_measurement: "W"
    icon: mdi:fuse

input_text:
  hba_strategy_active_flow:
    name: "Active strategy flow"
    max: 255
    icon: mdi:sitemap
  # ── Last-commanded register cache (Modbus write de-duplication) ─────────────
  # Format: "<mode>|<charge_w>|<discharge_w>|<epoch>", e.g.
  # "discharge|723|723|1785300000". hba_write_battery compares the desired
  # triple against this before touching Modbus and skips identical commands
  # until hba_control_write_refresh_secs has elapsed.
  #
  # Written by HBA only — never edit by hand. Clearing one is always safe: an
  # empty or unparsable value simply forces a write on the next cycle.
  hba_last_cmd_m1:
    name: "Battery M1 last command"
    max: 60
    icon: mdi:content-save-cog
  hba_last_cmd_m2:
    name: "Battery M2 last command"
    max: 60
    icon: mdi:content-save-cog
  hba_last_cmd_m3:
    name: "Battery M3 last command"
    max: 60
    icon: mdi:content-save-cog
  hba_last_cmd_m4:
    name: "Battery M4 last command"
    max: 60
    icon: mdi:content-save-cog
  hba_last_cmd_m5:
    name: "Battery M5 last command"
    max: 60
    icon: mdi:content-save-cog
  hba_last_cmd_m6:
    name: "Battery M6 last command"
    max: 60
