# hba_strategy_timed.yaml
#
# Timed strategy — up to 5 configurable time periods with per-period sub-strategies
# (A–E, as HBC v4.12+).
#
# Each period has a start/end time (input_datetime helpers) and a sub-strategy select.
# Period A is always on; B–E are optional (input_boolean.hba_strategy_timed_has_period_b..e).
#
# sensor.hba_timed_active_period decides which period applies (single source for the
# script and the dashboard's "Current period"): periods are checked A → E, the first
# match wins, no match → "Default" (strat_0). A period runs from its start up to (not
# including) its stop; a stop earlier than the start wraps past midnight (e.g.
# 22:00–06:00, as HBC's time-range switch); start == stop never matches. It re-renders
# on every minute and whenever a period setting changes.
#
# Sub-strategies available per period (same 7 options as each selector):
#   Full stop | Self-consumption | Charge | Charge PV | Zero import | Sell | Standby / peak shave
#
# flow_prefix propagation: Charge and Sell are called with flow_prefix: "Timed →"
# so the full execution chain appears in active_flow, e.g.:
#   "Timed → Charge → Charge PV → Self-consumption (charge only)"
# Other sub-strategies use the write-then-skip-label pattern instead:
#   write "Timed → Full stop" → call full_stop with skip_label: true

template:
  - sensor:
      - name: "HBA Timed Active Period"
        unique_id: hba_timed_active_period
        icon: mdi:clock-check-outline
        state: >
          {%- set t = now().strftime('%H:%M:%S') -%}
          {%- set ns = namespace(p='Default') -%}
          {%- for k in ['a', 'b', 'c', 'd', 'e'] -%}
            {%- if ns.p == 'Default' and (k == 'a' or is_state('input_boolean.hba_strategy_timed_has_period_' ~ k, 'on')) -%}
              {%- set s = states('input_datetime.hba_strategy_timed_period_' ~ k ~ '1') -%}
              {%- set e = states('input_datetime.hba_strategy_timed_period_' ~ k ~ '2') -%}
              {%- if s not in ['unknown', 'unavailable'] and e not in ['unknown', 'unavailable'] -%}
                {%- set hit = (s <= t < e) if s < e else ((t >= s or t < e) if s > e else false) -%}
                {%- if hit -%}{%- set ns.p = k | upper -%}{%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.p }}

script:
  hba_strategy_timed:
    alias: "HBA: Strategy - Timed"
    sequence:
      - variables:
          period: "{{ states('sensor.hba_timed_active_period') }}"
          sub: >-
            {%- set k = period | lower if period in ['A', 'B', 'C', 'D', 'E'] else '0' -%}
            {{ states('input_select.hba_strategy_timed_strat_' ~ k) }}
      - choose:
          - conditions: "{{ sub | trim == 'Full stop' }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "Timed → Full stop" }
              - action: script.hba_strategy_full_stop
                data: { skip_label: true }
          - conditions: "{{ sub | trim == 'Self-consumption' }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "Timed → Self-consumption" }
              - action: script.hba_strategy_self_consumption
                data: { skip_label: true }
          - conditions: "{{ sub | trim == 'Charge' }}"
            sequence:
              - action: script.hba_strategy_charge
                data: { flow_prefix: "Timed →" }
          - conditions: "{{ sub | trim == 'Charge PV' }}"
            sequence:
              - action: script.hba_strategy_charge_pv
                data: { flow_prefix: "Timed →" }
          - conditions: "{{ sub | trim == 'Zero import' }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "Timed → Zero import" }
              - action: script.hba_strategy_zero_import
                data: { skip_label: true }
          - conditions: "{{ sub | trim == 'Sell' }}"
            sequence:
              - action: script.hba_strategy_sell
                data: { flow_prefix: "Timed →" }
          - conditions: "{{ sub | trim == 'Standby / peak shave' }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "Timed → Standby / peak shave" }
              - action: script.hba_strategy_standby
                data: { skip_label: true }
