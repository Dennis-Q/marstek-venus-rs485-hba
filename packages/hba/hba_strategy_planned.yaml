# hba_strategy_planned.yaml
#
# Planned — plans charge / sell / hold per price slot over all known prices, in time order.
#
# Why: Dynamic (HBC Extreme-Pair Matching) pairs cheap and expensive hours by price rank, not by
# time: it can pair an expensive hour with a LATER cheap one, does not know a battery must be
# charged before it can sell, and cannot plan "sell tonight -> charge at night -> sell tomorrow
# morning". Dynamic stays HBC-identical; Planned is a separate strategy.
#
# How: dynamic programming over (price slot x stored energy). Per slot it may choose
#   Charge (grid, max power) | Sell (max power) | Self-consumption | Charge PV | Zero import | Full stop
# and simulates the house: average load (input_number.hba_strategy_solar_aware_house_load,
# shared with Solar-aware) minus the Solcast forecast per slot. Cost per slot =
#   import x buy price - export x sell price + wear x kWh discharged
# Battery: usable energy, max charge / discharge power (power groups and own limits included),
# round-trip efficiency (setting, 0 = the batteries' measured lifetime RTE), split evenly over
# charging and discharging. Stored energy never goes below the reserve. Energy left at the end
# of the horizon is valued at the average buy price x discharge efficiency, so the plan does
# not empty the battery just because the price data ends.
# Backward pass: value per energy level (21 levels, linear interpolation between them, so small
# hourly flows are not rounded away). Forward pass: from the real stored energy, the best
# strategy per slot -> sensor.hba_planned_strategy attribute 'plan'. Measured 0.13 s for 48
# hourly slots on the dev box; 15-minute slots work the same (slot length from the price data).
#
# Re-plans (otherwise the previous plan is kept):
#   HA start / template reload, a Planned setting or a source entity changes, new prices or a
#   new solar forecast (signature), a new slot, or the stored energy is more than
#   input_number.hba_strategy_planned_replan_drift kWh off the plan (checked every 5 min).
# Executed slots move to the 'history' attribute (last 24 h, with their prices and the stored
# energy measured at their end) -- templates cannot query the recorder, so the sensor keeps it.
#
# Reason codes (legend on the dashboard):
#   A charge from the grid for a later, dearer slot   B sell at a high price
#   C keep the energy for a later, dearer slot         D the battery covers the house
#   E the sun charges the battery                      F nothing to gain now
#   G battery empty (at reserve) or full
#
# Execution (script.hba_strategy_planned): the current slot's strategy. Charge and Sell run to
# the stored energy the plan expects at the end of the slot (attribute e1), then hold with
# Charge PV. Labels "Planned → <strategy>", so the PID-reset automations see Charge / Sell.

template:
  # ── House load profile ────────────────────────────────────────────────────────
  # Average house use per hour of the day, calculated once a night by automation
  # hba_house_load_profile_update (below) from the recorder's hourly statistics and handed over
  # with event hba_house_load_profile (a template cannot call recorder.get_statistics).
  # Trigger-based, so it keeps the profile across restarts. Read by the planner per slot.
  - triggers:
      - trigger: event
        event_type: hba_house_load_profile
    sensor:
      - name: "HBA House Load Profile"
        unique_id: hba_house_load_profile
        icon: mdi:home-clock-outline
        unit_of_measurement: kWh
        state: "{{ trigger.event.data.kwh_day if trigger.event.data.profile | length == 24 else none }}"
        attributes:
          # 24 values in W, index = local hour of the day
          profile: "{{ trigger.event.data.profile }}"
          days_used: "{{ trigger.event.data.days_used }}"
          skipped_days: "{{ trigger.event.data.skipped }}"
          window_weeks: "{{ trigger.event.data.window_weeks }}"
          sources: "{{ trigger.event.data.sources }}"
          # Source sensors without long-term statistics (recorder-excluded, no state_class, wrong
          # id): they count as 0 -- an EV charger missing here makes car charging count as house use
          no_statistics: "{{ trigger.event.data.get('no_statistics', []) }}"
          updated: "{{ now().isoformat() }}"

  - triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id: sensor.hba_energy_prices_data
      - trigger: state
        entity_id:
          - input_number.hba_strategy_planned_efficiency
          - input_number.hba_strategy_planned_wear_cost
          - input_number.hba_strategy_planned_reserve
          - input_number.hba_strategy_planned_sell_deduction
          - input_number.hba_strategy_planned_replan_drift
          - input_number.hba_strategy_solar_aware_house_load
          - input_boolean.hba_strategy_planned_skip_charge
          - input_boolean.hba_strategy_planned_skip_sell
          - input_boolean.hba_strategy_planned_skip_zero_import
          - input_text.hba_strategy_planned_sell_price_entity_id
          - input_text.hba_strategy_solar_aware_forecast_entity_id
          - input_text.hba_strategy_solar_forecast_entity_id
          - input_text.hba_strategy_solar_forecast_tomorrow_entity_id
          - sensor.hba_house_load_profile
        id: settings
    actions:
      # `this` is not available in trigger actions -- read the previous plan by entity id.
      - variables:
          prev_plan: "{{ state_attr('sensor.hba_planned_strategy', 'plan') or [] }}"
          prev_hist: "{{ state_attr('sensor.hba_planned_strategy', 'history') or [] }}"
          prev_slot: "{{ state_attr('sensor.hba_planned_strategy', 'plan_slot') | int(0) }}"
          prev_sig: "{{ state_attr('sensor.hba_planned_strategy', 'signature') or '' }}"
          step: >-
            {%- set pph = state_attr('sensor.hba_energy_prices_data', 'datapoints_per_hour') | int(1) -%}
            {{ 3600 // ([pph, 1] | max) }}
          e_now: "{{ states('sensor.hba_charge_available_energy') | float(-1) }}"
          today_solar_e: >-
            {%- set sa = states('input_text.hba_strategy_solar_aware_forecast_entity_id') | trim -%}
            {{ sa if sa not in ['', 'unknown', 'unavailable'] else states('input_text.hba_strategy_solar_forecast_entity_id') | trim }}
          tomorrow_solar_e: "{{ states('input_text.hba_strategy_solar_forecast_tomorrow_entity_id') | trim }}"
      - variables:
          now_ts: "{{ as_timestamp(now()) | int }}"
          now_slot: "{{ ((as_timestamp(now()) | int) // step) * step }}"
          # New prices or a new solar forecast: number + last start of the price marks, and
          # the two forecast totals.
          signature: >-
            {%- set raw = state_attr('sensor.hba_energy_prices_data', 'marks') -%}
            {%- set marks = (raw | from_json) if raw is string and (raw | trim)[:1] == '[' else (raw if raw is sequence else []) -%}
            {{ marks | length }}|{{ (marks | last).start if marks | length > 0 else '' }}|{{ states(today_solar_e) | float(0) | round(1) if today_solar_e != '' else '' }}|{{ states(tomorrow_solar_e) | float(0) | round(1) if tomorrow_solar_e != '' else '' }}
      - variables:
          # The slot that was running according to the previous plan, to measure the drift
          drift: >-
            {%- set row = prev_plan | selectattr('ts', 'eq', now_slot) | first | default(none) -%}
            {%- if row is none or e_now < 0 -%}-1
            {%- else -%}
              {#- Expected stored energy now. Charge and Sell run at full power until the
                  target, so they are done early in the slot (2.8 kWh at 7 kW in ~25 min); the
                  other strategies follow house use and sun, spread over the slot (straight line).
                  The row's e0 is the energy when the plan was made, so the elapsed time counts
                  from then. -#}
              {%- set made = as_timestamp(state_attr('sensor.hba_planned_strategy', 'plan_made'), 0) | int -%}
              {%- set t0 = [row.ts, made] | max -%}
              {%- set slot_end = row.ts + step -%}
              {%- set start = row.get('e0', row.e1) | float(0) -%}
              {%- set end = row.e1 | float(0) -%}
              {%- set sm = state_attr('sensor.hba_planned_strategy', 'summary') -%}
              {%- if row.a in ['Charge', 'Sell'] and sm is mapping -%}
                {%- set kw = (sm.charge_kw if row.a == 'Charge' else sm.discharge_kw) | float(0) -%}
                {%- set moved = kw * ([now_ts - t0, 0] | max) / 3600 -%}
                {%- set expected = (start + [moved, end - start] | min) if end >= start else (start - [moved, start - end] | min) -%}
              {%- else -%}
                {%- set f = ([now_ts - t0, 0] | max) / ([slot_end - t0, 1] | max) -%}
                {%- set expected = start + (end - start) * ([f, 1] | min) -%}
              {%- endif -%}
              {{ (e_now - expected) | abs | round(2) }}
            {%- endif -%}
          replan: >-
            {%- if trigger.platform in ['homeassistant', 'event'] -%}HA start / reload
            {%- elif trigger.id == 'settings' -%}settings changed
            {%- elif prev_plan | length == 0 -%}no plan yet
            {%- elif signature != prev_sig -%}new prices or forecast
            {%- elif now_slot != prev_slot -%}new slot
            {%- elif drift | float(-1) > states('input_number.hba_strategy_planned_replan_drift') | float(1) -%}off by {{ drift }} kWh
            {%- endif -%}
      - variables:
          result: >-
            {%- if replan == '' -%}
              {{ {'plan': prev_plan, 'status': state_attr('sensor.hba_planned_strategy', 'status') or 'OK',
                  'made': state_attr('sensor.hba_planned_strategy', 'plan_made'),
                  'reason': state_attr('sensor.hba_planned_strategy', 'plan_reason'),
                  'eta': state_attr('sensor.hba_planned_strategy', 'efficiency'),
                  'summary': state_attr('sensor.hba_planned_strategy', 'summary')} | tojson }}
            {%- else -%}
              {#- ── Inputs ── -#}
              {%- set raw = state_attr('sensor.hba_energy_prices_data', 'marks') -%}
              {%- set marks = (raw | from_json) if raw is string and (raw | trim)[:1] == '[' else (raw if raw is sequence else []) -%}
              {%- set emax = states('sensor.hba_usable_battery_energy') | float(0) -%}
              {%- set count = states('input_number.hba_battery_count') | int(1) -%}
              {%- set eff_set = states('input_number.hba_strategy_planned_efficiency') | float(0) -%}
              {%- set ns_eff = namespace(v=[]) -%}
              {%- for i in range(1, count + 1) -%}
                {%- set r = states('sensor.marstek_m' ~ i ~ '_lifetime_round_trip_efficiency') | float(0) -%}
                {%- if 50 <= r <= 100 -%}{%- set ns_eff.v = ns_eff.v + [r] -%}{%- endif -%}
              {%- endfor -%}
              {%- set eta = (eff_set if eff_set > 0 else ((ns_eff.v | sum / ns_eff.v | length) if ns_eff.v | length > 0 else 85)) / 100 -%}
              {%- set ec = eta ** 0.5 -%}{%- set ed = eta ** 0.5 -%}
              {#- Max power. The running slot: what the batteries allow NOW (incl. the BMS limit near
                  full). Later slots: the set limits WITHOUT the momentary BMS limit and without the
                  register dip during a power-group leader handover (prod 2026-10-29: full batteries
                  -> total max charge 2.5 kW / 0 -> the plan thought midday could only recharge at
                  2.5 kW and kept the morning sell back). Per battery: the power-group target
                  (sensor.hba_power_limits charge/discharge), else its last known limit, else the
                  register, else 2500 W. -#}
              {%- set pc_now = states('sensor.hba_total_max_charge_power') | float(0) / 1000 -%}
              {%- set pd_now = states('sensor.hba_total_max_discharge_power') | float(0) / 1000 -%}
              {%- set pl_c = state_attr('sensor.hba_power_limits', 'charge') -%}
              {%- set pl_d = state_attr('sensor.hba_power_limits', 'discharge') -%}
              {%- set lk_c = state_attr('sensor.hba_power_limits', 'last_known_charge') -%}
              {%- set lk_d = state_attr('sensor.hba_power_limits', 'last_known_discharge') -%}
              {%- set pl_c = pl_c if pl_c is mapping and is_state('sensor.hba_power_limits', 'Active') else {} -%}
              {%- set pl_d = pl_d if pl_d is mapping and is_state('sensor.hba_power_limits', 'Active') else {} -%}
              {%- set lk_c = lk_c if lk_c is mapping else {} -%}{%- set lk_d = lk_d if lk_d is mapping else {} -%}
              {%- set ns_p = namespace(c=0, d=0) -%}
              {%- for i in range(1, count + 1) -%}
                {%- set k = i | string -%}
                {%- set rc = states('number.marstek_m' ~ i ~ '_max_charge_power') | float(0) -%}
                {%- set rd = states('number.marstek_m' ~ i ~ '_max_discharge_power') | float(0) -%}
                {%- set ns_p.c = ns_p.c + (pl_c[k] if k in pl_c else (lk_c[k] if k in lk_c else (rc if rc > 50 else 2500))) | float(0) -%}
                {%- set ns_p.d = ns_p.d + (pl_d[k] if k in pl_d else (lk_d[k] if k in lk_d else (rd if rd > 50 else 2500))) | float(0) -%}
              {%- endfor -%}
              {%- set pc = ns_p.c / 1000 -%}
              {%- set pd = ns_p.d / 1000 -%}
              {%- set wear = states('input_number.hba_strategy_planned_wear_cost') | float(0) -%}
              {%- set rmin = [states('input_number.hba_strategy_planned_reserve') | float(0), emax] | min -%}
              {%- set deduct = states('input_number.hba_strategy_planned_sell_deduction') | float(0) -%}
              {%- set load_kw = states('input_number.hba_strategy_solar_aware_house_load') | float(300) / 1000 -%}
              {#- House use per local hour from sensor.hba_house_load_profile; the flat setting above
                  for a missing profile or a missing hour -#}
              {%- set prof = state_attr('sensor.hba_house_load_profile', 'profile') -%}
              {%- set prof = prof if prof is sequence and prof is not string and prof | length == 24 else [] -%}
              {%- set acts = ['Self-consumption', 'Charge PV', 'Full stop']
                             + ([] if is_state('input_boolean.hba_strategy_planned_skip_zero_import', 'on') else ['Zero import'])
                             + ([] if is_state('input_boolean.hba_strategy_planned_skip_charge', 'on') else ['Charge'])
                             + ([] if is_state('input_boolean.hba_strategy_planned_skip_sell', 'on') else ['Sell']) -%}
              {#- Tiny tie-breakers: with equal cost prefer the simpler strategy. eps prefers Charge PV
                  (holding while storing the sun), eps_dark prefers Full stop (no sun, or the sun is
                  worth more exported); the forward pass picks per slot, see 'worth' below. -#}
              {%- set eps = {'Self-consumption': 0, 'Charge PV': 0.0001, 'Zero import': 0.0002, 'Full stop': 0.0003, 'Charge': 0.0005, 'Sell': 0.0005} -%}
              {%- set eps_dark = {'Self-consumption': 0, 'Full stop': 0.0001, 'Zero import': 0.0002, 'Charge PV': 0.0003, 'Charge': 0.0005, 'Sell': 0.0005} -%}
              {%- if marks | length == 0 -%}
                {{ {'plan': [], 'status': 'No price data', 'made': now().isoformat(), 'reason': replan, 'eta': (eta * 100) | round(1)} | tojson }}
              {%- elif emax <= 0 or e_now < 0 -%}
                {{ {'plan': [], 'status': 'No battery data', 'made': now().isoformat(), 'reason': replan, 'eta': (eta * 100) | round(1)} | tojson }}
              {%- else -%}
                {#- Sell prices (optional separate sensor, e.g. market price from 2027) -#}
                {%- set se = states('input_text.hba_strategy_planned_sell_price_entity_id') | trim -%}
                {%- set ns_in = namespace(sell=[], sun=[], slots=[]) -%}
                {%- if se not in ['', 'unknown', 'unavailable'] -%}
                  {%- for e in (state_attr(se, 'prices') or []) if e is mapping and 'from' in e and 'price' in e -%}
                    {%- set ns_in.sell = ns_in.sell + [{'ts': as_timestamp(e['from'], 0) | int, 'p': e['price'] | float(0)}] -%}
                  {%- endfor -%}
                {%- endif -%}
                {#- Solcast detailedForecast: 30-minute periods, pv_estimate in kW -#}
                {%- for ent in [today_solar_e, tomorrow_solar_e] if ent != '' -%}
                  {%- for p in (state_attr(ent, 'detailedForecast') or []) if p is mapping and 'period_start' in p -%}
                    {%- set ns_in.sun = ns_in.sun + [{'ts': as_timestamp(p.period_start, 0) | int, 'kw': p.pv_estimate | float(0)}] -%}
                  {%- endfor -%}
                {%- endfor -%}
                {%- for m in marks if m is mapping -%}
                  {%- set ts = as_timestamp(m.start, 0) | int -%}
                  {%- if ts >= now_slot -%}
                    {%- set b = (m.price | float(0)) / 100 -%}
                    {%- set sm = ns_in.sell | selectattr('ts', 'eq', ts) | first | default(none) -%}
                    {%- set s = ((sm.p if sm is not none else b) - deduct) -%}
                    {#- The running slot only for its remaining part -#}
                    {%- set start = [ts, now_ts] | max -%}
                    {%- set h = (ts + step - start) / 3600 -%}
                    {%- set ns_s = namespace(kwh=0) -%}
                    {%- for p in ns_in.sun -%}
                      {%- set ov = ([ts + step, p.ts + 1800] | min - [start, p.ts] | max) / 3600 -%}
                      {%- if ov > 0 -%}{%- set ns_s.kwh = ns_s.kwh + p.kw * ov -%}{%- endif -%}
                    {%- endfor -%}
                    {%- set hr = ts | timestamp_custom('%H') | int -%}
                    {%- set w = prof[hr] if prof | length == 24 and prof[hr] is number else none -%}
                    {%- set first = ts <= now_ts -%}
                    {%- set ns_in.slots = ns_in.slots + [{'ts': ts, 'b': b, 's': s, 'h': h, 'sun': ns_s.kwh, 'load': ((w / 1000) if w is not none else load_kw) * h,
                         'pc': ([pc_now, pc] | min) if first else pc, 'pd': ([pd_now, pd] | min) if first else pd}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set slots = ns_in.slots | sort(attribute='ts') -%}
                {%- set N = slots | length -%}
                {%- if N == 0 -%}
                  {{ {'plan': [], 'status': 'No price data', 'made': now().isoformat(), 'reason': replan, 'eta': (eta * 100) | round(1)} | tojson }}
                {%- else -%}
                  {%- set K = 21 -%}{%- set dE = emax / (K - 1) -%}
                  {%- set mean_b = (slots | map(attribute='b') | sum) / N -%}
                  {#- ── Backward pass: value of each energy level per slot ── -#}
                  {%- set ns = namespace(V=[], Vs=[]) -%}
                  {%- for k in range(K) -%}{%- set ns.V = ns.V + [-(k * dE) * mean_b * ed] -%}{%- endfor -%}
                  {%- set ns.Vs = [ns.V] -%}
                  {%- for t in range(N - 1, -1, -1) -%}
                    {%- set sl = slots[t] -%}
                    {%- set nl = sl.load - sl.sun -%}{%- set d = [nl, 0] | max -%}{%- set u = [-nl, 0] | max -%}
                    {%- set cc = sl.pc * sl.h -%}{%- set cd = sl.pd * sl.h -%}
                    {%- set nv = namespace(V=[]) -%}
                    {%- for k in range(K) -%}
                      {%- set E = k * dE -%}
                      {%- set room = ([emax - E, 0] | max) / ec -%}{%- set av = ([E - rmin, 0] | max) * ed -%}
                      {%- set best = namespace(v=1e9) -%}
                      {%- for a in acts -%}
                        {%- set ch = ([u, cc, room] | min) if a in ['Self-consumption', 'Charge PV'] else (([cc, room] | min) if a == 'Charge' else 0) -%}
                        {%- set dis = ([d, cd, av] | min) if a in ['Self-consumption', 'Zero import'] else (([cd, av] | min) if a == 'Sell' else 0) -%}
                        {%- set net = d - u + ch - dis -%}
                        {%- set E2 = [[E + ch * ec - dis / ed, 0] | max, emax] | min -%}
                        {%- set x = E2 / dE -%}{%- set i = [x | int, K - 2] | min -%}{%- set f = x - i -%}
                        {%- set v = ([net, 0] | max) * sl.b - ([-net, 0] | max) * sl.s + wear * dis + (eps if sl.sun > 0.01 else eps_dark)[a] + ns.V[i] * (1 - f) + ns.V[i + 1] * f -%}
                        {%- if v < best.v -%}{%- set best.v = v -%}{%- endif -%}
                      {%- endfor -%}
                      {%- set nv.V = nv.V + [best.v] -%}
                    {%- endfor -%}
                    {%- set ns.V = nv.V -%}{%- set ns.Vs = [nv.V] + ns.Vs -%}
                  {%- endfor -%}
                  {#- ── Forward pass from the real stored energy ── -#}
                  {%- set E0 = [[e_now, 0] | max, emax] | min -%}
                  {#- What the energy already in the battery cost: carried over from the previous plan
                      (its row for the slot before this one, else the last executed slot), so it only
                      changes when something actually goes in. A fresh average of the remaining buy
                      prices made the same night-charged energy look dearer every hour as the cheap hours
                      dropped out (prod 2026-10-29). The average only without a previous value. -#}
                  {%- set prev_row = prev_plan | selectattr('ts', 'eq', now_slot - step) | first | default(none) -%}
                  {%- if prev_row is none or prev_row.get('c') is none -%}
                    {%- set prev_row = prev_hist | selectattr('ts', 'lt', now_slot) | rejectattr('c', 'none') | list | last | default(none) -%}
                  {%- endif -%}
                  {%- set per_kwh = ((prev_row.c - wear) * ed) if prev_row is not none and prev_row.get('c') is number else mean_b / ec -%}
                  {%- set fw = namespace(E=E0, basis=E0 * per_kwh, out=[], cost=0) -%}
                  {%- for t in range(N) -%}
                    {%- set sl = slots[t] -%}{%- set V = ns.Vs[t + 1] -%}
                    {%- set nl = sl.load - sl.sun -%}{%- set d = [nl, 0] | max -%}{%- set u = [-nl, 0] | max -%}
                    {%- set cc = sl.pc * sl.h -%}{%- set cd = sl.pd * sl.h -%}
                    {%- set E = fw.E -%}
                    {%- set room = ([emax - E, 0] | max) / ec -%}{%- set av = ([E - rmin, 0] | max) * ed -%}
                    {#- Ties (e.g. a full or empty battery, where several options do the same): decide by
                        what a stored kWh is worth = the slope of the value table here. That already
                        counts the power limit, e.g. extra energy at 16:00 is sold in the LAST sell
                        hour (19:00), not at the 17:00 peak. So the label also says what is right if
                        reality differs a little from the forecast. -#}
                    {%- set xm = E / dE -%}{%- set im = [xm | int, K - 2] | min -%}
                    {%- set slope = (V[im] - V[im + 1]) / dE -%}
                    {#- keep: a stored kWh is worth more later than it saves now -> do not discharge;
                        store: storing the sun is worth more than exporting it now -#}
                    {%- set keep = slope / ed > sl.b -%}
                    {%- set store = sl.sun > 0.01 and slope * ec > sl.s -%}
                    {%- set order = (['Charge PV', 'Full stop', 'Self-consumption', 'Zero import'] if store else ['Full stop', 'Charge PV', 'Zero import', 'Self-consumption'])
                                    if keep else
                                    (['Self-consumption', 'Zero import', 'Charge PV', 'Full stop'] if store else ['Zero import', 'Self-consumption', 'Full stop', 'Charge PV']) -%}
                    {%- set tie = {order[0]: 0, order[1]: 0.0001, order[2]: 0.0002, order[3]: 0.0003, 'Charge': 0.0005, 'Sell': 0.0005} -%}
                    {%- set best = namespace(v=1e9, a='Self-consumption', E2=E, ch=0, dis=0, imm=0, alt='', altv=1e9, altE=E) -%}
                    {%- for a in acts -%}
                      {%- set ch = ([u, cc, room] | min) if a in ['Self-consumption', 'Charge PV'] else (([cc, room] | min) if a == 'Charge' else 0) -%}
                      {%- set dis = ([d, cd, av] | min) if a in ['Self-consumption', 'Zero import'] else (([cd, av] | min) if a == 'Sell' else 0) -%}
                      {%- set net = d - u + ch - dis -%}
                      {%- set E2 = [[E + ch * ec - dis / ed, 0] | max, emax] | min -%}
                      {%- set x = E2 / dE -%}{%- set i = [x | int, K - 2] | min -%}{%- set f = x - i -%}
                      {%- set imm = ([net, 0] | max) * sl.b - ([-net, 0] | max) * sl.s + wear * dis -%}
                      {%- set v = imm + tie[a] + V[i] * (1 - f) + V[i + 1] * f -%}
                      {#- Keep the runner-up too: Insights shows how close each decision was -#}
                      {%- if v < best.v -%}
                        {%- set best.alt = best.a if best.v < 1e9 else '' -%}{%- set best.altv = best.v -%}{%- set best.altE = best.E2 -%}
                        {%- set best.v = v -%}{%- set best.a = a -%}{%- set best.E2 = E2 -%}{%- set best.ch = ch -%}{%- set best.dis = dis -%}{%- set best.imm = imm -%}
                      {%- elif v < best.altv -%}
                        {%- set best.alt = a -%}{%- set best.altv = v -%}{%- set best.altE = E2 -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {#- Cost of the stored energy (EUR per kWh it delivers), carried forward -#}
                    {%- set sun_in = [best.ch, u] | min -%}
                    {%- set fw.basis = fw.basis + sun_in * sl.s + (best.ch - sun_in) * sl.b -%}
                    {%- if best.dis > 0 and E > 0 -%}
                      {%- set fw.basis = fw.basis * ([1 - (best.dis / ed) / E, 0] | max) -%}
                    {%- endif -%}
                    {%- set cost_out = ((fw.basis / best.E2) / ed + wear) if best.E2 > 0.05 else none -%}
                    {%- if best.a == 'Charge' -%}{%- set code = 'A' -%}
                    {%- elif best.a == 'Sell' -%}{%- set code = 'B' -%}
                    {%- elif sun_in > 0.05 -%}{%- set code = 'E' -%}
                    {%- elif best.dis > 0.05 -%}{%- set code = 'D' -%}
                    {%- elif (d > 0.05 and E <= rmin + 0.05) or (u > 0.05 and E >= emax - 0.05) -%}{%- set code = 'G' -%}
                    {%- elif d > 0.05 and E > rmin + 0.05 -%}{%- set code = 'C' -%}
                    {%- else -%}{%- set code = 'F' -%}
                    {%- endif -%}
                    {%- set fw.out = fw.out + [{
                         'ts': sl.ts, 'b': sl.b | round(4), 's': sl.s | round(4), 'a': best.a,
                         'e0': E | round(2), 'e1': best.E2 | round(2),
                         'c': cost_out | round(3) if cost_out is not none else none,
                         'r': code, 'sun': sl.sun | round(2), 'load': sl.load | round(2),
                         'alt': best.alt, 'adv': ((best.altv - best.v) | round(3)) if best.alt != '' else none,
                         'alt_e1': best.altE | round(2)}] -%}
                    {%- set fw.E = best.E2 -%}
                    {%- set fw.cost = fw.cost + best.imm -%}
                  {%- endfor -%}
                  {#- Same hours with Self-consumption only, for the expected gain. Both totals count
                      the energy left at the end at the same end value. -#}
                  {%- set endv = mean_b * ed -%}
                  {%- set sc = namespace(E=E0, cost=0) -%}
                  {%- for sl in slots -%}
                    {%- set nl = sl.load - sl.sun -%}{%- set d = [nl, 0] | max -%}{%- set u = [-nl, 0] | max -%}
                    {%- set ch = [u, sl.pc * sl.h, ([emax - sc.E, 0] | max) / ec] | min -%}
                    {%- set dis = [d, sl.pd * sl.h, ([sc.E - rmin, 0] | max) * ed] | min -%}
                    {%- set net = d - u + ch - dis -%}
                    {%- set sc.cost = sc.cost + ([net, 0] | max) * sl.b - ([-net, 0] | max) * sl.s + wear * dis -%}
                    {%- set sc.E = [[sc.E + ch * ec - dis / ed, 0] | max, emax] | min -%}
                  {%- endfor -%}
                  {%- set plan_total = fw.cost - fw.E * endv -%}
                  {%- set sc_total = sc.cost - sc.E * endv -%}
                  {%- set summary = {'usable': emax | round(1), 'charge_kw': pc | round(1), 'discharge_kw': pd | round(1),
                       'efficiency': (eta * 100) | round(1), 'house_w': (load_kw * 1000) | round(0) | int,
                       'house_profile_days': state_attr('sensor.hba_house_load_profile', 'days_used') if prof | length == 24 else 0,
                       'reserve': rmin | round(1), 'wear': wear, 'end_value': endv | round(3),
                       'plan_cost': plan_total | round(2), 'sc_cost': sc_total | round(2),
                       'gain': (sc_total - plan_total) | round(2),
                       'until': (slots | last).ts + step} -%}
                  {{ {'plan': fw.out, 'status': 'OK', 'made': now().isoformat(), 'reason': replan, 'eta': (eta * 100) | round(1), 'summary': summary} | tojson }}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          # Executed slots: when a new slot starts, the previous one moves here with the
          # stored energy measured now (e1) next to the planned target (pe1) -- e.g. to check that a
          # spread-out Sell really sold what was planned. Last 24 h.
          history: >-
            {%- set ns_h = namespace(h=prev_hist | selectattr('ts', 'ge', now_slot - 86400) | list) -%}
            {%- if prev_slot > 0 and now_slot > prev_slot -%}
              {%- set done = prev_plan | selectattr('ts', 'eq', prev_slot) | first | default(none) -%}
              {%- if done is not none and done.ts not in (ns_h.h | map(attribute='ts') | list) -%}
                {%- set ns_h.h = ns_h.h + [{'ts': done.ts, 'b': done.b, 's': done.s, 'a': done.a, 'r': done.r,
                                             'e1': e_now | round(2) if e_now >= 0 else done.e1, 'pe1': done.e1, 'c': done.c, 'load': done.get('load')}] -%}
              {%- endif -%}
            {%- endif -%}
            {{ ns_h.h | tojson }}
    sensor:
      - name: "HBA Planned Strategy"
        unique_id: hba_planned_strategy
        icon: mdi:calendar-clock
        # The strategy for the running slot, or why there is no plan
        # result / history are JSON text when they contain null (not a Python literal) -> from_json
        state: >-
          {%- set r = result if result is mapping else (result | from_json) -%}
          {%- set row = r.plan | selectattr('ts', 'eq', now_slot) | first | default(none) -%}
          {{ row.a if row is not none else (r.status if r.status != 'OK' else 'No plan') }}
        attributes:
          plan: "{{ (result if result is mapping else (result | from_json)).plan }}"
          history: "{{ history if history is sequence and history is not string else (history | from_json) }}"
          status: "{{ (result if result is mapping else (result | from_json)).status }}"
          plan_made: "{{ (result if result is mapping else (result | from_json)).made }}"
          plan_reason: "{{ (result if result is mapping else (result | from_json)).reason }}"
          plan_slot: "{{ now_slot if replan != '' else prev_slot }}"
          signature: "{{ signature }}"
          efficiency: "{{ (result if result is mapping else (result | from_json)).eta }}"
          # Assumptions + expected cost of the plan vs Self-consumption only (Insights)
          summary: "{{ (result if result is mapping else (result | from_json)).get('summary') }}"
          drift: "{{ drift }}"
          # Stored energy the plan expects at the end of the running slot (Charge / Sell run to it)
          target_energy: >-
            {%- set row = (result if result is mapping else (result | from_json)).plan | selectattr('ts', 'eq', now_slot) | first | default(none) -%}
            {{ row.e1 if row is not none else none }}

script:
  # ── Planned dispatch ──────────────────────────────────────────────────────────
  # Runs the running slot's strategy from sensor.hba_planned_strategy. Charge / Sell run to
  # the planned end-of-slot energy (attribute target_energy), then hold with Charge PV.
  # Without a plan: Self-consumption.
  hba_strategy_planned:
    alias: "HBA: Strategy - Planned"
    sequence:
      - variables:
          act: "{{ states('sensor.hba_planned_strategy') }}"
          target: "{{ state_attr('sensor.hba_planned_strategy', 'target_energy') | float(-1) }}"
          avail: "{{ states('sensor.hba_charge_available_energy') | float(0) }}"
          # Hysteresis (prod 2026-10-29 04:32-04:44: Charge <-> Charge PV every ~30 s near full).
          # Stored energy moves in steps of ~0.05 kWh (1 % SoC of one battery) and near 100 % the
          # SoC readings jump (98.9 -> 100 -> 99.0), so a 0.05 kWh margin kept crossing the target.
          # Once Charge / Sell reached its target ("... done" in the running flow label) it only
          # resumes when the stored energy is 0.3 kWh (~1.5 % SoC) on the wrong side of the target.
          # The label is the memory -- no helper; a new slot with a clearly higher / lower target
          # resumes anyway.
          flow: "{{ states('input_text.hba_strategy_active_flow') }}"
          all_full: >-
            {%- set ns = namespace(full=true) -%}
            {%- for i in range(1, (states('input_number.hba_battery_count') | int(1)) + 1) -%}
              {%- if states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') | float(0)
                     < states('input_number.hba_marstek_m' ~ i ~ '_charging_cutoff_capacity') | float(100) -%}
                {%- set ns.full = false -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.full }}
      # Sell spread over the slot: the power needed to reach the target exactly at the end of the
      # slot = what still has to come out (AC) / time left. At or above max power (e.g. the first
      # sell hour from full batteries) it sells at full power; below it, Self-consumption with an
      # export target = that power minus the expected house use this hour, so the PID keeps the
      # house covered on top of a steady export -- instead of selling out at full power and then
      # importing for the rest of the hour at the same high price (costs money once export earns
      # less than import, 2027). Charge stays at full power (a cheap hour: grid for the house is cheap).
      - variables:
          step: >-
            {%- set pph = state_attr('sensor.hba_energy_prices_data', 'datapoints_per_hour') | int(1) -%}
            {{ 3600 // ([pph, 1] | max) }}
          t_left_h: >-
            {%- set n = as_timestamp(now()) -%}
            {{ [((((n | int) // step + 1) * step) - n) / 3600, 0.05] | max }}
          ed: "{{ ((state_attr('sensor.hba_planned_strategy', 'efficiency') | float(85)) / 100) ** 0.5 }}"
          pd_kw: "{{ states('sensor.hba_total_max_discharge_power') | float(2500) / 1000 }}"
          house_w: >-
            {%- set prof = state_attr('sensor.hba_house_load_profile', 'profile') -%}
            {%- set w = prof[now().hour] if prof is sequence and prof is not string and prof | length == 24 else none -%}
            {{ w if w is number else states('input_number.hba_strategy_solar_aware_house_load') | float(300) }}
      - variables:
          needed_kw: "{{ ([avail - target, 0] | max) * ed / t_left_h }}"
          export_w: >-
            {%- set x = [((avail - target) * ed / t_left_h) * 1000 - house_w, 0] | max -%}
            {%- if is_state('input_boolean.hba_control_has_power_limit_export', 'on') -%}
              {%- set x = [x, states('input_number.hba_control_power_limit_export') | float(5000)] | min -%}
            {%- endif -%}
            {{ x | round(0) | int }}
      - choose:
          # Charge to the target; never once every battery is at its charge cutoff (a "full"
          # target is reached per battery, not by the summed energy)
          - conditions: >-
              {{ act == 'Charge' and target >= 0 and not all_full
                 and avail < target - (0.3 if flow.startswith('Planned → Charge done') else 0.05) }}
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "Planned → Charge" }
              - choose:
                  - conditions: "{{ is_state('input_boolean.hba_control_has_power_limit_import', 'on') }}"
                    sequence:
                      - action: script.hba_strategy_self_consumption
                        data: { skip_label: true }
                default:
                  - action: script.hba_set_batteries
                    data:
                      desired_power_w: "{{ states('sensor.hba_total_max_charge_power') | float(2500) | int }}"
                      mode: "charge"
          - conditions: >-
              {{ act == 'Sell' and target >= 0
                 and avail > target + (0.3 if flow.startswith('Planned → Sell done') else 0.05) }}
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "Planned → Sell" }
              - choose:
                  # Less than max power needed: spread over the slot (label stays "Sell" -- the PID
                  # reset and the unexpected-export check key on it)
                  - conditions: "{{ needed_kw < pd_kw * 0.95 }}"
                    sequence:
                      - action: script.hba_strategy_self_consumption
                        data:
                          skip_label: true
                          charge_disabled: true
                          setpoint_override: "{{ -export_w }}"
                  - conditions: "{{ is_state('input_boolean.hba_control_has_power_limit_export', 'on') }}"
                    sequence:
                      - action: script.hba_strategy_self_consumption
                        data:
                          skip_label: true
                          charge_disabled: true
                          setpoint_override: "{{ -(states('input_number.hba_control_power_limit_export') | float(5000)) }}"
                default:
                  - action: script.hba_set_batteries
                    data:
                      desired_power_w: "{{ -(states('sensor.hba_total_max_discharge_power') | float(2500)) | int }}"
                      mode: "discharge"
          # Charge / Sell done for this slot: hold, the sun may still fill the battery
          - conditions: "{{ act in ['Charge', 'Sell', 'Charge PV'] }}"
            sequence:
              - action: script.hba_strategy_charge_pv
                data: { flow_prefix: "{{ 'Planned →' if act == 'Charge PV' else 'Planned → ' ~ act ~ ' done →' }}" }
          - conditions: "{{ act == 'Zero import' }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "Planned → Zero import" }
              - action: script.hba_strategy_zero_import
                data: { skip_label: true }
          - conditions: "{{ act == 'Full stop' }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "Planned → Full stop" }
              - action: script.hba_strategy_full_stop
                data: { skip_label: true }
        default:
          - action: input_text.set_value
            target: { entity_id: input_text.hba_strategy_active_flow }
            data: { value: "{{ 'Planned → Self-consumption' if act == 'Self-consumption' else 'Planned (' ~ act ~ ') → Self-consumption' }}" }
          - action: script.hba_strategy_self_consumption
            data: { skip_label: true }

automation:
  # ── House load profile: nightly calculation ───────────────────────────────────
  # house = sensor.p1_meter_power (+ = import) + sensor.hba_total_battery_power (+ = discharge)
  #         + solar (input_text.hba_solar_power_entity_1/2) - EV charger (input_text.hba_ev_charger_power_entity_id,
  #         empty = sensor.ev_charger_power -- the car is a separate, planned load). Each needs long-term
  #         statistics; ids without them are listed in the profile's no_statistics attribute (prod
  #         2026-10-28: sensor.ev_charger_power is recorder-excluded, so car charging counted as house use).
  # Hourly means from recorder.get_statistics over the last 1-4 whole weeks
  # (input_select.hba_house_load_window), ending at midnight. Days with < 20 hours of data are
  # incomplete; days below 60 % of the median day are absences (a holiday: ~7 kWh vs ~14-17 on prod
  # 2026-10-16..22, every one caught, no normal day) and are skipped. Average per local hour of the
  # remaining days -> event hba_house_load_profile -> sensor.hba_house_load_profile.
  # Prod analysis 2026-10-28: night ~450 W, midday ~1 kW, 17:00 ~1.5 kW, evening ~0.7 kW.
  - id: hba_house_load_profile_update
    alias: "HBA: House load profile update"
    mode: restart
    triggers:
      - trigger: time
        at: "03:15:00"
      - trigger: homeassistant
        event: start
        id: start
      - trigger: state
        entity_id:
          - input_text.hba_solar_power_entity_1
          - input_text.hba_solar_power_entity_2
          - input_text.hba_ev_charger_power_entity_id
          - input_select.hba_house_load_window
    actions:
      # Let the recorder and the integrations settle after a start
      - if:
          - condition: trigger
            id: start
        then:
          - delay: { minutes: 2 }
      - variables:
          weeks: "{{ states('input_select.hba_house_load_window').split(' ')[0] | int(2) }}"
          solar: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for i in [1, 2] -%}
              {%- set e = states('input_text.hba_solar_power_entity_' ~ i) | trim -%}
              {%- if e not in ['', 'unknown', 'unavailable'] and states[e] is not none -%}{%- set ns.l = ns.l + [e] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          ev: >-
            {%- set e = states('input_text.hba_ev_charger_power_entity_id') | trim -%}
            {%- set e = e if e not in ['', 'unknown', 'unavailable'] else 'sensor.ev_charger_power' -%}
            {{ [e] if states[e] is not none else [] }}
          end: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0).strftime('%Y-%m-%d %H:%M:%S') }}"
      - variables:
          ids: "{{ ['sensor.p1_meter_power', 'sensor.hba_total_battery_power'] + solar + ev }}"
          start: "{{ (now().replace(hour=0, minute=0, second=0, microsecond=0) - timedelta(days=7 * weeks)).strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: recorder.get_statistics
        continue_on_error: true
        data:
          start_time: "{{ start }}"
          end_time: "{{ end }}"
          statistic_ids: "{{ ids }}"
          period: hour
          types: [mean]
        response_variable: stats
      - variables:
          result: >-
            {%- set S = (stats.statistics if stats is defined and stats is mapping and 'statistics' in stats else {}) -%}
            {%- set ns = namespace(add={}, rows=[], days={}) -%}
            {#- Everything except the P1 meter, summed per hour start (EV with a minus sign) -#}
            {%- for sid in ['sensor.hba_total_battery_power'] + solar + ev -%}
              {%- set sign = -1 if sid in ev else 1 -%}
              {%- for r in S.get(sid, []) if r.mean is number -%}
                {%- set ns.add = dict(ns.add, **{r.start: ns.add.get(r.start, 0) + sign * r.mean}) -%}
              {%- endfor -%}
            {%- endfor -%}
            {%- for r in S.get('sensor.p1_meter_power', []) if r.mean is number -%}
              {%- set t = as_local(as_datetime(r.start)) -%}
              {%- set w = [r.mean + ns.add.get(r.start, 0), 0] | max -%}
              {%- set d = t.strftime('%Y-%m-%d') -%}
              {%- set ns.rows = ns.rows + [{'d': d, 'h': t.hour, 'w': w}] -%}
              {%- set prev = ns.days.get(d, [0, 0]) -%}
              {%- set ns.days = dict(ns.days, **{d: [prev[0] + w / 1000, prev[1] + 1]}) -%}
            {%- endfor -%}
            {%- set complete = ns.days.items() | selectattr('1.1', 'ge', 20) | list -%}
            {%- set totals = complete | map(attribute='1.0') | sort | list -%}
            {%- set med = totals[(totals | length) // 2] if totals | length > 0 else 0 -%}
            {%- set keep = complete | selectattr('1.0', 'ge', 0.6 * med) | map(attribute='0') | list -%}
            {%- set skipped = ns.days.keys() | reject('in', keep) | sort | list -%}
            {%- set ns2 = namespace(p=[]) -%}
            {%- for hr in range(24) -%}
              {%- set v = ns.rows | selectattr('h', 'eq', hr) | selectattr('d', 'in', keep) | map(attribute='w') | list -%}
              {%- set ns2.p = ns2.p + [((v | sum / v | length) | round(0) | int) if v | length > 0 else none] -%}
            {%- endfor -%}
            {{ {'profile': ns2.p if keep | length > 0 else [], 'days_used': keep | length, 'skipped': skipped,
                'window_weeks': weeks, 'sources': ids,
                'no_statistics': ids | reject('in', S.keys() | list) | list,
                'kwh_day': ((ns2.p | reject('none') | sum) / 1000) | round(1) if keep | length > 0 else none} | tojson }}
      - event: hba_house_load_profile
        event_data:
          profile: "{{ (result if result is mapping else (result | from_json)).profile }}"
          days_used: "{{ (result if result is mapping else (result | from_json)).days_used }}"
          skipped: "{{ (result if result is mapping else (result | from_json)).skipped }}"
          window_weeks: "{{ (result if result is mapping else (result | from_json)).window_weeks }}"
          sources: "{{ (result if result is mapping else (result | from_json)).sources }}"
          no_statistics: "{{ (result if result is mapping else (result | from_json)).no_statistics }}"
          kwh_day: "{{ (result if result is mapping else (result | from_json)).kwh_day }}"
