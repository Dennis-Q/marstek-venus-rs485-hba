# hba_config.yaml — HBA grid power sensor (template)
#
# PURPOSE
#   This file defines sensor.p1_meter_power, which HBA reads on every state
#   change of the sensor. It must be:
#     • Positive  when importing power from the grid
#     • Negative  when exporting power to the grid
#
# HOW TO USE
#   Uncomment ONE of the examples below that matches your setup and edit the
#   entity IDs to match your actual DSMR/P1 reader sensors.
#   Check Developer Tools → States to find the right entity names.
#
# ONLY THIS FILE needs editing. All other hba_*.yaml files work as-is.
#
# REQUIRED: sensor.p1_meter_power (EXAMPLE 1 or 2). Everything under "ADVANCED" further
# down is only needed for advanced features and can be left out.
#
# ─────────────────────────────────────────────────────────────────────────────

# EXAMPLE 1 — Separate consumption and production sensors (most common)
#   Common with the DSMR Reader integration and similar Dutch P1 readers.
#   Entity names vary by integration — check Developer Tools → States if
#   sensor.power_consumption / sensor.power_production don't exist in your setup.
#
# template:
#   - sensor:
#       - name: "P1 Meter Power"
#         unique_id: "p1_meter_power"
#         unit_of_measurement: "W"
#         device_class: "power"
#         state_class: "measurement"
#         state: >
#           {% set consumption = states('sensor.power_consumption') | float(0) %}
#           {% set production  = states('sensor.power_production')  | float(0) %}
#           {{ (consumption - production) | round(0) | int }}


# EXAMPLE 2 — Single combined sensor
#   Use this when your P1 reader already provides one sensor that is positive
#   on import and negative on export. Just point to it directly.
#
# template:
#   - sensor:
#       - name: "P1 Meter Power"
#         unique_id: "p1_meter_power"
#         unit_of_measurement: "W"
#         device_class: "power"
#         state_class: "measurement"
#         state: "{{ states('sensor.YOUR_COMBINED_P1_SENSOR') | float(0) | round(0) | int }}"


# ═════════════════════════════════════════════════════════════════════════════
# ADVANCED — only needed for advanced features
#
#   Everything below is OPTIONAL. Only define these sensors when you use the main
#   fuse limit per phase (Advanced settings → Power groups) or Strategy during EV
#   charge → "Charge alongside EV" with the car first. HBA works
#   fine without them; that feature then tells you on the dashboard which ones it
#   misses. Add them to the SAME `template:` → `- sensor:` list as P1 Meter Power
#   above (one `template:` key per file — a second one silently drops the first).
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# ADVANCED A — per-phase grid power (P1 meter)
#
#   HBA keeps each phase below the phase limit while the car charges. Fixed names:
#     sensor.p1_meter_power_l1 / _l2 / _l3   W, POSITIVE when importing on that phase
#     sensor.p1_meter_voltage_l1 / _l2 / _l3 V, optional (230 V is used without)
#   Only the phases your batteries are on are needed (a battery whose phase is
#   "Not set" needs all three). Missing ones are listed in a banner, and the
#   batteries then get no room on that phase while the car charges first (safe).
#   Do NOT use the meter's phase CURRENT sensor: DSMR phase current has no sign.
#   Set each battery's phase as your P1 meter numbers it (Advanced settings) — that
#   can differ from the labels in the meter cupboard.
#
# EXAMPLE 3 — separate consumption / production per phase (DSMR / HomeWizard style)
#   Entity names vary by integration — check Developer Tools → States.
#
# template:
#   - sensor:
