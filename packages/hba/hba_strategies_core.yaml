# hba_strategies_core.yaml
#
# Core infrastructure for Home Battery Assistant (HBA).
#
# Contains:
#   • The main control loop automation (P1-triggered, ~1 s)
#   • Master mode / PID preset / priority cycling / insights auto-off automations
#   • hba_run_strategy   — strategy dispatcher (reads input_select.hba_strategy)
#   • hba_apply_master_mode — pushes RS485/work-mode settings to all batteries
#   • hba_set_batteries  — distributes a target power across N batteries
#   • hba_advance_priority — rotates the priority battery index
#   • hba_apply_defaults — writes factory defaults to all user-facing helpers
#
# Strategy scripts that do the actual control logic live in separate files:
#   hba_strategy_self_consumption.yaml   (PID, most complex)
#   hba_strategy_charge_pv.yaml
#   hba_strategy_others.yaml             (full_stop, zero_import, standby)
#   hba_strategy_charge_sell.yaml        (charge, sell)
#   hba_strategy_timed.yaml
#   hba_strategy_dynamic.yaml            (+ hba_dynamic_period_calculation automation)
#   hba_strategy_dynamic_v2.yaml         (+ sensor.hba_energy_prices_data template sensor)

automation:
  # ── Control loop ─────────────────────────────────────────────────────────────
  - id: hba_control_loop
    alias: "HBA: Control loop (P1 meter triggered)"
    description: >
      Fires on every P1 meter update (~1 s) for real-time response, matching
      Node-RED behaviour. mode: single drops updates that arrive while a
      previous cycle is still running (Modbus writes), preventing queue buildup.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.p1_meter_power
    conditions:
      - condition: state
        entity_id: input_select.hba_marstek_master_battery_mode
        state: "Full control"
    actions:
      - action: script.hba_run_strategy
        data: {}

  # ── Master mode changed ───────────────────────────────────────────────────────
  - id: hba_master_mode_changed
    alias: "HBA: Master mode changed"
    description: "Applies work mode and RS485 settings to all batteries when master mode changes."
    triggers:
      - trigger: state
        entity_id: input_select.hba_marstek_master_battery_mode
    actions:
      - action: script.hba_apply_master_mode
        data: {}

  # ── PID preset changed ────────────────────────────────────────────────────────
  # Writes Kp/Ki/Kd and dampening values for the selected named preset.
  # ── PID preset changed ────────────────────────────────────────────────────────
  # All presets share Kp 0.35 / Kd 0.1 / damping 20-10 and differ ONLY in Ki.
  #
  # Energy = cycle x step / Ki: integrating the closed-loop decay, the initial excursion
  # scales as 1/(1+Kp) and the decay rate as Ki/(1+Kp), so the (1+Kp) cancels and Kp drops
  # out of what a disturbance costs. Kp only sets the peak height, L/(1+Kp). Measured on
  # production 2026-07-30 (Kp 0.35/0.55/0.75 at fixed Ki): 5.2 / 5.8 / 6.2 Wh -- flat to
  # worse, never better, because past ~0.55 the extra gain buys ringing in a loop with
  # ~1.6 s of sensing dead time. So the presets leave Kp alone.
  #
  # Ki values assume a ~1.1 s control loop (write de-duplication ON, r15+). With it off
  # the loop is ~2.2 s and the integrator accumulates half as fast per second.
  #
  # The former "Regular (original HBC)" preset has been REMOVED -- see the banner in
  # DEFAULTS.md. Node-RED HBC gates its PID behind a rate limiter (runs only when grid
  # power moved >20 W AND >2 %, with a cooldown after a slow cycle), while HBA runs the
  # PID on every P1 update. The same Ki therefore integrates far faster here, so HBC's
  # published gains are not transferable.
  - id: hba_pid_preset_changed
    alias: "HBA: PID preset changed"
    triggers:
      - trigger: state
        entity_id: input_select.hba_control_pid_presets
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.hba_control_pid_presets
                state: "Very safe"
            sequence:
              # Calmest. ~2x the grid energy per disturbance of Regular, least battery activity.
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_kp }
                data: { value: 0.35 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_ki }
                data: { value: 0.1 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_kd }
                data: { value: 0.1 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_error_signal_dampening }
                data: { value: 20 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_pid_output_dampening }
                data: { value: 10 }
          - conditions:
              - condition: state
                entity_id: input_select.hba_control_pid_presets
                state: "Safe"
            sequence:
              # Measured 4.4 Wh per 863 W step vs Regular's 3.7. Noticeably slower tail.
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_kp }
                data: { value: 0.35 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_ki }
                data: { value: 0.15 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_kd }
                data: { value: 0.1 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_error_signal_dampening }
                data: { value: 20 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_pid_output_dampening }
                data: { value: 10 }
          - conditions:
              - condition: state
                entity_id: input_select.hba_control_pid_presets
                state: "Regular"
            sequence:
              # DEFAULT. Validated on prod against the 2.25 kW night pulse: residual 143 W at +8 s, zero setpoint crossings.
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_kp }
                data: { value: 0.35 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_ki }
                data: { value: 0.22 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_kd }
                data: { value: 0.1 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_error_signal_dampening }
                data: { value: 20 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_pid_output_dampening }
                data: { value: 10 }
          - conditions:
              - condition: state
                entity_id: input_select.hba_control_pid_presets
                state: "Responsive"
            sequence:
              # Fastest measured (3.2 Wh vs Regular's 3.7 on an 863 W step). Untested against 2.25 kW steps -- may overshoot, since overshoot scales with step size.
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_kp }
                data: { value: 0.35 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_ki }
                data: { value: 0.3 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_kd }
                data: { value: 0.1 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_error_signal_dampening }
                data: { value: 20 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_pid_output_dampening }
                data: { value: 10 }

  # ── Auto-cycle priority battery ───────────────────────────────────────────────
  # Rotates hba_control_prioritize_battery to spread wear across batteries.
  - id: hba_cycle_priority
    alias: "HBA: Auto-cycle priority battery"
    mode: single
    triggers:
      - trigger: time
        at: "00:00:00"
        id: midnight
      - trigger: time_pattern
        minutes: "/30"
        id: periodic
    actions:
      - variables:
          interval: "{{ states('input_select.hba_control_priority_change_interval') }}"
      - choose:
          - conditions: "{{ interval == 'Daily' and trigger.id == 'midnight' }}"
            sequence:
              - action: script.hba_advance_priority
                data: {}
          - conditions: "{{ interval == 'Weekly' and trigger.id == 'midnight' and now().weekday() == 0 }}"
            sequence:
              - action: script.hba_advance_priority
                data: {}
          - conditions: "{{ interval == 'Auto balance' and trigger.id == 'periodic' }}"
            sequence:
              - action: script.hba_advance_priority
                data: {}

  # ── Timed EV Charge: PID reset on transitions ────────────────────────────────
  - id: hba_battery_assist_pid_reset
    alias: "HBA: Reset PID on Timed EV Charge transitions"
    description: >-
      Resets PID output to 0 when Timed EV Charge starts, stops, or when the
      self-consumption overflow guard releases while assist is active. Prevents
      PID state from a previous mode bleeding into the next cycle.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hba_battery_assist_active
        to: "on"
        id: assist_on
      - trigger: state
        entity_id: binary_sensor.hba_battery_assist_active
        to: "off"
        id: assist_off
      - trigger: state
        entity_id: binary_sensor.hba_grid_exporting_sustained
        to: "off"
        id: overflow_release
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: overflow_release
              - condition: state
                entity_id: binary_sensor.hba_battery_assist_active
                state: "off"
            sequence: []  # overflow released but assist wasn't active — no-op
        default:
          - action: input_number.set_value
            target: { entity_id: input_number.hba_control_pid_output }
            data: { value: 0 }

  # ── PID reset on direct-mode strategy entry ──────────────────────────────────
  # Fires once when sensor.hba_active_strategy transitions TO a direct-control
  # sub-strategy (Zero import, Sell, or Charge). Clears stale I-term from the
  # previous sub-strategy so the PID starts fresh without a jolt, while still
  # allowing self_consumption (called from goal_reached branches) to accumulate
  # I-term normally across cycles. Each sub-strategy is listed as a separate trigger
  # so HA logs which transition fired.
  - id: hba_direct_mode_pid_reset
    alias: "HBA: Reset PID on Sell / Charge / Zero import entry"
    description: >-
      Resets i_term and pid_output once when the active sub-strategy transitions
      to Sell, Charge, or Zero import, regardless of which parent strategy dispatched
      to it. Prevents stale integrator carry-over into direct-discharge/charge modes.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.hba_active_strategy
        to: "Zero import"
      - trigger: state
        entity_id: sensor.hba_active_strategy
        to: "Sell"
      - trigger: state
        entity_id: sensor.hba_active_strategy
        to: "Charge"
    actions:
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_i_term }
        data: { value: 0 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_pid_output }
        data: { value: 0 }

  # ── Insights debug mode auto-off ──────────────────────────────────────────────
  # Turns debug mode off after 15 minutes to avoid leaving ~1 Hz history writes
  # running indefinitely. Original Node-RED used 5 minutes; raised to 15 to give
  # longer observation windows during PID tuning. Recorder protection still applies.
  #
  # A plain `to: "on"` + `for:` trigger is NOT enough. That needs a real off->on
  # transition, and restoring the boolean to 'on' at startup is not one — so a
  # restart while Insights mode was on left it on forever. Observed on production
  # 2026-07-29: debug mode had been on for 23 h across a restart, writing
  # cycle_state and the PID terms at ~1 Hz the whole time.
  #
  # Hence the `homeassistant: start` trigger, and `mode: restart` with an explicit
  # delay rather than `for:` — that way re-toggling the boolean restarts the window
  # instead of being dropped, and a restart re-arms a full window rather than
  # killing Insights mode out from under someone mid-diagnosis.
  - id: hba_insights_mode_auto_off
    alias: "HBA: Insights mode — auto-off after 15 minutes"
    description: >-
      Turns debug mode off 15 minutes after it is switched on, so history writes
      never run indefinitely. Re-arms on HA start, because a restored 'on' state
      does not fire a state trigger.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.hba_control_is_debug_mode
        to: "on"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hba_control_is_debug_mode
        state: "on"
    actions:
      - delay:
          minutes: 15
      # Re-check: the user may have switched it off by hand during the window.
      - condition: state
        entity_id: input_boolean.hba_control_is_debug_mode
        state: "on"
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hba_control_is_debug_mode }

script:
  # ── Strategy dispatcher ───────────────────────────────────────────────────────
  # Called by hba_control_loop every ~1 s. Checks for the EV stop trigger first,
  # then dispatches to the configured strategy script.
  hba_run_strategy:
    alias: "HBA: Run active strategy"
    sequence:
      - variables:
          strategy: "{{ states('input_select.hba_strategy') }}"
          ev_entity: "{{ states('input_text.hba_strategy_ev_sensor_entity_id') | trim }}"
          ev_active: >
            {% if ev_entity not in ['', 'unknown', 'unavailable'] %}
              {{ states(ev_entity) == 'on' }}
            {% else %}
              false
            {% endif %}
      - variables:
          ev_policy: "{{ states('input_select.hba_control_strategy_during_ev_charge') }}"
          # Saturation gate for Charge PV during EV charge. Pointer not
          # configured → gate is always open (previous behaviour).
          ev_saturated: >
            {% set e = states('input_text.hba_strategy_ev_saturated_entity_id') | trim %}
            {% if e in ['', 'unknown', 'unavailable'] %}
              true
            {% else %}
              {{ states(e) == 'on' }}
            {% endif %}
      - choose:
          # Timed EV charge — forcible discharge to EV charger.
          # Abstains while binary_sensor.hba_battery_assist_waiting is on (EV not
          # drawing power 3+ min after activation, e.g. charger waiting for a tag
          # scan or the car paused itself): the dispatch then falls through to the
          # configured strategy below (ev_active is false in that state, so the
          # EV-trigger branches are skipped too). Resumes automatically on the
          # next cycle once the EV draws power.
          - conditions: >
              {{ is_state('binary_sensor.hba_battery_assist_active', 'on')
                 and not is_state('binary_sensor.hba_battery_assist_waiting', 'on') }}
            sequence:
              - choose:
                  - conditions: "{{ is_state('binary_sensor.hba_grid_exporting_sustained', 'on') }}"
                    sequence:
                      - action: input_text.set_value
                        target: { entity_id: input_text.hba_strategy_active_flow }
                        data: { value: "Timed EV charge — Grid overflow → Self-consumption" }
                      - action: script.hba_strategy_self_consumption
                        data: { skip_label: true }
                default:
                  - action: input_text.set_value
                    target: { entity_id: input_text.hba_strategy_active_flow }
                    data: { value: "Timed EV charge → Discharge to EV" }
                  - action: script.hba_set_batteries
                    data:
                      desired_power_w: >-
                        {% set hw_max = states('sensor.hba_total_max_discharge_power') | float(2500) %}
                        {% set cap = states('input_number.hba_battery_assist_max_discharge_power') | float(0) %}
                        {{ -([hw_max, cap] | min | int) if cap > 0 else -(hw_max | int) }}
                      mode: "discharge"
          # EV stop trigger overrides all strategies. What runs instead is set by
          # input_select.hba_control_strategy_during_ev_charge.
          - conditions: "{{ ev_active and ev_policy == 'Standby / peak shave' }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "EV stop trigger — Peak shave active" }
              - action: script.hba_strategy_standby
                data: { skip_label: true }
          # Charge PV during EV charge: absorb the solar residual the EV can't take.
          # No coordination with the EV controller is needed — the EV project adds
          # battery charging power back into its excess signal, so charging here is
          # invisible to the EV's phase/amp decisions, and Charge PV only eats what
          # the EV leaves exported.
          # When hba_strategy_ev_saturated_entity_id is configured, this branch
          # additionally requires the EV side to report the charger as saturated
          # (pinned at its current limit / derated by load balancing) — only then
          # is there genuinely unconsumable surplus, and the EV controller is a
          # constant load instead of a competing regulator (two loops regulating
          # the same grid signal was observed to increase import/export spread).
          # Not saturated → falls through to the EV-active branch below
          # (Full stop / Standby per policy).
          - conditions: "{{ ev_active and ev_policy == 'Charge PV' and ev_saturated }}"
            sequence:
              - action: script.hba_strategy_charge_pv
                data: { flow_prefix: "During EV charge →" }
          - conditions: "{{ ev_active }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hba_strategy_active_flow }
                data: { value: "EV stop trigger" }
              - action: script.hba_strategy_full_stop
                data: { skip_label: true }
          - conditions: "{{ strategy == 'Full stop' }}"
            sequence:
              - action: script.hba_strategy_full_stop
                data: {}
          - conditions: "{{ strategy == 'Self-consumption' }}"
            sequence:
              - action: script.hba_strategy_self_consumption
                data: {}
          - conditions: "{{ strategy == 'Timed' }}"
            sequence:
              - action: script.hba_strategy_timed
                data: {}
          - conditions: "{{ strategy == 'Dynamic' }}"
            sequence:
              - action: script.hba_strategy_dynamic
                data: {}
          - conditions: "{{ strategy == 'Dynamic v2' }}"
            sequence:
              - action: script.hba_strategy_dynamic_v2
                data: {}
          - conditions: "{{ strategy == 'Charge' }}"
            sequence:
              - action: script.hba_strategy_charge
                data: {}
          - conditions: "{{ strategy == 'Charge PV' }}"
            sequence:
              - action: script.hba_strategy_charge_pv
                data: {}
          - conditions: "{{ strategy == 'Zero import' }}"
            sequence:
              - action: script.hba_strategy_zero_import
                data: {}
          - conditions: "{{ strategy == 'Sell' }}"
            sequence:
              - action: script.hba_strategy_sell
                data: {}
          - conditions: "{{ strategy == 'Standby / peak shave' }}"
            sequence:
              - action: script.hba_strategy_standby
                data: {}

  # ── Master mode application ───────────────────────────────────────────────────
  # RS485 control mode semantics:
  #   21930 (0x55AA) = RS485 enabled  — HBA has full Modbus control
  #   21947 (0x55BB) = RS485 disabled — battery ignores Modbus writes, uses own algorithm
  # Full control → enable RS485 + set work mode to manual
  # Manual control → set work mode to manual only (RS485 unchanged; user steers via app)
  # Marstek control → disable RS485 so battery uses its own built-in algorithm
  hba_apply_master_mode:
    alias: "HBA: Apply master mode to all batteries"
    sequence:
      - variables:
          mode: "{{ states('input_select.hba_marstek_master_battery_mode') }}"
          count: "{{ states('input_number.hba_battery_count') | int(1) }}"
      # Top-level automation + PID-state handling.
      # 'Disabled' stops the P1-triggered control loop firing entirely (~1 Hz),
      # also stops the priority-cycle automation, and clears the PID memory
      # (i_term + pid_output) so a future re-enable starts clean instead of
      # resuming with a stale integrator. Matches hba_strategy_full_stop's
      # reset choice.
      # Any other mode re-enables both automations; PID memory is left alone.
      # The control loop's own condition still gates dispatch to 'Full control'.
      - choose:
          - conditions: "{{ mode == 'Disabled' }}"
            sequence:
              - action: automation.turn_off
                target:
                  entity_id:
                    - automation.hba_control_loop_p1_meter_triggered
                    - automation.hba_auto_cycle_priority_battery
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_i_term }
                data: { value: 0 }
              - action: input_number.set_value
                target: { entity_id: input_number.hba_control_pid_output }
                data: { value: 0 }
        default:
          - action: automation.turn_on
            target:
              entity_id:
                - automation.hba_control_loop_p1_meter_triggered
                - automation.hba_auto_cycle_priority_battery
      - repeat:
          count: "{{ count }}"
          sequence:
            - variables:
                bat: "m{{ repeat.index }}"
                # Don't write to unreachable entities — generates log spam
                # with no effect.
                bat_available: "{{ states('select.marstek_' ~ bat ~ '_forcible_charge_discharge') not in ['unavailable', 'unknown', 'none'] }}"
            # Stop any in-flight forcible charge/discharge BEFORE changing mode,
            # for any mode that doesn't actively keep commanding (everything
            # except Full control). Has to run while RS485 is still enabled so
            # the battery accepts the stop — that's why this comes before the
            # Marstek-control branch flips RS485 off.
            - choose:
                - conditions:
                    - "{{ mode in ['Disabled', 'Manual control', 'Marstek control'] }}"
                    - "{{ bat_available }}"
                  sequence:
                    # force: true — a handoff stop must reach the battery even if
                    # the cache says it is already stopped, and it also refreshes
                    # the cache so the next Full-control cycle starts from truth.
                    - action: script.hba_write_battery
                      data:
                        bat: "{{ bat | replace('m', '') | int(0) }}"
                        cmd_mode: "stop"
                        charge_w: 0
                        discharge_w: 0
                        force: true
            - choose:
                - conditions: "{{ mode == 'Manual control' }}"
                  sequence:
                    - action: select.select_option
                      target:
                        entity_id: "select.marstek_{{ bat }}_user_work_mode"
                      data: { option: "manual" }
                - conditions: "{{ mode == 'Full control' }}"
                  sequence:
                    - action: select.select_option
                      target:
                        entity_id: "select.marstek_{{ bat }}_user_work_mode"
                      data: { option: "manual" }
                    - action: select.select_option
                      continue_on_error: true
                      target:
                        entity_id: "select.marstek_{{ bat }}_rs485_control_mode"
                      data: { option: "enable" }
                - conditions: "{{ mode == 'Marstek control' }}"
                  sequence:
                    - action: select.select_option
                      continue_on_error: true
                      target:
                        entity_id: "select.marstek_{{ bat }}_rs485_control_mode"
                      data: { option: "disable" }
                # 'Disabled' deliberately does NOT touch RS485 or work mode —
                # it's a soft kill-switch (control loop automation off only),
                # so the batteries keep whatever state the previous mode left
                # them in. Re-selecting Full control / Marstek control re-applies
                # that mode's settings.

  # ── Battery power distribution ────────────────────────────────────────────────
  # Distributes a target power across N batteries using priority-first waterfall fill:
  #   1. Priority battery takes as much as it can (hw max, SoC eligibility, slow-charge cap).
  #   2. Each remaining battery in ascending index order takes as much of the remainder as it can.
  # Per-battery eligibility: SoC within cutoffs (±0.5 % buffer) and inverter not faulted.
  # Shares are pre-computed in a single Jinja2 namespace loop into shares_json before the
  # repeat, because Jinja2 loop iterations cannot share mutable state — variables: steps in
  # a repeat are independent and cannot decrement a running remainder across iterations.
  # ── Single point of Modbus actuation ──────────────────────────────────────────
  # Every forcible charge/discharge command goes through here so the write
  # de-duplication is applied consistently.
  #
  # WHY: each modbus.write_register to a Marstek costs ~150 ms (35 ms enforced
  # message_wait plus the round trip), and the naive scheme wrote all three
  # registers for all three batteries on every control cycle — 9 writes, ~1.15 s
  # of wall clock. Because the control loop is mode: single, that pushed the
  # effective loop period to ~2.24 s under load even though sensor.p1_meter_power
  # updates every 1.1 s: the loop was skipping every other sample precisely when
  # a load step was in progress. Measured on production 2026-07-28, 78 % of those
  # writes set a register to the value it already held.
  #
  # Skipping the redundant ones takes a regulating cycle from 9 writes to ~2
  # (only the active battery's two power registers actually change; its mode and
  # both idle batteries stay put), which halves the loop period.
  #
  # SAFETY: the cache is HBA's own record of what it last sent, not a readback —
  # the Modbus readback sensors poll every 15 s and would lag. Three things keep
  # it honest:
  #   1. hba_control_write_refresh_secs forces a full re-send at least that often,
  #      so a battery that silently drops its setpoint self-heals, and setting it
  #      to 0 restores the old always-write behaviour.
  #   2. force: true on the master-mode handoff path, which must land immediately.
  #   3. After a restart the cached epoch is stale, so the first cycle re-sends.
  hba_write_battery:
    alias: "HBA: Write battery registers (de-duplicated)"
    description: >
      Writes one battery's forcible charge/discharge triple, skipping the Modbus
      round trips when the command is unchanged and still fresh.
    mode: queued
    max: 12
    fields:
      bat:
        description: "Battery index, 1-6"
        example: 1
      cmd_mode:
        description: "stop | charge | discharge"
        example: "discharge"
      charge_w:
        description: "Value for the forcible charge power register"
        example: 723
      discharge_w:
        description: "Value for the forcible discharge power register"
        example: 723
      force:
        description: "Write even if the command is unchanged (default false)"
        example: false
    sequence:
      - variables:
          _bat: "{{ bat | int(0) }}"
          _mode: "{{ cmd_mode | default('stop') }}"
          _chg: "{{ charge_w | default(0) | int(0) }}"
          _dis: "{{ discharge_w | default(0) | int(0) }}"
          _force: "{{ force | default(false) }}"
      - variables:
          _want: "{{ _mode ~ '|' ~ _chg ~ '|' ~ _dis }}"
          _cached: "{{ states('input_text.hba_last_cmd_m' ~ _bat) | default('', true) }}"
          _refresh: "{{ states('input_number.hba_control_write_refresh_secs') | float(30) }}"
      - variables:
          # Stale, unparsable or missing cache -> age is huge -> always writes.
          _age: >-
            {%- set parts = _cached.split('|') -%}
            {%- if parts | length == 4 -%}
              {{ (as_timestamp(now()) - (parts[3] | float(0))) | round(0) | int }}
            {%- else -%}
              999999
            {%- endif -%}
          _same: "{{ _cached.rsplit('|', 1)[0] == _want }}"
      - alias: "Unchanged and still fresh — skip the three Modbus round trips"
        if:
          - condition: template
            value_template: >-
              {{ not _force and _same and _refresh > 0 and (_age | int(0)) < _refresh }}
        then:
          - stop: "Command unchanged and still fresh — skipped 3 Modbus writes"
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "number.marstek_m{{ _bat }}_forcible_charge_power"
        data: { value: "{{ _chg }}" }
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "number.marstek_m{{ _bat }}_forcible_discharge_power"
        data: { value: "{{ _dis }}" }
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: "select.marstek_m{{ _bat }}_forcible_charge_discharge"
        data: { option: "{{ _mode }}" }
      # Only cache a command we can believe landed. The writes above carry
      # continue_on_error, so an unreachable battery would otherwise be recorded
      # as "already commanded" and not retried until the refresh interval —
      # clearing the cache instead makes the next cycle write again immediately.
      - variables:
          _avail: >-
            {{ states('select.marstek_m' ~ _bat ~ '_forcible_charge_discharge')
               not in ['unavailable', 'unknown', 'none'] }}
      - action: input_text.set_value
        target:
          entity_id: "input_text.hba_last_cmd_m{{ _bat }}"
        data:
          value: >-
            {{ (_want ~ '|' ~ (as_timestamp(now()) | round(0) | int)) if _avail else '' }}

  hba_set_batteries:
    alias: "HBA: Set battery power (distribute across all)"
    description: >
      desired_power_w: positive = charge, negative = discharge.
      mode: 'stop' | 'charge' | 'discharge' | 'auto'
    fields:
      desired_power_w:
        description: "Target power in W (positive=charge, negative=discharge)"
        example: 1500
      mode:
        description: "stop | charge | discharge | auto"
        example: "auto"
    sequence:
      - variables:
          count: "{{ states('input_number.hba_battery_count') | int(1) }}"
          desired: "{{ desired_power_w | int(0) }}"
      - choose:
          # FULL STOP
          - conditions: "{{ mode == 'stop' or desired == 0 }}"
            sequence:
              - repeat:
                  count: "{{ count }}"
                  sequence:
                    - action: script.hba_write_battery
                      data:
                        bat: "{{ repeat.index }}"
                        cmd_mode: "stop"
                        charge_w: 0
                        discharge_w: 0
          # CHARGE
          - conditions: "{{ mode == 'charge' or (mode == 'auto' and desired > 0) }}"
            sequence:
              - variables:
                  sc_thr1: "{{ states('input_number.hba_control_slow_charge_soc_threshold_1') | float(95) }}"
                  sc_lim1: "{{ states('input_number.hba_control_slow_charge_power_limit_1') | float(1500) | int }}"
                  sc_thr2: "{{ states('input_number.hba_control_slow_charge_soc_threshold_2') | float(99) }}"
                  sc_lim2: "{{ states('input_number.hba_control_slow_charge_power_limit_2') | float(1000) | int }}"
              - variables:
                  # Clamp to 1..count. A priority index above battery_count silently
                  # kills ALL battery control: the waterfall below seeds its order with
                  # the priority battery regardless of whether it exists, that phantom
                  # battery is eligible on SoC so it absorbs the entire `remaining`, and
                  # the write loop then only iterates 1..count -- so every real battery
                  # gets a share of 0 and is commanded to stop, while the allocated power
                  # is never sent anywhere. Seen on production 2026-07-29: auto-balance
                  # had rotated priority to 2 at 15:00, battery_count was lowered to 1 at
                  # 15:24, and the pack sat at 0 W under a full Sell command until the
                  # index happened to return to 1. hba_advance_priority wraps correctly
                  # ((current % count) + 1), but nothing re-validates the index when
                  # battery_count itself changes.
                  priority_bat: >-
                    {%- set p = states('input_number.hba_control_prioritize_battery') | int(1) -%}
                    {{ p if (1 <= p and p <= count) else 1 }}
              - variables:
                  shares_json: >-
                    {%- set ns = namespace(remaining=desired | abs, shares={}, order=[priority_bat]) -%}
                    {%- for i in range(1, count + 1) -%}
                      {%- if i != priority_bat -%}
                        {%- set ns.order = ns.order + [i] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for bat in ns.order -%}
                      {%- set soc = states('sensor.marstek_m' ~ bat ~ '_battery_state_of_charge') | float(0) -%}
                      {%- set soc_max = states('input_number.hba_marstek_m' ~ bat ~ '_charging_cutoff_capacity') | float(100) -%}
                      {%- set hw_max = states('number.marstek_m' ~ bat ~ '_max_charge_power') | float(2500) | int -%}
                      {%- set inv = states('sensor.marstek_m' ~ bat ~ '_inverter_state') -%}
                      {%- set eligible = soc < soc_max - 0.5 and inv not in ['Fault','unknown','unavailable'] -%}
                      {%- if eligible -%}
                        {%- set eff_max = hw_max -%}
                        {%- if sc_lim2 > 0 and soc >= sc_thr2 -%}
                          {%- set eff_max = [hw_max, sc_lim2] | min -%}
                        {%- elif sc_lim1 > 0 and soc >= sc_thr1 -%}
                          {%- set eff_max = [hw_max, sc_lim1] | min -%}
                        {%- endif -%}
                        {%- set share = [ns.remaining, eff_max] | min | round(0) | int -%}
                        {%- set ns.remaining = ns.remaining - share -%}
                        {%- set ns.shares = ns.shares | combine({bat | string: share}) -%}
                      {%- else -%}
                        {%- set ns.shares = ns.shares | combine({bat | string: 0}) -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.shares | tojson }}
              - repeat:
                  count: "{{ count }}"
                  sequence:
                    - variables:
                        bat_idx: "{{ repeat.index }}"
                        soc: "{{ states('sensor.marstek_m' ~ repeat.index ~ '_battery_state_of_charge') | float(0) }}"
                        soc_max: "{{ states('input_number.hba_marstek_m' ~ repeat.index ~ '_charging_cutoff_capacity') | float(100) }}"
                        share: "{{ (shares_json | trim | from_json).get(repeat.index | string, 0) }}"
                    - choose:
                        - conditions: "{{ soc < soc_max - 0.5 and share > 0 }}"
                          sequence:
                            - action: script.hba_write_battery
                              data:
                                bat: "{{ bat_idx }}"
                                cmd_mode: "charge"
                                charge_w: "{{ share }}"
                                discharge_w: "{{ share }}"
                            - action: input_datetime.set_datetime
                              target:
                                entity_id: "input_datetime.hba_last_active_m{{ bat_idx }}"
                              data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
                      default:
                        # Idle-timer check mirrors Node-RED getStopSolution():
                        # keep relay engaged at 1 W (charge direction) while the
                        # battery was recently active; hard-stop only after idle_time.
                        - variables:
                            bat_last_ts: >
                              {% set ts = as_timestamp(states('input_datetime.hba_last_active_m' ~ bat_idx), 0) | float(0) %}
                              {{ ts if ts > 0 else as_timestamp(now()) }}
                            bat_time_idle: "{{ as_timestamp(now()) - bat_last_ts }}"
                            idle_secs: "{{ states('input_number.hba_control_idle_time') | float(5) * 60 }}"
                        - choose:
                            - conditions: "{{ bat_time_idle < idle_secs }}"
                              sequence:
                                - action: script.hba_write_battery
                                  data:
                                    bat: "{{ bat_idx }}"
                                    cmd_mode: "charge"
                                    charge_w: 1
                                    discharge_w: 1
                          default:
                            - action: script.hba_write_battery
                              data:
                                bat: "{{ bat_idx }}"
                                cmd_mode: "stop"
                                charge_w: 0
                                discharge_w: 0
          # DISCHARGE
          - conditions: "{{ mode == 'discharge' or (mode == 'auto' and desired < 0) }}"
            sequence:
              - variables:
                  # Clamp to 1..count. A priority index above battery_count silently
                  # kills ALL battery control: the waterfall below seeds its order with
                  # the priority battery regardless of whether it exists, that phantom
                  # battery is eligible on SoC so it absorbs the entire `remaining`, and
                  # the write loop then only iterates 1..count -- so every real battery
                  # gets a share of 0 and is commanded to stop, while the allocated power
                  # is never sent anywhere. Seen on production 2026-07-29: auto-balance
                  # had rotated priority to 2 at 15:00, battery_count was lowered to 1 at
                  # 15:24, and the pack sat at 0 W under a full Sell command until the
                  # index happened to return to 1. hba_advance_priority wraps correctly
                  # ((current % count) + 1), but nothing re-validates the index when
                  # battery_count itself changes.
                  priority_bat: >-
                    {%- set p = states('input_number.hba_control_prioritize_battery') | int(1) -%}
                    {{ p if (1 <= p and p <= count) else 1 }}
              - variables:
                  shares_json: >-
                    {%- set ns = namespace(remaining=desired | abs, shares={}, order=[priority_bat]) -%}
                    {%- for i in range(1, count + 1) -%}
                      {%- if i != priority_bat -%}
                        {%- set ns.order = ns.order + [i] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for bat in ns.order -%}
                      {%- set soc = states('sensor.marstek_m' ~ bat ~ '_battery_state_of_charge') | float(0) -%}
                      {%- set soc_min = states('input_number.hba_marstek_m' ~ bat ~ '_discharging_cutoff_capacity') | float(13) -%}
                      {%- set hw_max = states('number.marstek_m' ~ bat ~ '_max_discharge_power') | float(2500) | int -%}
                      {%- set inv = states('sensor.marstek_m' ~ bat ~ '_inverter_state') -%}
                      {%- set eligible = soc > soc_min + 0.5 and inv not in ['Fault','unknown','unavailable'] -%}
                      {%- if eligible -%}
                        {%- set share = [ns.remaining, hw_max] | min | round(0) | int -%}
                        {%- set ns.remaining = ns.remaining - share -%}
                        {%- set ns.shares = ns.shares | combine({bat | string: share}) -%}
                      {%- else -%}
                        {%- set ns.shares = ns.shares | combine({bat | string: 0}) -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.shares | tojson }}
              - repeat:
                  count: "{{ count }}"
                  sequence:
                    - variables:
                        bat_idx: "{{ repeat.index }}"
                        soc: "{{ states('sensor.marstek_m' ~ repeat.index ~ '_battery_state_of_charge') | float(0) }}"
                        soc_min: "{{ states('input_number.hba_marstek_m' ~ repeat.index ~ '_discharging_cutoff_capacity') | float(13) }}"
                        share: "{{ (shares_json | trim | from_json).get(repeat.index | string, 0) }}"
                    - choose:
                        - conditions: "{{ soc > soc_min + 0.5 and share > 0 }}"
                          sequence:
                            - action: script.hba_write_battery
                              data:
                                bat: "{{ bat_idx }}"
                                cmd_mode: "discharge"
                                charge_w: "{{ share }}"
                                discharge_w: "{{ share }}"
                            - action: input_datetime.set_datetime
                              target:
                                entity_id: "input_datetime.hba_last_active_m{{ bat_idx }}"
                              data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
                      default:
                        # Idle-timer check mirrors Node-RED getStopSolution():
                        # keep relay engaged at 1 W (discharge direction) while
                        # the battery was recently active; hard-stop after idle_time.
                        - variables:
                            bat_last_ts: >
                              {% set ts = as_timestamp(states('input_datetime.hba_last_active_m' ~ bat_idx), 0) | float(0) %}
                              {{ ts if ts > 0 else as_timestamp(now()) }}
                            bat_time_idle: "{{ as_timestamp(now()) - bat_last_ts }}"
                            idle_secs: "{{ states('input_number.hba_control_idle_time') | float(5) * 60 }}"
                        - choose:
                            - conditions: "{{ bat_time_idle < idle_secs }}"
                              sequence:
                                - action: script.hba_write_battery
                                  data:
                                    bat: "{{ bat_idx }}"
                                    cmd_mode: "discharge"
                                    charge_w: 1
                                    discharge_w: 1
                          default:
                            - action: script.hba_write_battery
                              data:
                                bat: "{{ bat_idx }}"
                                cmd_mode: "stop"
                                charge_w: 0
                                discharge_w: 0

  # ── Priority rotation ─────────────────────────────────────────────────────────
  # Advances hba_control_prioritize_battery by 1 (wraps around at battery_count).
  # Called by hba_cycle_priority automation.
  hba_advance_priority:
    alias: "HBA: Advance priority battery"
    sequence:
      - variables:
          count: "{{ states('input_number.hba_battery_count') | int(1) }}"
          current: "{{ states('input_number.hba_control_prioritize_battery') | int(1) }}"
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_prioritize_battery }
        data: { value: "{{ (current % count) + 1 }}" }

  # ── Timed EV Charge section defaults ─────────────────────────────────────────
  # Narrow reset for timed EV charge helpers only — leaves all other HBA settings
  # untouched. Surfaced as a button in the Timed EV Charge view, useful after an
  # update that added the feature.
  hba_apply_battery_assist_defaults:
    alias: "HBA: Apply Timed EV Charge defaults"
    description: >-
      Resets only the battery assist helpers to their default values.
      Leaves every other HBA setting untouched.
    sequence:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hba_battery_assist_enabled }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hba_battery_assist_start_time }
        data: { time: "05:00:00" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hba_battery_assist_end_time }
        data: { time: "07:00:00" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_battery_assist_min_soc }
        data: { value: 20 }
      - action: input_text.set_value
        target: { entity_id: input_text.hba_battery_assist_car_connected_entity }
        data: { value: "" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_battery_assist_max_discharge_power }
        data: { value: 0 }

  # ── Factory defaults ──────────────────────────────────────────────────────────
  # Writes sensible starting values to all user-configurable helpers.
  # Safe to re-run at any time; never touches internal state (i_term, timestamps, etc.).
  # Run once after fresh install via Developer Tools → Services → script.turn_on →
  # script.hba_apply_defaults, or via a button card on the dashboard.
  hba_apply_defaults:
    alias: "HBA: Apply default settings"
    description: >
      Sets all user-configurable helpers to factory defaults.
      Run once after fresh install to avoid HA minimums as starting values.
      Safe to re-run at any time — does not touch internal state helpers
      (i_term, pid_output, timestamps, etc.).
    sequence:
      # ── Master mode & strategy ────────────────────────────────────────────────
      - action: input_select.select_option
        target: { entity_id: input_select.hba_marstek_master_battery_mode }
        data: { option: "Full control" }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy }
        data: { option: "Self-consumption" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_battery_count }
        data: { value: 1 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_prioritize_battery }
        data: { value: 1 }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_control_priority_change_interval }
        data: { option: "Auto balance" }
      # ── PID parameters ────────────────────────────────────────────────────────
      - action: input_select.select_option
        target: { entity_id: input_select.hba_control_pid_presets }
        data: { option: "Very safe" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_target_grid_consumption }
        data: { value: 0 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_kp }
        data: { value: 0.35 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_ki }
        data: { value: 0.1 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_kd }
        data: { value: 0.1 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_pid_output_dampening }
        data: { value: 10 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_error_signal_dampening }
        data: { value: 20 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_hysteresis }
        data: { value: 20 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_idle_time }
        data: { value: 5 }
      # 30 s: bounded exposure if a battery drops its setpoint, while still
      # eliminating ~78 % of the Modbus writes. 0 = write every cycle.
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_write_refresh_secs }
        data: { value: 30 }
      # ── Peak shaving ──────────────────────────────────────────────────────────
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hba_control_has_power_limit_import
            - input_boolean.hba_control_has_power_limit_export
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_power_limit_import }
        data: { value: 5000 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_power_limit_export }
        data: { value: 5000 }
      # ── Slow charge limits ────────────────────────────────────────────────────
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_slow_charge_soc_threshold_1 }
        data: { value: 95 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_slow_charge_power_limit_1 }
        data: { value: 1500 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_slow_charge_power_limit_2 }
        data: { value: 1000 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_control_slow_charge_soc_threshold_2 }
        data: { value: 99 }
      # ── Charge/Sell targets ───────────────────────────────────────────────────
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_charge_goal }
        data: { option: "batteries are full" }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_charge_goal_reached }
        data: { option: "Full stop" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_charge_target_energy }
        data: { value: 5 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_charge_target_soc }
        data: { value: 90 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_solar_reserved_for_house }
        data: { value: 0 }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_sell_goal }
        data: { option: "batteries are empty" }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_sell_goal_reached }
        data: { option: "Full stop" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_sell_target_energy }
        data: { value: 2 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_sell_target_soc }
        data: { value: 20 }
      # ── Timed strategy ────────────────────────────────────────────────────────
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hba_strategy_timed_has_period_b
            - input_boolean.hba_strategy_timed_has_period_c
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_timed_strat_0 }
        data: { option: "Self-consumption" }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_timed_strat_a }
        data: { option: "Charge" }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_timed_strat_b }
        data: { option: "Sell" }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_timed_strat_c }
        data: { option: "Self-consumption" }
      # ── Dynamic strategy ──────────────────────────────────────────────────────
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_dynamic_data_source }
        data: { option: "Frank Energie" }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_dynamic_default }
        data: { option: "Self-consumption" }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_dynamic_cheapest }
        data: { option: "Charge" }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_strategy_dynamic_expensive }
        data: { option: "Self-consumption" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_dynamic_cheapest_hrs }
        data: { value: 4 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_dynamic_expensive_hrs }
        data: { value: 2 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_dynamic_threshold_cheapest_period }
        data: { value: 5 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_dynamic_threshold_delta }
        data: { value: 5 }
      # ── Dynamic v2 ────────────────────────────────────────────────────────────
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_dynamic_v2_max_cheap_hours_per_day }
        data: { value: 0 }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_dynamic_v2_max_expensive_hours_per_day }
        data: { value: 0 }
      # ── Per-battery SoC cutoffs (all 6 slots) ────────────────────────────────
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.hba_marstek_m1_charging_cutoff_capacity
            - input_number.hba_marstek_m2_charging_cutoff_capacity
            - input_number.hba_marstek_m3_charging_cutoff_capacity
            - input_number.hba_marstek_m4_charging_cutoff_capacity
            - input_number.hba_marstek_m5_charging_cutoff_capacity
            - input_number.hba_marstek_m6_charging_cutoff_capacity
        data: { value: 100 }
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.hba_marstek_m1_discharging_cutoff_capacity
            - input_number.hba_marstek_m2_discharging_cutoff_capacity
            - input_number.hba_marstek_m3_discharging_cutoff_capacity
            - input_number.hba_marstek_m4_discharging_cutoff_capacity
            - input_number.hba_marstek_m5_discharging_cutoff_capacity
            - input_number.hba_marstek_m6_discharging_cutoff_capacity
        # Default 12% works for Venus E v1/v2/v3. Venus E v3.0 users may prefer 13%:
        # the v3.0 firmware has a ~2% hysteresis and won't discharge below ~13% in practice.
        data: { value: 12 }
      # ── Solar forecast entity IDs (Solcast integration) ───────────────────────
      # Must be forecast_today, NOT forecast_remaining_today: only forecast_today/
      # _tomorrow carry the detailedForecast attribute the solar outlook sensor needs.
      - action: input_text.set_value
        target: { entity_id: input_text.hba_strategy_solar_forecast_entity_id }
        data: { value: "sensor.solcast_pv_forecast_forecast_today" }
      - action: input_text.set_value
        target: { entity_id: input_text.hba_strategy_solar_forecast_tomorrow_entity_id }
        data: { value: "sensor.solcast_pv_forecast_forecast_tomorrow" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_strategy_solar_aware_forecast_threshold_kwh }
        data: { value: 20 }
      # ── Frank Energie entity ID ───────────────────────────────────────────────
      - action: input_text.set_value
        target: { entity_id: input_text.hba_strategy_dynamic_frank_sensor_entity_id }
        data: { value: "sensor.frank_energie_prijzen_gemiddelde_elektriciteitsprijs_alle_uren_all_in" }
      # ── Misc ──────────────────────────────────────────────────────────────────
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hba_control_is_debug_mode }
      - action: input_select.select_option
        target: { entity_id: input_select.hba_control_strategy_during_ev_charge }
        data: { option: "Full stop" }
      - action: input_text.set_value
        target: { entity_id: input_text.hba_strategy_ev_sensor_entity_id }
        data: { value: "" }
      - action: input_text.set_value
        target: { entity_id: input_text.hba_strategy_ev_saturated_entity_id }
        data: { value: "" }
      # ── Notifications ─────────────────────────────────────────────────────────
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hba_notifications_enabled }
      - action: input_text.set_value
        target: { entity_id: input_text.hba_notify_entity_id }
        data: { value: "" }
      # ── Battery assist ────────────────────────────────────────────────────────
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hba_battery_assist_enabled }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hba_battery_assist_start_time }
        data: { time: "05:00:00" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hba_battery_assist_end_time }
        data: { time: "07:00:00" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_battery_assist_min_soc }
        data: { value: 20 }
      - action: input_text.set_value
        target: { entity_id: input_text.hba_battery_assist_car_connected_entity }
        data: { value: "" }
      - action: input_number.set_value
        target: { entity_id: input_number.hba_battery_assist_max_discharge_power }
        data: { value: 0 }
      # ── HBC coexistence ───────────────────────────────────────────────────────
      - action: input_text.set_value
        target: { entity_id: input_text.hba_hbc_nodered_addon_slug }
        data: { value: "a0d7b954_nodered" }
